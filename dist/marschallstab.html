/* ── Das Blatt eines Mannes ──
   Was in der Chronik als eine Zeile steht, war ein ganzer Feldzug. Hier steht
   er ausgeschrieben: womit er einrückte, was er unterwegs entschieden hat und
   womit er aufgehört hat. Ältere Einträge kennen diese Felder nicht — dann
   bleibt es bei der Zeile, und das Blatt sagt das auch. */
function zeigeBlatt(i){
  const c = META.chronik[i];
  if(!c){ zeigeTitel(); return; }
  const zeile = (k,v)=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`;

  if(!c.attr){
    app.innerHTML = `<div class="card"><div class="ch"><span>${esc(c.name)}</span><span>${esc(c.ende)}</span></div>
      <div class="cb"><div class="note">Von diesem Mann ist nur die Zeile geblieben — er stammt aus einer Fassung,
      die noch kein Blatt geführt hat. ${esc(c.rang)}, ${c.punkte} Punkte.</div>
      <div style="margin-top:16px"><button class="plain" onclick="zeigeTitel()">Zurück zur Chronik</button></div>
      </div></div>`;
    return;
  }

  const taten = c.log.length ? c.log.map(z=>{
    const t = z.split(': '), n = KAPITEL.find(x=>x.id===t[0]);
    const wo = n ? ((n.datum||'').split(' · ')[1] || n.ort || t[0]) : t[0];
    return `<div class="blattzeile"><span class="blattort">${esc(wo)}</span><span>${esc(t.slice(1).join(': '))}</span></div>`;
  }).join('') : '<p class="hinweis">Er hat nichts entschieden, was jemand aufgeschrieben hätte.</p>';

  const fert = FERTIGKEITEN.filter(([k])=>c.fert[k]>10);
  app.innerHTML = `<div class="stage">${verlauf()}
    <div>
      <div class="card"><div class="ch"><span>${esc(c.name)}</span><span>${esc(c.ort||'')}</span></div>
        <div class="cb">
          <div class="rangzeile">${rangabzeichen({rang:c.rangN||1, zweig:c.zweig})}
            <p class="whorank">${esc(c.rang)} · ${esc(c.herkunft||'')} · 32. Halbbrigade</p></div>
          <div class="note ${c.gefallen?'red':'green'}">${c.gefallen
            ? esc(c.ende)+'. Von den Stationen dieses Feldzugs hat er '+c.stationen+' erreicht.'
            : esc(c.ende)+'. Er hat den Feldzug überstanden — '+c.stationen+' Stationen.'}</div>
          <div class="lage"><div class="lagekopf">Was er unterwegs entschieden hat</div>${taten}</div>
        </div></div>
      <div class="card"><div class="ch"><span>Wertung</span><span>${c.punkte} Veteranenpunkte</span></div>
        <div class="cb">${wertungsTabelleAus(c)}
        <div style="margin-top:16px"><button class="plain" onclick="zeigeTitel()">Zurück zur Chronik</button></div>
        </div></div>
    </div>
    <aside class="card"><div class="ch"><span>Sein Zustand am Ende</span></div><div class="cb">
      <p class="mini">Attribute</p>
      ${ATTRIBUTE.map(([k,n])=>zeile(mitHilfe(k,n), c.attr[k])).join('')}
      <div class="rule"></div>
      <p class="mini">Fertigkeiten</p>
      ${fert.length ? fert.map(([k,n])=>zeile(mitHilfe(k,n), c.fert[k])).join('') : '<div class="kv"><span>alle bei 10</span><b>—</b></div>'}
      <div class="rule"></div>
      <p class="mini">Ausrüstung · Zustand</p>
      ${c.ausr.filter(a=>a.verschleiss>0).map(a=>zeile(esc(a.name), a.zustand)).join('')}
      <div class="rule"></div>
      ${zeile('Ruf', c.ruf)}${zeile('Gunst Martel', c.gunst)}${zeile('Kameradschaft', c.kameradschaft)}
      ${c.lebenMax ? zeile('Leben', c.leben+' / '+c.lebenMax) : ''}
      ${zeile('Belastung', c.belastung)}${zeile('Atem', c.atem)}${zeile('Geld', c.geld+' F')}
      ${zeile('Im Tagesbefehl', c.nennungen+'×')}
      ${zeile('Wunden', c.wunden.length ? c.wunden.map(esc).join(', ') : 'keine')}
    </div></aside>
  </div>`;
  kopfzeile();
}

/* ── Veteranenpunkte ausgeben ──
   Zwei Arten, sie loszuwerden: Ausrüstung als Ganzes, oder Ausbildung in
   einzelnen Punkten. Die Punkte werden mit jedem Zehnerbereich teurer
   (PRO_PUNKT in grundwerte.js) — von 10 auf 20 kostet 10 VP, von 50 auf 60
   schon 40. Damit kauft man sich einen Vorsprung, aber nie eine Laufbahn:
   Rang, Ruf und Gunst bleiben unkäuflich (Invariante 3). */

let AUSWAHL = [], PUNKTE = {};
const PUNKT_SCHRITT = 5;
function istAttribut(k){ return ATTRIBUTE.some(([a])=>a===k); }

/* Der Preis rechnet vom **tatsächlichen** Wert, nicht vom Sockel: Die Erschaffung
   kommt zuerst, also steht schon fest, was Herkunft und Pool ergeben haben. Wer
   als Wilderer mit Muskete 40 anfängt, zahlt für den nächsten Punkt mehr als
   einer, der bei 10 steht — das ist der Sinn von PRO_PUNKT. */
function istWert(k){
  const h = HERKUENFTE.find(x=>x.id===(ERSCH&&ERSCH.herkunft)) || {attr:{},fert:{}};
  return istAttribut(k)
    ? Math.max(0, Math.min(70, (ERSCH?ERSCH.attr[k]:20) + (h.attr[k]||0)))
    : Math.max(0, Math.min(60, 10 + (h.fert[k]||0)));
}
function punktGrenze(k){ return istAttribut(k) ? 70 : 60; }   // darüber nur noch im Feld
function punktKosten(k){ const b = istWert(k); return kostenVon(b, b + (PUNKTE[k]||0)); }
function gesamtKosten(){
  return AUSWAHL.reduce((s,id)=>s+LADEN.find(p=>p.id===id).vp,0)
       + Object.keys(PUNKTE).reduce((s,k)=>s+punktKosten(k),0);
}

function punktZeile(k,n){
  const p = PUNKTE[k]||0, ist = istWert(k);
  return `<div class="punktzeile ${p?'gewaehlt':''}" id="pz_${k}">
    <span>${mitHilfe(k,n)}</span>
    <span class="punktwert" id="pw_${k}">${ist}${p?` <i>→</i> <b>${ist+p}</b>`:''}</span>
    <span class="punktvp ${p?'':'aus'}" id="pv_${k}">${p?punktKosten(k)+' VP':''}</span>
    <span><button class="pmbtn" onclick="stellePunkt('${k}',-PUNKT_SCHRITT)" id="pm_${k}">−</button>
    <button class="pmbtn" onclick="stellePunkt('${k}',PUNKT_SCHRITT)" id="pa_${k}">+</button></span>
  </div>`;
}

/* Zweiter Schritt der Erschaffung: Was der Vorrat aus dem fertigen Mann macht. */
function zeigeLaden(){
  if(!ERSCH || !ERSCH.herkunft){ zeigeErschaffung(); return; }
  AUSWAHL = []; PUNKTE = {};
  const zeilen = LADEN.map(p=>`<tr id="kz_${p.id}"><td class="k">${p.label}</td><td class="d">${p.beschr}</td>
    <td class="n">${p.vp}</td><td class="n"><button class="plain" style="padding:4px 12px;font-size:13px"
    onclick="waehle('${p.id}')" id="kb_${p.id}">wählen</button></td></tr>`).join('');
  const h = HERKUENFTE.find(x=>x.id===ERSCH.herkunft);
  app.innerHTML = `
  <div class="card"><div class="ch"><span>Zweiter Schritt · Veteranenpunkte</span><span id="vpanz">${META.vp} verfügbar</span></div>
   <div class="cb">
    <div class="note"><b>${esc(ERSCH.name)}</b>, ${esc(h.name)}. Die Werte unten sind die, mit denen er einrücken würde.
    Der Vorrat ist die Punktzahl deines besten Laufs; er wird nicht verbraucht, sondern bei jedem Neustart neu verteilt.
    ${META.vp===0?'<br><br><b>Beim ersten Mal hast du nichts.</b> Das gehört dazu — der erste Mann rückt ein, wie er ist.':''}</div>
   </div></div>

  <div class="card"><div class="ch"><span>Attribute ergänzen</span><span>je ${PUNKT_SCHRITT} Punkte · höchstens 70</span></div>
   <div class="cb">
    <p class="hinweis">Gerechnet wird vom jetzigen Wert. Der erste Zehner kostet 1 VP je Punkt, der fünfte schon 4 — wer schon hoch steht, zahlt für jeden weiteren Punkt mehr.</p>
    ${ATTRIBUTE.map(([k,n])=>punktZeile(k,n)).join('')}
   </div></div>

  <div class="card"><div class="ch"><span>Fertigkeiten ergänzen</span><span>je ${PUNKT_SCHRITT} Punkte · höchstens 60</span></div>
   <div class="cb">
    <p class="hinweis">Alle beginnen bei 10, sofern die Herkunft nichts anderes mitgebracht hat. Was darüber hinausgeht, musst du dir im Feld verdienen.</p>
    ${FERTIGKEITEN.map(([k,n])=>punktZeile(k,n)).join('')}
   </div></div>

  <div class="card"><div class="ch"><span>Ausrüstung</span><span>fertige Stücke statt einzelner Punkte</span></div>
   <div class="cb">
    <table><tr><th>Kauf</th><th>Wirkung</th><th class="n">VP</th><th class="n"></th></tr>${zeilen}</table>
    <div style="margin-top:18px;display:flex;gap:10px">
      <button class="plain" onclick="zeigeErschaffung()">Zurück zur Erschaffung</button>
      <button class="plain haupt" id="startbtn" onclick="starte()">Einrücken</button></div>
   </div></div>`;
  aktualisiereLaden();
}
function waehle(id){
  const i = AUSWAHL.indexOf(id);
  if(i>=0) AUSWAHL.splice(i,1);
  else { AUSWAHL.push(id); if(gesamtKosten() > META.vp) AUSWAHL.pop(); }
  aktualisiereLaden();
}
function stellePunkt(k,d){
  const alt = PUNKTE[k]||0, neu = alt + d;
  if(neu < 0 || istWert(k)+neu > punktGrenze(k)) return;
  PUNKTE[k] = neu;
  if(gesamtKosten() > META.vp){ PUNKTE[k] = alt; }     // der Vorrat ist die Grenze
  if(!PUNKTE[k]) delete PUNKTE[k];
  aktualisiereLaden();
}
function aktualisiereLaden(){
  const rest = META.vp - gesamtKosten();
  document.getElementById('vpanz').textContent = `${rest} von ${META.vp} übrig`;
  LADEN.forEach(p=>{
    const b = document.getElementById('kb_'+p.id), z = document.getElementById('kz_'+p.id);
    const drin = AUSWAHL.includes(p.id);
    b.textContent = drin?'gewählt':'wählen';
    b.disabled = !drin && p.vp>rest;
    z.className = drin?'gewaehlt':'';
    b.className = 'plain'+(drin?' gewaehlt':'');
  });
  ATTRIBUTE.concat(FERTIGKEITEN).forEach(([k])=>{
    const p = PUNKTE[k]||0, b = istWert(k);
    const pw = document.getElementById('pw_'+k), pv = document.getElementById('pv_'+k);
    pw.innerHTML = p ? `${b} <i>→</i> <b>${b+p}</b>` : String(b);
    pv.textContent = p?punktKosten(k)+' VP':''; pv.className = 'punktvp'+(p?'':' aus');
    document.getElementById('pz_'+k).className = 'punktzeile'+(p?' gewaehlt':'');
    document.getElementById('pm_'+k).disabled = !p;
    document.getElementById('pa_'+k).disabled =
      b+p+PUNKT_SCHRITT > punktGrenze(k) || kostenVon(b+p, b+p+PUNKT_SCHRITT) > rest;
  });
}

/* ── Charaktererschaffung ── */
const POOL = 120, SOCKEL = 20, MAXE = 70;
let ERSCH = null;
function zeigeErschaffung(neu){
  if(neu || !ERSCH){
    ERSCH = {name:'', herkunft:null, attr:{}};
    ATTRIBUTE.forEach(([k])=> ERSCH.attr[k]=SOCKEL);
  }
  const zeilen = ATTRIBUTE.map(([k,n])=>`
    <div class="attrrow">
      <span class="attrname">${mitHilfe(k,n)}${k==='bildung'?' <span style="color:var(--faint);font-size:11px">(fest)</span>':''}</span>
      ${balken('b-brass',ERSCH.attr[k],100).replace('class="bar','id="ab_'+k+'" class="bar')}
      <span class="attrval" id="av_${k}">${ERSCH.attr[k]}</span>
      <span><button class="pmbtn" onclick="stelle('${k}',-10)" id="am_${k}">−</button>
      <button class="pmbtn" onclick="stelle('${k}',10)" id="ap_${k}">+</button></span>
    </div>`).join('');
  app.innerHTML = `
  <div class="stage">${verlauf()}
    <div>
      <div class="card"><div class="ch"><span>Erster Schritt · Wer bist du</span></div><div class="cb">
        <input type="text" id="namefeld" placeholder="Name des Rekruten" value="${esc(ERSCH.name||zufallsName())}" oninput="ERSCH.name=this.value">
      </div></div>
      <div class="card"><div class="ch"><span>Attribute</span><span id="poolanz">${POOL} Punkte zu verteilen</span></div>
        <div class="cb">${zeilen}
        <p style="color:var(--faint);font-size:12.5px;margin-top:12px">Sockel 20 · höchstens 70 bei der Erschaffung · Bildung ist vom Pool ausgenommen.
        Alle neun Fertigkeiten beginnen bei 10.</p>
        <div style="margin-top:12px"><button class="plain" onclick="wuerfeln()">Auswürfeln</button></div>
      </div></div>
    </div>
    <div class="card"><div class="ch"><span>Herkunft</span><span>je genau 50 Punkte</span></div><div class="cb">
      <div class="herkwahl">${HERKUENFTE.map(h=>`<div class="herk${h.id===ERSCH.herkunft?' on':''}" id="h_${h.id}" onclick="waehleHerkunft('${h.id}')">
        <div class="hn">${h.name}</div><div class="hd">${h.text}</div></div>`).join('')}</div>
      <div style="margin-top:16px"><button class="plain" id="weiterbtn" onclick="zeigeLaden()" disabled>Weiter zu den Veteranenpunkten</button>
      <p class="hinweis" style="margin-top:10px">Danach kannst du auf diese Werte noch Veteranenpunkte legen.</p></div>
    </div></div>
  </div>`;
  ERSCH.name = document.getElementById('namefeld').value;
  aktualisiereErschaffung();
}
function zufallsName(){
  const v=['Étienne','Jean-Baptiste','Pierre','Antoine','Louis','Nicolas','Claude','Michel','François','Gilbert'];
  const n=['Duval','Rey','Vasseur','Marchand','Ferrand','Bonnet','Lemoine','Charpentier','Roussel','Barbier'];
  return v[Math.floor(Math.random()*v.length)]+' '+n[Math.floor(Math.random()*n.length)];
}
function verteilt(){ return ATTRIBUTE.reduce((s,[k])=>s+(ERSCH.attr[k]-SOCKEL),0); }
function stelle(k,d){
  if(k==='bildung') return;
  const neu = ERSCH.attr[k]+d;
  if(neu<SOCKEL || neu>MAXE) return;
  if(d>0 && verteilt()+d>POOL) return;
  ERSCH.attr[k]=neu; aktualisiereErschaffung();
}
function wuerfeln(){
  ATTRIBUTE.forEach(([k])=> ERSCH.attr[k]=SOCKEL);
  const frei = ATTRIBUTE.map(([k])=>k).filter(k=>k!=='bildung');
  let rest = POOL;
  const gew = frei.map(()=>Math.random()+0.35);
  while(rest>0){
    const i = gew.map((g,i)=>[g*Math.random(),i]).sort((a,b)=>b[0]-a[0])[0][1];
    const k = frei[i];
    if(ERSCH.attr[k]+10<=MAXE){ ERSCH.attr[k]+=10; rest-=10; }
    else { gew[i]=0; if(gew.every(g=>g===0)) break; }
  }
  aktualisiereErschaffung();
}
function waehleHerkunft(id){
  ERSCH.herkunft=id;
  HERKUENFTE.forEach(h=> document.getElementById('h_'+h.id).className = 'herk'+(h.id===id?' on':''));
  aktualisiereErschaffung();
}
function aktualisiereErschaffung(){
  const v = verteilt();
  document.getElementById('poolanz').textContent = `${POOL-v} von ${POOL} übrig`;
  ATTRIBUTE.forEach(([k])=>{
    document.getElementById('av_'+k).textContent = ERSCH.attr[k];
    const b = document.getElementById('ab_'+k); if(b) b.querySelector('i').style.width = ERSCH.attr[k]+'%';
    document.getElementById('am_'+k).disabled = (k==='bildung')||ERSCH.attr[k]<=SOCKEL;
    document.getElementById('ap_'+k).disabled = (k==='bildung')||ERSCH.attr[k]>=MAXE||v+10>POOL;
  });
  const b = document.getElementById('weiterbtn');
  if(b) b.disabled = !(ERSCH.herkunft && v===POOL && ERSCH.name.trim().length>0);
}
function starte(){
  laufVerwerfen();       // ein Platz, kein zweiter — der alte Feldzug ist damit vorbei
  neuerLauf(neuerCharakter(ERSCH.name.trim(), ERSCH.herkunft, ERSCH.attr, AUSWAHL, PUNKTE));
  naechster();
}

/* Fortsetzen ist kein Zurückspulen: Der Spielstand zeigt immer auf den letzten
   Schritt, nicht auf den letzten Halt. */
function fortsetzen(){
  const d = laufVorhanden();
  if(!d){ zeigeTitel(); return; }
  LAUF = d; binde(); naechster();
}

/* ══════════════════ ABLAUF ══════════════════ */

function naechster(){
  if(!S.lebt){ zeigeTod(); return; }
  if(LAUF.node >= KAPITEL.length){ zeigeKapitelende(); return; }
  const n = KAPITEL[LAUF.node];
  if(n.datum && n.id && LAUF.gezaehlt !== n.id){
    LAUF.gezaehlt = n.id;                 // beim Fortsetzen nicht doppelt zählen
    const b = META.bestKapitel[n.id] || {mal:0,rang:''};
    b.mal++; if(!b.rang || S.rang>=RANG.findIndex(r=>r.name===b.rang)+1) b.rang = rangName(S.rang);
    META.bestKapitel[n.id]=b;
    chronikSichern();
  }
  laufSichern();
  kopfzeile();
  if(n.typ==='szene') zeigeSzene(n);
  else if(n.typ==='lager') zeigeLager(n);
  else if(n.typ==='kampf'){ if(K) zeigeKampf('Das Gefecht geht weiter, wo du es verlassen hast.'); else starteKampf(n); }
  else if(n.typ==='befoerderung') zeigeBefoerderung(n);
  else if(n.typ==='elite') zeigeElite(n);
  else if(n.typ==='winter') zeigeWinter(n);
  else if(n.typ==='uebergang') zeigeUebergang(n);
  else if(n.typ==='ende') zeigeKapitelende(n);
}

/* ── Übergang zwischen zwei Feldzügen ──
   Kein Ende, kein Neuanfang: Der Mann bleibt derselbe, nur der Krieg wechselt
   das Ufer. Der Zwischenstand wird gezeigt, aber nichts wird eingetragen —
   gewertet wird ein Lauf erst, wenn er endet (Invariante 2: Banken zwischendurch
   gäbe es nicht, weil ein späterer Tod immer mindestens die Stationen von jetzt
   enthält). */
function zeigeUebergang(n){
  /* Zwischen zwei Feldzügen liegt ein Jahr Garnison. Nach derselben Regel wie
     beim Winterquartier (drei Wochen Dach = Atem voll) heilt ein Jahr alles,
     was heilbar ist: Leben und Atem voll, Wunden zu, Belastung halbiert. Der nächste
     Feldzug beginnt mit seinem eigenen Elend, nicht mit dem alten — sonst
     stirbt in Ägypten niemand an Ägypten, sondern an Arcole. */
  if(LAUF.erholt !== n.id){
    LAUF.erholt = n.id;
    S.atem = 100;
    S.leben = lebenMax();
    S.belastung = Math.max(0, Math.floor(S.belastung/2));
    S.wunden = [];
    laufSichern();
  }
  app.innerHTML = `<div class="stage">${verlauf()}
    <div>${wegband(n)}
      <div class="card"><div class="ch"><span>${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
        <div class="cb"><div class="prose">${(n.text||[]).map(t=>`<p>${t}</p>`).join('')}</div>
        <div class="wirkung"><span>Zwischenstand</span>
          ${rangName(S.rang)} · Ruf ${S.ruf} · ${stationen()} Stationen · ${S.nennungen}× im Tagesbefehl</div>
        <div class="wirkung"><span>Ein Jahr Garnison</span>
          Die Wunden schließen sich, der Atem kommt zurück. Was bleibt, ist, was du gelernt hast — und die Hälfte der Last.</div>
        </div></div>
      <div class="orders"><div class="ordbody">
        <button class="ord weiter" onclick="stationErledigt();naechster()">Weiter
          <span class="cost">Der nächste Feldzug · derselbe Mann</span></button>
      </div></div>
    </div>${seitenleiste()}</div>`;
  kopfzeile();
}

/* ── Szene ── */
function zeigeSzene(n){
  const opt = n.optionen.map((o,i)=>{
    const gesperrt = o.probe && wert(o.probe.wert)<5;
    return `<button class="ord ${o.risk?'risk':''}" onclick="waehleOption(${i})" ${gesperrt?'disabled':''}>
      ${esc(o.label)}<span class="cost">${esc(o.kosten||o.hint||'')}${o.probe?' · '+NAMEN[o.probe.wert]+' '+wert(o.probe.wert)+' gegen '+o.probe.schw:''}</span></button>`;
  }).join('');
  app.innerHTML = `<div class="stage">${verlauf()}
    <div>${wegband(n)}<div class="card"><div class="ch"><span>${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
      <div class="cb"><div class="prose">${n.text.map(t=>`<p>${t}</p>`).join('')}</div></div></div>
      <div class="orders"><div class="ch"><span>Was tust du?</span></div><div class="ordbody">${opt}</div></div>
    </div>${seitenleiste()}</div>`;
  LAUF.szene = n.id;
}
function waehleOption(i){
  const n = KAPITEL[LAUF.node], o = n.optionen[i];
  let erg, klasse='', probeText='';
  if(o.probe){
    const p = probe(o.probe.wert, o.probe.schw);
    erg = p.erfolg ? o.erfolg : (o.misserfolg||o.erfolg);
    klasse = p.erfolg ? 'gut' : 'schlecht';
    // Nur das Ergebnis, nicht die Rechnung: Wert und Schwierigkeit stehen schon
    // vor der Wahl auf dem Knopf, und Zielwert und Wurf sagen hinterher nichts mehr.
    probeText = `<div class="pruefung ${klasse}">${NAMEN[o.probe.wert]} — ${p.erfolg?'gelungen':'misslungen'}</div>`;
  } else { erg = o.erfolg; klasse='gut'; }
  anwenden(erg);
  verschleiss(0.35);
  S.log.push(n.id+': '+o.label);
  stationErledigt();
  app.innerHTML = `<div class="stage">${verlauf()}
    <div><div class="card"><div class="ch"><span>${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
      <div class="cb"><div class="prose"><p class="said">${esc(o.label)}</p></div>
        <div class="ergebnis ${klasse}">${erg.text}${probeText}</div>
        ${wirkungen(erg)}</div></div>
      <div class="orders"><div class="ordbody"><button class="ord weiter" onclick="naechster()">Weiter</button></div></div>
    </div>${seitenleiste()}</div>`;
  kopfzeile();
}
function wirkungen(e){
  const t=[];
  const m = {ruf:'Ruf',gunst:'Gunst',kameradschaft:'Kameradschaft',belastung:'Belastung',atem:'Atem',geld:'Francs'};
  for(const k in m) if(e[k]) t.push(`${m[k]} ${e[k]>0?'+':''}${e[k]}`);
  if(e.attr) for(const k in e.attr) t.push(`${NAMEN[k]} ${e.attr[k]>0?'+':''}${e.attr[k]}`);
  if(e.fert) for(const k in e.fert) if(e.fert[k]) t.push(`${NAMEN[k]} ${e.fert[k]>0?'+':''}${e.fert[k]}`);
  if(e.ausr) for(const k in e.ausr) t.push(`${S.ausr[k].name} ${e.ausr[k]>0?'+':''}${e.ausr[k]}`);
  if(e.wunde) t.push('Wunde: '+e.wunde);
  if(e.nennung) t.push('Im Tagesbefehl genannt');
  return t.length ? `<div class="wirkung"><span>Wirkung</span>${t.join(' · ')}</div>` : '';
}


'use strict';
/* Gefecht, Elitekompanie und Beförderung. */

/* ══════════════════ KAMPF ══════════════════ */

function aktionen(){
  const a = [];
  const zw = S.zweig;
  a.push({id:'laden',label:'Laden',cost:'Geschick · Atem −8',aus:()=>K.geladen});
  if(zw==='voltigeur'){
    a.push({id:'zielen',label:'Sorgfältig zielen und feuern',cost:'Muskete +15 · kostet zwei Atemzüge',aus:()=>!K.geladen});
    a.push({id:'feuern',label:'Schnell feuern',cost:'Muskete',aus:()=>!K.geladen});
    a.push({id:'deckung',label:'Deckung wechseln',cost:'Geschick · du bist schwer zu treffen'});
    // Der Plänkler ist gerade der, der sich hinlegt — er steht in keiner Linie,
    // die jemand halten müsste. Ohne diese Wahl war der Zweig der einzige, der
    // nicht verschnaufen konnte.
    a.push({id:'ducken',label:'Flach hinlegen',cost:'Atem +10 · Belastung −2 · kein Schuss, aber auch kein Ziel'});
  } else {
    a.push({id:'feuern',label:'Anlegen und feuern',cost:'Muskete',aus:()=>!K.geladen});
    a.push({id:'ducken',label:'Hinknien',cost:'Atem +10 · Belastung −2 · du schießt nicht, aber sie treffen dich auch schlechter'});
    a.push({id:'halten',label:'Stehenbleiben und die Linie halten',cost:'Kaltblütigkeit'});
  }
  a.push({id:'bajonett',label:zw==='grenadier'?'Bajonett fällen und vorgehen':'Mit dem Bajonett vor',
    cost:(zw==='grenadier'?'Bajonett +10 · ':'Bajonett · ')+'sehr gefährlich',risk:true});
  if(S.rang>=3){
    a.push({id:'salve',label:'Der Korporalschaft Salve befehlen',
      cost:'Autorität · acht Musketen auf einmal — mehr als du allein triffst, und deine bleibt geladen'});
    a.push({id:'luecke',label:'Die Lücke links schließen lassen',
      cost:'Drill · eure Linie verliert weniger Männer · Ruf, wenn es gelingt'});
  }
  a.push({id:'zurueck',label:'Zurückweichen',cost:'Ruf −− · der Kampf ist für dich vorbei',risk:true});
  return a;
}

/* ── Anmarsch: der Weg dorthin, die Lage, das Warten ──
   Zwischen zwei Gefechten liegen Wochen und hunderte Kilometer. Wer direkt aus
   der Szene in die erste Runde fällt, merkt davon nichts. Der Anmarsch kostet
   deshalb auch etwas: Marsch nutzt Schuhe ab und geht auf den Atem. */

/* ── Anerkennung im Gefecht ──
   Ruf entsteht aus dem, was man tut, nicht nur daraus, wie es ausgeht. Jede
   Tat, die jemand sehen konnte, bringt sofort etwas — sichtbar in der
   Seitenleiste, bevor das Gefecht vorbei ist.

   Höchstens drei je Gefecht — mehr sieht in diesem Rauch niemand. Die Grenze
   ist knapp gewählt, weil Ruf die Beförderungswährung ist: Ein Zuschlag von
   drei je Gefecht sind über fünf Gefechte fünfzehn Punkte auf eine Schwelle
   von dreißig, und das ist schon viel. Neu ist außerdem, dass auch ein
   verlorenes Gefecht Ruf bringen kann — gesehen wird man trotzdem.

   *Ein Umweg, der nicht funktioniert hat:* Statt eines Zuschlags war das
   zuerst eine Umverteilung — pauschaler Siegesruf minus vier, bis zu fünf hier
   zurückzuverdienen. Gemessen brach der Caporal-Anteil von 39 % auf 21 % und
   die Überlebensquote von 49 % auf 40 %, weil der Testbot sich nur etwa zwei
   Punkte je Gefecht zurückholt und über den Rang auch der zusätzliche
   Lagerabend wegfiel. Wer das noch einmal versucht, misst beide Zahlen. */
const RUHM_JE_GEFECHT = 3;

function anerkennung(betrag, was){
  const rest = Math.max(0, RUHM_JE_GEFECHT - K.ruhm);
  const gibt = Math.min(betrag, rest);
  if(gibt <= 0) return '';
  K.ruhm += gibt; S.ruf += gibt;
  K.taten.push({was, ruf:gibt});
  return ` <span class="fein">gesehen · Ruf +${gibt}</span>`;
}

function starteKampf(n){
  if(n.anmarsch && !S.anmarschGesehen){
    S.anmarschGesehen = n.id;
    // Der Weg dorthin kostet — in Ägypten mehr als in Italien (anmarschKosten in den Daten)
    const ak = n.anmarschKosten || {verschleiss:0.15, atem:4, belastung:1};
    verschleiss(ak.verschleiss);
    S.atem = Math.max(0, S.atem-ak.atem);
    S.belastung = Math.min(100, S.belastung+ak.belastung);
    laufSichern();
    zeigeAnmarsch(n);
    return;
  }
  S.anmarschGesehen = null;
  setzeKampf({runde:1, geladen:true, deckung:false, feindMoral:n.feindMoral,
              eigen:100, vorn:false, geschlossen:0, lueckeGelobt:false,
              ruhm:0, taten:[],
              protokoll:['Das Gefecht beginnt.'], zielt:false, verluste:0});
  laufSichern();
  zeigeKampf(n.intro);
}

/* Was du über dich selbst weißt, bevor es losgeht. Keine Zahlen, die in der
   Seitenleiste schon stehen — sondern was sie bedeuten. */
function gefechtsbereitschaft(){
  const z = [], m = S.ausr.muskete.zustand, sch = S.ausr.schuhe.zustand;
  if(m<35) z.push('Das Schloss ist braun vom Rost. Ob die Muskete zündet, wird sich zeigen, wenn es darauf ankommt.');
  else if(m<60) z.push('Die Muskete ist gebraucht, aber trocken. Sie hat bisher gezündet.');
  else z.push('Die Muskete ist sauber und geölt. In dieser Armee ist das keine Selbstverständlichkeit.');
  if(sch<25) z.push('Von deinen Schuhen ist wenig übrig. Du hast seit dem Aufbruch nasse Füße und spürst jeden Stein.');
  else if(sch<50) z.push('Die Schuhe halten. Noch.');
  if(S.wunden.length) z.push('Du trägst ' + (S.wunden.length===1?'eine alte Wunde':S.wunden.length+' alte Wunden') +
    ' mit dir: ' + S.wunden.map(w=>esc(w.name)).join(', ') + '.');
  if(angeschlagen()) z.push(S.leben <= lebenMax()*0.15
    ? 'Du hast zu viel Blut verloren, um hier zu stehen. Wenn dich heute etwas trifft, war es das.'
    : 'Du bist nicht wiederhergestellt. Was noch nicht zu ist, wird gleich wieder aufgehen.');
  if(ausserAtem()) z.push(S.atem<30
    ? 'Du bist ausgepumpt, bevor der erste Schuss fällt. Unter 30 Atem trifft dich mehr, als dich treffen müsste — das hier wird teuer.'
    : 'Dir geht die Luft aus, bevor es losgeht. Unter 30 wird jede Runde gefährlicher.');
  if(S.belastung>60) z.push('Deine Hände sind nicht ruhig. Du hältst sie an den Riemen, damit es niemand sieht.');
  if(S.kameradschaft>=50) z.push('Links und rechts stehen Männer, die deinen Namen kennen. Das ist keine Kleinigkeit.');
  if(S.rang>=3) z.push('Acht Mann sehen dich an und warten darauf, dass du etwas sagst.');
  else if(S.zweig==='voltigeur') z.push('Du gehst vor der Linie. Wenn es losgeht, steht neben dir niemand.');
  else if(S.zweig==='grenadier') z.push('Die Grenadierkompanie steht vorne. Das ist der Sinn der Bärenfellmütze.');
  return z;
}

function zeigeAnmarsch(n){
  const l = n.lage || {};
  const zeilen = [['Gegner',l.gegner],['Auftrag',l.auftrag],['Gelände',l.gelaende],['Dein Platz',l.stellung]]
    .filter(([,v])=>v).map(([k,v])=>`<tr><td class="k">${k}</td><td class="d">${esc(v)}</td></tr>`).join('');
  app.innerHTML = `<div class="stage">${verlauf()}
    <div>${wegband(n)}
      <div class="card"><div class="ch"><span>Anmarsch · ${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
        <div class="cb">
          <div class="prose">${n.anmarsch.map(t=>`<p>${t}</p>`).join('')}</div>
          ${zeilen?`<div class="lage"><div class="lagekopf">Was man weiß</div>
            <table>${zeilen}</table></div>`:''}
          <div class="lage"><div class="lagekopf">Womit du dastehst</div>
            <div class="prose">${gefechtsbereitschaft().map(t=>`<p>${t}</p>`).join('')}</div></div>
        </div></div>
      <div class="orders"><div class="ordbody">
        <button class="ord weiter" onclick="starteKampf(KAPITEL[LAUF.node])">Antreten
          <span class="cost">Danach gibt es keinen Weg zurück, der nicht Ruf kostet</span></button>
      </div></div>
    </div>${seitenleiste()}</div>`;
  kopfzeile();
}

/* ── Sichtfeld ──
   Das Gefecht als Aufstellung, aus deiner Augenhöhe: unten deine Linie in
   Blau, drüben der Feind in Rot, dazwischen Rauch. Beide Seiten verlieren
   sichtbar Männer — die Zahl der Figuren folgt `feindMoral` und `eigen`, und
   die Waage unten sagt, wohin es gerade kippt.

   Zwei Regeln, die den Ton halten: Du stehst immer dort, wo du hingehörst
   (in der Linie, vor der Linie als Voltigeur, tiefer wenn du kniest oder
   liegst, vorne wenn du mit dem Bajonett vorgegangen bist), und Gefallene
   verschwinden nicht, sie liegen da.

   Alles wird bei jedem Zug neu gezeichnet, deshalb darf hier nichts gewürfelt
   werden: `streu()` ist ein fester Wert je Platz, kein Zufall. */

function sichtfeld(){
  const n = KAPITEL[LAUF.node], zw = S.zweig;
  const rauch = Math.min(1, K.runde/6);
  const feindTeil = Math.max(0, Math.min(1, K.feindMoral / n.feindMoral));
  const eigenTeil = Math.max(0, Math.min(1, (K.eigen==null?100:K.eigen) / 100));

  const streu = (i,a)=>{ const x = Math.sin(i*127.1 + a*311.7)*43758.5453; return x - Math.floor(x); };
  const gefallene = (anz,steht,a)=> new Set(
    Array.from({length:anz},(_,i)=>i).sort((p,q)=>streu(p,a)-streu(q,a)).slice(0, anz-steht));

  /* Geschlossene Ordnung: Die Glieder stehen um eine halbe Teilung versetzt,
     sodass das hintere Glied die Lücken des vorderen füllt — zusammen ergibt
     das die dichte Wand, die eine Linie ausmacht. Einzeln gezählt sind es
     wenige Männer je Glied, im Bild steht eine Linie. */
  const FEIND_JE = 15, EIGEN_JE = 20, PLAENKLER = 5;
  const FEIND = FEIND_JE*2, EIGEN = EIGEN_JE*2;
  const feindWeg = gefallene(FEIND, Math.round(FEIND*feindTeil), 7);
  const eigenWeg = gefallene(EIGEN, Math.round(EIGEN*eigenTeil), 13);

  const ROT = '#c2483a', ROT_TOT = '#5e2a24', BLAU = '#7d93ad', BLAU_TOT = '#3a4655';

  /* Die Kopfbedeckung sagt, wer da steht. 1796 trägt die Linie den Zweispitz,
     die Grenadierkompanie die Bärenfellmütze mit rotem Stutz, der Voltigeur
     denselben Zweispitz wie die Linie. Der Feind trägt den österreichischen
     Kasket. */
  const kopfbedeckung = (x,y,b,f,art)=>{
    if(art==='baer') return `<rect x="${(x-4.6*b).toFixed(1)}" y="${(y-15.5*b).toFixed(1)}" width="${(9.2*b).toFixed(1)}" height="${(11*b).toFixed(1)}" rx="${(4.4*b).toFixed(1)}"/>`+
      `<rect x="${(x+2.6*b).toFixed(1)}" y="${(y-19*b).toFixed(1)}" width="${(1.8*b).toFixed(1)}" height="${(5*b).toFixed(1)}" rx="${(0.9*b).toFixed(1)}" fill="#c2483a"/>`;
    if(art==='kasket') return `<ellipse cx="${x.toFixed(1)}" cy="${(y-8.4*b).toFixed(1)}" rx="${(4.4*b).toFixed(1)}" ry="${(3.4*b).toFixed(1)}"/>`;
    // Zweispitz: breit und flach, quer über dem Kopf getragen
    return `<ellipse cx="${x.toFixed(1)}" cy="${(y-8.6*b).toFixed(1)}" rx="${(7.6*b).toFixed(1)}" ry="${(2.9*b).toFixed(1)}"`+
           ` transform="rotate(-7 ${x.toFixed(1)} ${(y-8.6*b).toFixed(1)})"/>`;
  };

  const mann = (x,y,h,f,o,art,gewehr)=>{
    const b = h/26;
    return `<g opacity="${o}" fill="${f}">`+
      (gewehr!==false ? `<rect x="${(x+3.4*b).toFixed(1)}" y="${(y-13*b).toFixed(1)}" width="${(1.5*b).toFixed(1)}" height="${(h+11*b).toFixed(1)}" rx="${(0.7*b).toFixed(1)}" opacity=".4" transform="rotate(-22 ${(x+3.4*b).toFixed(1)} ${y.toFixed(1)})"/>` : '')+
      `<rect x="${(x-4.4*b).toFixed(1)}" y="${y.toFixed(1)}" width="${(8.8*b).toFixed(1)}" height="${h}" rx="${(3*b).toFixed(1)}"/>`+
      `<circle cx="${x.toFixed(1)}" cy="${(y-3.8*b).toFixed(1)}" r="${(3.4*b).toFixed(1)}"/>`+
      kopfbedeckung(x,y,b,f,art)+
      `</g>`;
  };
  const toter = (x,y,f)=>`<rect x="${(x-7).toFixed(1)}" y="${y.toFixed(1)}" width="14" height="2.6" rx="1.3" fill="${f}" opacity=".55"/>`;

  /* Hinter jedem Glied ein schwacher Streifen: die Masse, aus der die
     Einzelnen ragen — die Linie hört nicht am Bildrand auf. */
  const masse = (y,h,f,o)=>`<rect x="0" y="${(y+h*0.3).toFixed(0)}" width="640" height="${(h*0.7).toFixed(0)}" fill="${f}" opacity="${o}"/>`;

  // Feind: zwei versetzte Glieder, weiter weg und deshalb kleiner
  let feind = masse(48, 15, ROT, .08) + masse(56, 15, ROT, .06);
  for(let g=0;g<2;g++) for(let i=0;i<FEIND_JE;i++){
    const idx = g*FEIND_JE+i, schritt = 640/FEIND_JE;
    const x = 14 + i*schritt + g*schritt/2, y = 48 + g*8;
    feind += feindWeg.has(idx) ? toter(x, y+15, ROT_TOT) : mann(x, y, 15, ROT, g ? 0.5 : 0.9, 'kasket');
  }

  // Eigene Linie: erstes Glied weiter vorn und darum höher, deins darunter
  const meinX = 320, meinGlied = 1;
  const meinHut = S.zweig==='grenadier' ? 'baer' : 'zwei';
  let eigen = masse(130, 22, BLAU, .07) + masse(146, 26, BLAU, .10);
  for(let g=0;g<2;g++) for(let i=0;i<EIGEN_JE;i++){
    const idx = g*EIGEN_JE+i, schritt = 640/EIGEN_JE;
    const x = 8 + i*schritt + (g?0:schritt/2), y = g ? 146 : 130, h = g ? 26 : 22;
    if(zw!=='voltigeur' && g===meinGlied && Math.abs(x-meinX)<schritt*0.6) continue;   // dein Platz
    eigen += eigenWeg.has(idx) ? toter(x, y+h, BLAU_TOT) : mann(x, y, h, BLAU, g ? 1 : 0.6, meinHut);
  }

  // Voltigeure schwärmen aus: wenige, weit auseinander, ohne Ordnung
  let plaenkler = '';
  if(zw==='voltigeur') for(let i=0;i<PLAENKLER;i++){
    const x = 90 + i*(460/(PLAENKLER-1)) + (streu(i,5)-0.5)*48;
    if(Math.abs(x-meinX)<34) continue;
    plaenkler += mann(x, 92 + streu(i,9)*16, 20, BLAU, 0.85, 'zwei');
  }

  // Du, dort wo du hingehörst
  let meinY = zw==='voltigeur' ? 100 : 146, meinH = zw==='voltigeur' ? 20 : 26;
  if(K.vorn){ meinY = 86; meinH = 18; }             // mit dem Bajonett vorgegangen
  if(K.deckung){ meinY += meinH-10; meinH = 10; }   // kniend oder liegend

  /* Pulverdampf steht zwischen den Linien und wird mit jeder Runde dichter —
     feste Plätze, nur die Zahl wächst. */
  let qualm = '';
  for(let i=0;i<Math.round(3+9*rauch);i++){
    const x = 40 + streu(i,17)*560, y = 86 + streu(i,23)*32;
    const r = 16 + streu(i,29)*28;
    qualm += `<ellipse cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" rx="${r.toFixed(0)}" ry="${(r*0.42).toFixed(0)}"`+
             ` fill="#3a352e" opacity="${(0.10+0.12*streu(i,31)).toFixed(2)}"/>`;
  }

  const uebergewicht = eigenTeil + feindTeil > 0 ? eigenTeil/(eigenTeil+feindTeil) : 0.5;

  return `<svg viewBox="0 0 640 200" role="img"
    aria-label="Aufstellung: ${Math.round(EIGEN*eigenTeil)} eigene Männer gegen ${Math.round(FEIND*feindTeil)} feindliche">
    <defs>
      <linearGradient id="sm" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1a1816" stop-opacity="0"/>
        <stop offset="45%" stop-color="#2b2723" stop-opacity="${(0.35+0.4*rauch).toFixed(2)}"/>
        <stop offset="100%" stop-color="#1a1816" stop-opacity="0"/></linearGradient>
      <radialGradient id="vg" cx="50%" cy="88%" r="62%">
        <stop offset="0%" stop-color="#000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000" stop-opacity=".7"/></radialGradient>
    </defs>
    <rect width="640" height="200" fill="#191715"/>
    <rect x="0" y="84" width="640" height="1" fill="#2a2621"/>
    ${feind}
    <rect x="0" y="66" width="640" height="74" fill="url(#sm)"/>
    ${qualm}
    <text x="320" y="26" text-anchor="middle" fill="#8d8371" font-family="Georgia,serif" font-size="11.5"
      font-style="italic">${K.deckung
        ? (zw==='voltigeur'?'Du liegst. Über dir geht es hinweg.':'Du kniest. Über dir geht es hinweg.')
        : (K.vorn?'Du bist zehn Schritt vor der Linie.':'Rauch. Du siehst keine dreißig Schritt weit.')}</text>
    ${plaenkler}${eigen}
    ${mann(meinX, meinY, meinH, '#d0a75e', 1, meinHut, !K.deckung)}
    <text x="${meinX}" y="${meinY < 130 ? (meinY-13).toFixed(0) : (meinY+meinH+11).toFixed(0)}"
      text-anchor="middle" fill="#d0a75e" font-size="9.5"
      font-family="ui-monospace,monospace" letter-spacing="1">DU</text>
    <rect x="0" y="192" width="640" height="4" fill="${ROT_TOT}"/>
    <rect x="0" y="192" width="${(640*uebergewicht).toFixed(0)}" height="4" fill="#56718f"/>
    <rect x="319" y="189" width="2" height="10" fill="#948a79"/>
    <rect width="640" height="200" fill="url(#vg)"/></svg>`;
}

function zeigeKampf(text){
  const n = KAPITEL[LAUF.node];
  const opt = aktionen().map(a=>`<button class="ord ${a.risk?'risk':''}" onclick="kampfAktion('${a.id}')"
      ${a.aus&&a.aus()?'disabled':''}>${a.label}<span class="cost">${a.cost}</span></button>`).join('');
  app.innerHTML = `<div class="stage">${verlauf()}
    <div><div class="card"><div class="ch"><span>Sichtfeld</span><span>${esc(n.datum)}</span></div>
      <div class="cb">${sichtfeld()}
        <div class="prose" style="margin-top:15px"><p>${text}</p></div>
        ${ausserAtem()?`<p class="warnung">Du bekommst keine Luft mehr. ${S.atem<30?'Jeder Handgriff dauert zu lange, und du bist ein leichteres Ziel.':'Noch geht es — aber nicht mehr lange.'} <b>Atem ${S.atem}</b> · ${S.zweig==='voltigeur'?'Flach hinlegen':'Hinknien'} bringt +10.</p>`:''}
        <div class="probe" style="margin-top:12px">RUNDE ${K.runde} VON ${n.runden}
          · WIDERSTAND DES FEINDES ${Math.max(0,Math.round(K.feindMoral))}
          · EURE LINIE ${Math.max(0,Math.round(K.eigen==null?100:K.eigen))}</div>
        ${balken('b-red',Math.max(0,K.feindMoral),n.feindMoral)}
        <div class="log" style="margin-top:14px">${K.protokoll.slice(-5).reverse().map(z=>`<div>${z}</div>`).join('')}</div>
      </div></div>
      <div class="orders"><div class="ch"><span>Was tust du?</span></div><div class="ordbody">${opt}</div></div>
    </div>${seitenleiste()}</div>`;
}

function kampfAktion(id){
  const n = KAPITEL[LAUF.node]; let text = '', schaden = 0, gefahrMod = 0;
  const zw = S.zweig;

  if(id==='laden'){
    const p = probe('geschick', 30);
    S.atem = Math.max(0,S.atem-8);
    if(p.erfolg){ K.geladen=true; text='Patrone auf, Pulver, Kugel, Ladestock. Die Muskete ist geladen.'; }
    else { text='Die Patrone rutscht dir durch die Finger. Du musst eine neue nehmen.'; S.atem=Math.max(0,S.atem-4); }
  }
  else if(id==='feuern' || id==='zielen'){
    const sorgfalt = (id==='zielen');
    const p = probe('muskete', sorgfalt? 20 : 35);
    K.geladen = false;
    S.atem = Math.max(0, S.atem - (sorgfalt?10:5));
    if(p.erfolg){ schaden = sorgfalt? 22+Math.random()*10 : 12+Math.random()*8;
      text = (sorgfalt? 'Du liegst still, atmest aus und drückst ab. Drüben fällt einer, und du weißt, dass er dir gehört.'
                      : 'Du feuerst in den Rauch. Irgendetwas drüben gerät in Unordnung.')
           + anerkennung(sorgfalt?2:1, sorgfalt?'Ein gezielter Schuss, der saß':'Getroffen'); }
    else { text = S.ausr.muskete.zustand<35 ? 'Das Schloss klickt und nichts geschieht. Die Waffe ist verrostet.'
                                            : 'Der Schuss geht zu hoch. In diesem Rauch trifft man mehr durch Zufall als durch Können.'; }
    if(S.ausr.muskete.verschleiss) S.ausr.muskete.zustand = Math.max(0,S.ausr.muskete.zustand-2);
  }
  else if(id==='ducken'){
    K.deckung=true; S.atem=Math.min(100,S.atem+10); S.belastung=Math.max(0,S.belastung-2);
    text = zw==='voltigeur'
      ? 'Du gehst flach in eine Ackerfurche, das Gesicht im Dreck, und atmest zum ersten Mal seit zehn Minuten bis unten. Vor der Linie sucht dich jetzt niemand mehr — die eigenen Leute auch nicht.'
      : 'Du gehst auf ein Knie, den Kolben in den Dreck, den Kopf hinter den Rücken des Vordermanns. Hinlegen kann sich in der Linie niemand — das Glied bliebe offen. Man kann nicht ewig knien, aber jetzt gerade schon.';
    gefahrMod = -22;
  }
  else if(id==='deckung'){
    const p = probe('geschick', 35);
    if(p.erfolg){ K.deckung=true; gefahrMod=-20; text='Drei Sprünge nach links, hinter einen Weidenstumpf. Wer dort hinschießt, wo du warst, trifft nichts.'; }
    else { text='Du bleibst auf halbem Weg im Freien hängen und musst dich flach machen, wo keine Deckung ist.'; gefahrMod=+10; }
  }
  else if(id==='halten'){
    const p = probe('kaltbluetigkeit', 40);
    K.deckung=false;
    if(p.erfolg){ schaden = 6; S.belastung=Math.max(0,S.belastung-3); nutzen('drill',1);
      text='Du bleibst stehen. Links und rechts bleiben sie auch stehen, weil du stehst. Die Linie hält.'
         + anerkennung(1,'Stehen geblieben, als es darauf ankam'); }
    else { S.belastung=Math.min(100,S.belastung+6);
      text='Du stehst, aber deine Hände zittern so, dass du nichts damit anfangen kannst.'; }
  }
  else if(id==='bajonett'){
    const p = probe('bajonett', zw==='grenadier'?30:45);
    K.deckung=false; S.atem=Math.max(0,S.atem-18); gefahrMod = +26;
    K.vorn = p.erfolg;
    if(p.erfolg){ schaden = 30+Math.random()*14;
      text='Du gehst vor. Es ist laut und kurz und danach stehst du zehn Schritt weiter als vorher.'
         + anerkennung(2,'Mit dem Bajonett vorgegangen'); }
    else { text='Du gehst vor, aber niemand geht mit. Nach fünf Schritten stehst du allein und kehrst um.'; S.belastung+=7; }
  }
  else if(id==='salve'){
    const p = probe('autoritaet', 40);
    if(p.erfolg){ schaden = 26+Math.random()*10; nutzen('drill',1);
      text='„Anlegen — Feuer!" Acht Musketen gehen fast gleichzeitig los. Fast. Aber es reicht.'
         + anerkennung(1,'Eine Salve, die saß'); }
    else { text='Du rufst den Befehl, und drei von acht hören ihn. Das Ergebnis ist ein trauriges Geknatter.'; schaden=6; }
  }
  else if(id==='luecke'){
    /* Der Unterschied zum Hinknien: Das dort schützt dich, das hier deine
       Leute. Die geschlossene Linie hält drei Runden lang die halben Verluste
       aus, und das erste Mal je Gefecht sieht es jemand, der Listen führt. */
    const p = probe('drill', 35);
    if(p.erfolg){
      gefahrMod = -8; K.geschlossen = 3;
      S.kameradschaft = Math.min(100, S.kameradschaft+4);
      let lob = '';
      if(!K.lueckeGelobt){ K.lueckeGelobt = true; lob = ' Der Capitaine geht hinter der Linie durch und sieht es.'
        + anerkennung(1,'Die Linie geschlossen gehalten'); }
      text = 'Du schiebst die Männer zusammen, bis kein Loch mehr in der Linie ist. Deine acht wissen jetzt, wozu du gut bist.'+lob;
    }
    else { text='Sie rücken auf, aber zu langsam, und die Lücke bleibt offen. Durch ein offenes Glied schießt es sich leichter.'; }
  }
  else if(id==='zurueck'){
    S.ruf = Math.max(0, S.ruf-8); S.belastung=Math.min(100,S.belastung+10); S.gekniffen=true;
    kampfEnde(false, 'Du gehst zurück. Niemand hält dich auf, und das ist das Schlimmste daran.');
    return;
  }

  if(id!=='bajonett') K.vorn = false;

  // Die Linie kämpft auch ohne dich
  const linie = 2 + Math.random()*4;
  K.feindMoral -= schaden + linie;

  /* Und sie verliert dabei Männer. Das ist reine Anzeige — an `eigen` hängt
     keine Probe und keine Gefahr, es macht nur sichtbar, was der Text sagt:
     Drüben wird auch geschossen. Je mehr Widerstand noch steht, desto teurer. */
  const geschlossen = K.geschlossen > 0;
  K.eigen = Math.max(0, K.eigen - (2 + Math.random()*3) * Math.max(0, K.feindMoral/n.feindMoral) * (geschlossen?0.5:1));
  if(geschlossen) K.geschlossen--;

  K.protokoll.push(text);

  // Feindliche Wirkung
  let gefahr = n.gefahr + gefahrMod;
  if(K.deckung && id!=='ducken' && id!=='deckung') K.deckung=false;
  if(S.belastung>60) gefahr += 6;
  if(S.atem<30) gefahr += 5;
  gefahr = Math.max(4, gefahr);
  let treffer = '';
  if(Math.random()*100 < gefahr){
    /* Ein Treffer tötet nicht mehr durch einen eigenen Wurf, sondern zehrt an
       den Lebenspunkten. Der Unterschied ist der ganze Sinn des Umbaus:

       Vorher senkte Konstitution die Todeschance je Treffer — und ab
       Konstitution 58 war sie rechnerisch null (Schwelle 94 + 18/3 > 100). Ein
       Mann, den keine Kugel töten kann, hebelt Invariante 1 aus. Eine Klammer
       auf den Schutz hat das notdürftig geflickt, aber die Kurve blieb falsch:
       Konstitution kaufte Unverwundbarkeit, nicht Zähigkeit.

       Jetzt ist sie monoton. `lebenMax()` wächst mit der Konstitution
       (52 bei 20 · 64 bei 40 · 82 bei 70), der Schaden je Treffer nicht — mehr
       Konstitution heißt also mehr Treffer, die man wegsteckt, aber genug
       Treffer töten jeden. Deshalb darf die Herkunft auch über 70 gehen.

       Geeicht an einer gemessenen Zahl: Ein Mann wird in beiden Feldzügen
       zusammen nur **rund neun Mal** getroffen — 10 Gefechte, 57 Kampfrunden,
       etwa 16 % Trefferchance je Runde. Ein Vorrat, den neun Treffer nicht
       leeren, tötet niemanden; die erste Eichung auf 6 Schaden je Treffer
       ergab gemessen **100 % Überlebende**. Deshalb ist ein Treffer teuer:
       im Mittel 11 Punkte, also stirbt ein Mann mit Konstitution 40 am
       sechsten, einer mit 20 am fünften, einer mit 70 am achten. Das ist auch
       inhaltlich richtig — wer 1796 vier Mal getroffen wird, steht nicht mehr. */
    let schaden;
    if(Math.random()*100 > 75){
      schaden = 15 + Math.floor(Math.random()*11);            // 15–25
      wundeGeben('Schwere Wunde ('+n.datum.split(' · ')[1]+')', 14);
      treffer = ' Ein Schlag gegen die Schulter, dann Nässe im Ärmel. Du kannst den Arm noch bewegen, aber es tut sehr weh.';
      S.atem = Math.max(0,S.atem-20);
    } else {
      /* Der Streifschuss kostet zweierlei, und das ist Absicht: Blut (bleibt)
         und eine Wunde, die der Feldscher nach dem Gefecht zunäht (bleibt
         nicht). Ohne die Wunde stimmte zwar die Todesrechnung, aber ein Mann
         schoss den ganzen Feldzug lang wie am ersten Tag — gemessen stieg der
         Caporal-Anteil von 40 % auf 57 %, weil bessere Gefechte mehr Ruf
         bringen und Ruf die Beförderungsschwelle ist. Der Kratzer soll den
         Rest des Gefechts wehtun, nicht den Rest des Krieges. */
      schaden = 5 + Math.floor(Math.random()*7);              // 5–11
      wundeGeben('Streifschuss', 5);
      treffer = ' Etwas reißt dir den Ärmel auf und brennt. Nicht schlimm. Noch nicht.';
      S.atem = Math.max(0,S.atem-8);
    }
    S.leben = Math.max(0, S.leben - schaden);
    K.protokoll.push('Du wirst getroffen.');
    if(S.leben <= 0){
      kampfEnde(false, text + treffer + ' Du willst dich abstützen und findest den Boden nicht, wo er sein müsste. Jemand ruft deinen Namen, weit weg.');
      toetlich('Gefallen bei '+n.datum.split(' · ')[1]);
      zeigeTod(); return;
    }
    if(S.leben <= lebenMax()*0.3) treffer += ' Du bist noch auf den Beinen, aber nicht mehr lange.';
  }

  if(K.feindMoral <= 0){ kampfEnde(true, text+treffer); return; }
  K.runde++;
  if(K.runde > n.runden){
    const knapp = K.feindMoral < n.feindMoral*0.35;
    kampfEnde(knapp, text+treffer+(knapp?' Und dann ist es plötzlich vorbei.':' Es wird dunkel, und nichts ist entschieden.'));
    return;
  }
  laufSichern();
  zeigeKampf(text + treffer);
}

function kampfEnde(sieg, letzterText){
  const n = KAPITEL[LAUF.node];
  const erg = sieg ? n.sieg : n.niederlage;
  anwenden(erg);
  verschleiss(0.9);
  /* Der Feldscher näht die leichteste Wunde zu — in der Regel den Streifschuss
     des letzten Gefechts. Lebenspunkte gibt er nicht zurück.

     Das ist dieselbe Regel wie beim Atem, und aus demselben Grund: Eine
     Erholung an jeder Station verschenkt genau das, was die Lager knapp machen
     soll. Gemessen mit einem Viertel je Gefecht überlebten **alle sechzig**
     Läufe beide Feldzüge — bei rund neun Treffern im ganzen Spiel wiegt jede
     geschenkte Genesung schwerer als der Schaden. Wer wieder auf die Beine
     will, verbringt einen Lagerabend oder eine Winterwoche damit. */
  const leicht = S.wunden.findIndex(w=>w.abzug<=8);
  if(leicht>=0) S.wunden.splice(leicht,1);
  if(sieg && n.ruhm && S.ruf>=20 && Math.random()<0.6){ S.nennungen++; }
  const kk = K; setzeKampf(null);
  stationErledigt();
  app.innerHTML = `<div class="stage">${verlauf()}
    <div><div class="card"><div class="ch"><span>${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
      <div class="cb"><div class="prose"><p>${letzterText}</p></div>
        <div class="ergebnis ${sieg?'gut':'schlecht'}">${erg.text}</div>${wirkungen(erg)}
        ${kk.taten.length?`<div class="lage"><div class="lagekopf">Was gesehen wurde</div>
          ${kk.taten.map(t=>`<div class="tat"><span>${esc(t.was)}</span><b>Ruf +${t.ruf}</b></div>`).join('')}
          ${kk.ruhm>=RUHM_JE_GEFECHT?'<p class="hinweis" style="margin:9px 0 0">Mehr sieht in diesem Rauch niemand.</p>':''}
        </div>`:''}
        <div class="probe" style="margin-top:10px">${sieg?'GEFECHT BESTANDEN':'GEFECHT VERLOREN'} · ${kk.runde} RUNDEN</div>
      </div></div>
      <div class="orders"><div class="ordbody"><button class="ord weiter" onclick="naechster()">Weiter</button></div></div>
    </div>${seitenleiste()}</div>`;
  kopfzeile();
}

        <p>Mailand hat der Armee Sold gegeben und Schuhe, und jetzt werden die Bataillone neu geordnet. Jedes bekommt eine Grenadier- und eine Voltigeurkompanie, und die Chefs suchen sich die Männer aus.</p>
        <p>Die Grenadiere nehmen die Großen und die, die stehen bleiben. Die Voltigeure nehmen die Kleinen und die, die schnell sind und allein zurechtkommen.</p>

function waehleZweig(z){
  let text;
  if(z){ S.zweig=z; S.rang=Math.max(S.rang,2); S.ruf+=4;
    text = z==='grenadier'
      ? 'Man misst dich an einem Stab, nickt und schreibt deinen Namen auf die andere Liste. Ab morgen trägst du die Bärenfellmütze, bekommst zwei Sous mehr am Tag und stehst dort, wo es am dicksten kommt.'
      : 'Der Adjutant lässt dich dreißig Schritt laufen und wieder zurück, dann nickt er. Ab morgen gehst du vor der Linie, allein oder zu zweit, und schießt auf das, was du siehst — nicht auf das, wohin alle schießen.';
  } else {
    text = 'Er geht weiter, ohne etwas zu sagen. Du bleibst in der Mitte des Bataillons, wo die meisten bleiben. Es ist keine Schande, nur eben nichts.';
  }
  stationErledigt();
  app.innerHTML = `<div class="stage">${verlauf()}<div>
    <div class="card"><div class="ch"><span>Mailand</span><span>Mai 1796</span></div>
      <div class="cb"><div class="ergebnis ${z?'gut':''}">${text}</div>
      ${z?`<div class="rangzeile" style="margin-top:12px">${rangabzeichen(S)}
        <span class="probe" style="margin:0">NEUER RANG · ${rangName(2).toUpperCase()} · RUF +4</span></div>`:''}</div></div>
    <div class="orders"><div class="ordbody"><button class="ord weiter" onclick="naechster()">Weiter</button></div></div>
    </div>${seitenleiste()}</div>`;
  kopfzeile();
}

/* ══════════════════ BEFÖRDERUNG ══════════════════ */

/* Schwelle zum Caporal. Beides zusammen, und dazu die Vakanz — siehe CLAUDE.md.
   Wer diese Zahlen ändert, trägt sie dort nach. */
const CAPORAL_RUF = 30, CAPORAL_GUNST = 4;

function zeigeBefoerderung(n){
  /* Der Stand wird beim ersten Betreten der Station eingefroren, je Station —
     seit Kairo gibt es eine zweite Musterung, und die prüft den Stand von
     jetzt, nicht den von Verona. */
  S.befPruefungen = S.befPruefungen || {};
  if(!S.befPruefungen[n.id]) S.befPruefungen[n.id] = {ruf:S.ruf, gunst:S.gunst};
  const {ruf, gunst} = S.befPruefungen[n.id];

  if(S.rang>=3){
    stationErledigt();
    app.innerHTML = `<div class="stage">${verlauf()}<div>${wegband(n)}
      <div class="card"><div class="ch"><span>${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
        <div class="cb"><div class="prose">${(n.text||[]).map(t=>`<p>${t}</p>`).join('')}</div>
        <div class="ergebnis">Du trägst die Streifen schon. Der Capitaine geht die Liste durch, sieht dich kurz an und geht weiter — für mehr als den Caporal braucht es Lesen und Schreiben, und das steht auf einem anderen Blatt.</div>
        </div></div>
      <div class="orders"><div class="ordbody"><button class="ord weiter" onclick="naechster()">Weiter</button></div></div>
      </div>${seitenleiste()}</div>`;
    kopfzeile();
    return;
  }
  const reichtRuf = ruf>=CAPORAL_RUF, reichtGunst = gunst>=CAPORAL_GUNST;
  const bekommt = reichtRuf && reichtGunst;
  let text, klasse;
  if(bekommt){
    S.rang = Math.max(S.rang,3);
    S.ruf += 5;
    text = `Martel — inzwischen Sergent-major — nennt deinen Namen, und der Capitaine schreibt ihn auf. Es gibt keine Zeremonie. Du bekommst zwei Wollstreifen an den Ärmel, acht Mann und die Verantwortung dafür, dass diese acht Mann morgens da sind, Schuhe haben und ihre Musketen zünden.
    <br><br>Der Mann, dessen Stelle du bekommst, heißt Guérin. Er ist bei Castiglione geblieben.`;
    klasse='gut';
  } else if(!reichtRuf){
    text = `Zwei Stellen werden besetzt. Keine mit dir. Der Capitaine kennt deinen Namen nicht, und das ist die ganze Erklärung.
    <br><br><em>Für den Caporal braucht es Ruf ${CAPORAL_RUF} — du hast ${ruf}.</em>`;
    klasse='schlecht';
  } else {
    text = `Dein Name fällt. Er fällt sogar zweimal. Aber niemand am Tisch legt die Hand für dich auf den Tisch, und ohne das geht es nicht.
    <br><br><em>Für den Caporal braucht es einen Fürsprecher — Gunst ${CAPORAL_GUNST}, du hast ${gunst}. Fürsprache sammelt sich in Abenden am Feuer, nicht in einer einzigen Tat.</em>`;
    klasse='schlecht';
  }
  stationErledigt();     // die Entscheidung ist gefallen, bevor der Knopf kommt
  app.innerHTML = `<div class="stage">${verlauf()}<div>${wegband(n)}
    <div class="card"><div class="ch"><span>${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
      <div class="cb"><div class="prose">${(n.text||[]).map(t=>`<p>${t}</p>`).join('')}</div>
      <div class="ergebnis ${klasse}">${text}</div>
      <div class="rangzeile" style="margin-top:12px">${bekommt?rangabzeichen(S):''}
        <span class="probe" style="margin:0">VAKANZ VORHANDEN · RUF ${ruf}/${CAPORAL_RUF} · FÜRSPRACHE ${gunst}/${CAPORAL_GUNST} · ${bekommt?'BEFÖRDERT':'ÜBERGANGEN'}</span></div>
      </div></div>
    <div class="orders"><div class="ordbody"><button class="ord weiter" onclick="naechster()">Weiter</button></div></div>
    </div>${seitenleiste()}</div>`;
  kopfzeile();
}


'use strict';
/* Lager, Winterquartier, Punktwertung, Tod, Kapitelende, Spielstand. */

/* ══════════════════ LAGER ══════════════════ */

/* Ein Lager ist die kleine Fassung des Winterquartiers: zwei bis drei Abende,
   und immer mehr zu tun, als Zeit da ist. Ausbildung und Instandhaltung
   konkurrieren miteinander — das ist der ganze Entwurf. Was hier nicht getan
   wird, fehlt im nächsten Gefecht.

   Die Handlungen stehen hier, die Auswahl je Lager in den Kapiteldaten (tun:[…]).
   Handlungen für Rang und Zweig kommen selbsttätig dazu — ein höherer Rang gibt
   auch im Lager neue Knöpfe, nicht größere Zahlen. */

const LAGER_TUN = {

      S.atem=Math.max(0,S.atem-6); S.belastung=Math.min(100,S.belastung+2);
      return 'Laden in zwölf Zeiten, achtzig Mal hintereinander, bis die Hände es ohne den Kopf können. Ein Caporal zählt laut mit, und wer nachhängt, fängt von vorn an. <span class="fein">Muskete und Drill steigen · Atem −6</span>'; }},

  bajonett:{label:'Bajonettfechten gegen einen Strohmann',
    cost:'Bajonett · Atem −8',
    tu(){ nutzen('bajonett',2.5);
      S.atem=Math.max(0,S.atem-8); S.belastung=Math.min(100,S.belastung+2);
      return 'Ein Sack Stroh an einem Pfahl, zweihundert Stöße. Der Sergent sagt, du sollst nicht stechen wie einer, der jemanden verletzen will, sondern wie einer, der weitergehen will. <span class="fein">Bajonett steigt · Atem −8</span>'; }},

      return 'Zwölf scharfe Schüsse auf eine Scheibe aus Brettern, achtzig Schritt. Beim Bataillon sind drei Schuss im Jahr vorgesehen; den Rest muss man sich selbst kaufen. Beim neunten triffst du zum ersten Mal, weil du es willst, und nicht, weil es sich ergeben hat. <span class="fein">Muskete steigt deutlich · −4 F · Waffe −5</span>'; }},

    cost:'Geschick · alles ein Stück besser',
    tu(){ const p = probe('geschick',30);
      const plus = p.erfolg ? 20 : 8;

      S.geld-=6; S.ausr.schuhe.zustand = Math.min(100, S.ausr.schuhe.zustand+45);
      return 'Er sieht sie sich an, sagt etwas auf Italienisch, das nicht freundlich klingt, und näht trotzdem. Neue Sohlen, doppelt genagelt, und ein Stück Leder über der linken Ferse. <span class="fein">Schuhe +45 · −6 F</span>'; }},

    tu(){ nutzen('konstitution',1.5); S.atem=Math.max(0,S.atem-10);
      return 'Sechzig Pfund auf den Rücken, dreimal den Hang hinauf. Die Grenadierkompanie steht dort, wo es am dicksten kommt, und wer dort nicht stehen bleiben kann, bleibt liegen. <span class="fein">Konstitution steigt · Atem −10</span>'; }},

      return 'Von Deckung zu Deckung, hinlegen, zielen, weiter. Vor der Linie gibt es keinen Nebenmann, der dir sagt, wann du aufstehst. Das musst du selbst wissen. <span class="fein">Geschick und Muskete steigen · Atem −6</span>'; }}
};

/* Unteroffiziere sind vom Wachdienst und von den Handreichungen befreit, die
   den Füsilier den halben Abend kosten — dafür haben sie die Korporalschaft am
   Hals. Ein Rang gibt also nicht nur einen Knopf mehr, sondern auch den Abend,
   an dem man ihn drücken kann; sonst verdrängt die Dienstpflicht die eigene
   Ausbildung. Ab Sergent noch einen. */
function abendeFuer(n){ return n.abende + (S.rang>=5 ? 2 : S.rang>=3 ? 1 : 0); }

function lagerHandlungen(n){
  const ids = (n.tun||[]).slice();
  if(S.rang>=3) ids.push('korporalschaft');
  if(S.zweig==='grenadier') ids.push('tornister');
  if(S.zweig==='voltigeur') ids.push('gelaende');
  return ids.filter(id=>LAGER_TUN[id]);
}

/* Das Lager ist der angesagte Halt: Hier wird der Feldzug gesichert und
   gesagt, dass er gesichert ist. Danach läuft die Sicherung still weiter, damit
   Aufhören zurückbringt, wo man war, und nicht, wo man zuletzt gerastet hat. */
function zeigeLager(n){
  const L = LAUF.lager;
  if(L.id !== n.id){ L.id = n.id; L.abende = abendeFuer(n); L.log = []; L.gesichert = Ablage.dauerhaft; laufSichern(); }
  const opt = lagerHandlungen(n).map(id=>{
    const t = LAGER_TUN[id];
    return `<button class="ord" onclick="lagerTun('${id}')" ${L.abende<=0?'disabled':''}>
      ${t.label}<span class="cost">${t.cost}</span></button>`;
  }).join('');
  app.innerHTML = `<div class="stage">${verlauf()}<div>${wegband(n)}
    <div class="card"><div class="ch"><span>${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
      <div class="cb"><div class="prose">${n.text.map(t=>`<p>${t}</p>`).join('')}</div>
      ${L.log.length?`<div class="ergebnis">${L.log.join('<br><br>')}</div>`:''}
      ${L.gesichert?'<div class="wirkung"><span>Feldzug gesichert</span>Du kannst hier aufhören und später weitermachen. Wer fällt, verliert den Spielstand im selben Augenblick.</div>':''}
      <div class="probe" style="margin-top:12px">VERBLEIBENDE ABENDE: ${L.abende} VON ${abendeFuer(n)}${
        abendeFuer(n)>n.abende?` · ${(abendeFuer(n)-n.abende)===1?'EIN ABEND':'ZWEI ABENDE'} MEHR ALS ${rangName(S.rang).toUpperCase()}`:''}</div>
      </div></div>
    <div class="orders"><div class="ch"><span>Womit verbringst du den Abend?</span></div><div class="ordbody">
      ${opt}${L.abende<=0?'<button class="ord weiter" onclick="lagerEnde()">Antreten lassen</button>':''}
    </div></div>
    </div>${seitenleiste()}</div>`;
  kopfzeile();
}
function lagerTun(id){
  const L = LAUF.lager;
  if(L.abende<=0) return;
  L.abende--;
  L.log.push(LAGER_TUN[id].tu());
  S.log.push(L.id+': '+LAGER_TUN[id].label);
  laufSichern();
  zeigeLager(KAPITEL[LAUF.node]);
}
function lagerEnde(){ LAUF.lager = {id:null, abende:0, log:[]}; stationErledigt(); naechster(); }

/* ══════════════════ WINTERQUARTIER ══════════════════ */

function zeigeWinter(n){
  const W = LAUF.winter;
  if(W.wochen===3 && !W.log.length){
    W.log=[]; W.gesichert = Ablage.dauerhaft;
    /* Drei Wochen unter einem Dach, mit Sold und zweimal Essen am Tag: Der Atem
       ist danach voll, ohne dass man dafür eine Woche opfern müsste. Belastung
       und Wunden bleiben Sache der Wochenverteilung — die sitzen tiefer. */
    W.atemVoll = S.atem < 100; S.atem = 100;
    laufSichern();
  }
  const tun = [
    {id:'ausr',label:'Ausrüstung instand setzen',cost:'Schuhe, Muskete und Tornister flicken'},
    {id:'drill',label:'Drillen und schießen üben',cost:'Muskete und Drill steigen'},
    {id:'lesen',label:'Lesen und Schreiben üben',cost:'Bildung und Verwaltung · kostet 6 Francs'},
    {id:'leute',label:'Zeit mit Martel und den Männern verbringen',cost:'Gunst und Kameradschaft'},
    {id:'ruhe',label:'Schlafen, essen, nichts tun',cost:'Leben und Belastung erholen sich, Wunden heilen'}
  ];
  const opt = tun.map(t=>`<button class="ord" onclick="winterTun('${t.id}')" ${W.wochen<=0?'disabled':''}>
    ${t.label}<span class="cost">${t.cost}</span></button>`).join('');
  app.innerHTML = `<div class="stage">${verlauf()}<div>${wegband(n)}
    <div class="card"><div class="ch"><span>${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
      <div class="cb"><div class="prose">${(n.text||[]).map(t=>`<p>${t}</p>`).join('')}</div>
      ${W.log.length?`<div class="ergebnis">${W.log.join('<br><br>')}</div>`:''}
      ${W.atemVoll?'<div class="wirkung"><span>Wieder bei Atem</span>Drei Wochen unter einem Dach, Sold und zweimal Essen am Tag. Du bist ausgeruht, wie du es seit April nicht warst. <b>Atem 100</b></div>':''}
      ${W.gesichert?'<div class="wirkung"><span>Feldzug gesichert</span>Du kannst hier aufhören und später weitermachen. Wer fällt, verliert den Spielstand im selben Augenblick.</div>':''}
      <div class="probe" style="margin-top:12px">VERBLEIBENDE WOCHEN: ${W.wochen}</div>
      </div></div>
    <div class="orders"><div class="ch"><span>Womit verbringst du die Woche?</span></div><div class="ordbody">
      ${opt}${W.wochen<=0?'<button class="ord weiter" onclick="winterEnde()">Ins Feld zurück</button>':''}
    </div></div>
    </div>${seitenleiste()}</div>`;
}
function winterTun(id){
  const W = LAUF.winter;
  if(W.wochen<=0) return;
  W.wochen--;
  if(id==='ausr'){
    for(const k in S.ausr) if(S.ausr[k].verschleiss) S.ausr[k].zustand = Math.min(100, S.ausr[k].zustand+30);
    W.log.push('Eine Woche Draht, Pech und Leder. Die Schuhe halten wieder, das Schloss der Muskete ist trocken. <span style="color:var(--faint)">Alle Ausrüstung +30</span>');
  }
  if(id==='drill'){
    nutzen('muskete',3); nutzen('drill',3); nutzen('bajonett',2);
    W.log.push('Exerzieren auf einem gefrorenen Feld, bis die Handgriffe von allein gehen. <span style="color:var(--faint)">Muskete, Drill und Bajonett steigen</span>');
  }
  if(id==='lesen'){
    if(S.geld>=6){ S.geld-=6; S.attr.bildung=Math.min(100,S.attr.bildung+7); nutzen('verwaltung',2);
      W.log.push('Ein Sergent aus Lyon bringt dir Buchstaben bei, gegen Schnaps und sechs Francs. Es ist mühsamer als Grabenschaufeln. <span style="color:var(--faint)">Bildung +7 · −6 F</span>'); }
    else W.log.push('Du hast keine sechs Francs. Der Sergent lacht und dreht sich um. <span style="color:var(--faint)">nichts passiert</span>');
  }
  if(id==='leute'){
    S.gunst+=2; S.kameradschaft=Math.min(100,S.kameradschaft+10); S.belastung=Math.max(0,S.belastung-5);
    nutzen('menschenkenntnis',2);
    W.log.push('Karten, Wein und Geschichten, die jedes Mal besser werden. Martel erzählt vom Rhein, und du hörst zu. <span style="color:var(--faint)">Gunst +2 · Kameradschaft +10</span>');
  }
  if(id==='ruhe'){
    /* Die einzige Handlung, die den Lebensvorrat wirklich wieder auffüllt —
       und sie kostet eine der drei Wochen. Wer verwundet aus dem Feldzug kommt,
       muss sich zwischen Genesung und Ausbildung entscheiden; das ist dieselbe
       Knappheit wie im Lager, nur eine Größenordnung wirksamer. */
    S.belastung=Math.max(0,S.belastung-16); S.atem=100; lebenAuffuellen(0.6);
    if(S.wunden.length){ const w=S.wunden.shift(); W.log.push(`Die Wunde („${w.name}") schließt sich endlich. <span style="color:var(--faint)">Leben +60 % · Belastung −16 · Wunde geheilt</span>`); }
    else W.log.push('Du schläfst, isst zweimal am Tag und tust drei Wochen lang nichts Nützliches. Es hilft mehr als alles andere. <span style="color:var(--faint)">Leben +60 % · Belastung −16</span>');
  }
  if(S.kaeufe.includes('flasche')) S.belastung=Math.max(0,S.belastung-2);
  laufSichern();
  zeigeWinter(KAPITEL[LAUF.node]);
}
function winterEnde(){ LAUF.winter = {wochen:3, log:[]}; stationErledigt(); naechster(); }

/* ══════════════════ WERTUNG UND ENDE ══════════════════ */

function stationen(){ return Math.min(KAPITEL.length, LAUF.node+1); }

function wertung(){
  const p = {};
  p.rang = rangWert(S.rang);
  p.stationen = 2 * stationen();   // 2 seit Kapitel 2: 32 Stationen — siehe CLAUDE.md
  p.ruf = 5 * Math.floor(S.ruf/10);
  p.nennungen = 3 * Math.min(10, S.nennungen);
  p.ueberleben = S.lebt ? 25 : 0;
  p.sauber = (!S.gekniffen && S.lebt) ? 10 : 0;
  p.summe = p.rang+p.stationen+p.ruf+p.nennungen+p.ueberleben+p.sauber;
  return p;
}

/* Was von einem Mann bleibt. Die vier alten Felder stehen vorn, damit die
   Chroniktabelle unverändert weiterläuft; alles Übrige ist der Zusatz, den das
   Blatt anzeigt. Ältere Einträge ohne diese Felder bleiben lesbar — sie zeigen
   dann eben nur die Zeile. */
function chronikblatt(endeText, p){
  const letzte = KAPITEL[Math.min(LAUF?LAUF.node:0, KAPITEL.length-1)] || {};
  return {
    name:S.name, rang:rangName(S.rang), ende:endeText, punkte:p.summe,
    herkunft:S.herkunft, zweig:S.zweig, rangN:S.rang, gefallen:!S.lebt,
    ort:letzte.datum || '', stationen:stationen(),
    attr:Object.assign({},S.attr), fert:Object.assign({},S.fert),
    ausr:Object.keys(S.ausr).map(k=>({name:S.ausr[k].name, zustand:S.ausr[k].zustand,
                                      verschleiss:S.ausr[k].verschleiss})),
    wunden:S.wunden.map(w=>w.name), ruf:S.ruf, gunst:S.gunst,
    kameradschaft:S.kameradschaft, belastung:S.belastung, atem:S.atem,
    leben:S.leben, lebenMax:lebenMax(),
    nennungen:S.nennungen, geld:S.geld, gekniffen:!!S.gekniffen,
    kaeufe:(S.kaeufe||[]).slice(), gekauft:Object.assign({},S.gekauft||{}),
    log:(S.log||[]).slice(), wertung:p
  };
}

function eintragen(endeText){
  const p = wertung();
  META.chronik.push(chronikblatt(endeText, p));
  META.laeufe = (META.laeufe|0) + 1;
  META.vp = Math.max(META.vp, p.summe);
  chronikKuerzen();
  laufVerwerfen();          // der Lauf ist zu Ende, in jedem Fall
  chronikSichern();
  return p;
}

function wertungsTabelle(p){ return wertungsTabelleAus({wertung:p, rang:rangName(S.rang),
  stationen:stationen(), ruf:S.ruf, nennungen:S.nennungen}); }

function wertungsTabelleAus(c){
  const p = c.wertung; if(!p) return '';
  return `<table>
    <tr><th>Wofür</th><th class="n">VP</th></tr>
    <tr><td class="d">Erreichter Rang — ${esc(c.rang)}</td><td class="n">${p.rang}</td></tr>
    <tr><td class="d">Erreichte Stationen (${c.stationen} × 2)</td><td class="n">${p.stationen}</td></tr>
    <tr><td class="d">Ruf ${c.ruf}, je volle 10 Punkte</td><td class="n">${p.ruf}</td></tr>
    <tr><td class="d">Im Tagesbefehl genannt (${c.nennungen}×)</td><td class="n">${p.nennungen}</td></tr>
    <tr><td class="d">Kapitel lebend beendet</td><td class="n">${p.ueberleben}</td></tr>
    <tr><td class="d">Nie vor Zeugen gekniffen</td><td class="n">${p.sauber}</td></tr>
    <tr class="hi"><td class="d"><b>Summe</b></td><td class="n"><b>${p.summe}</b></td></tr>
  </table>`;
}

function zeigeTod(){
  const grund = S.todesart || 'Gefallen';
  laufVerwerfen();
  const p = eintragen(grund);
  const neu = p.summe >= META.vp;
  app.innerHTML = `<div class="card"><div class="ch"><span class="tot">Ende</span><span>${esc(grund)}</span></div>
    <div class="cb">
      <div class="prose">
        <p><b>${esc(S.name)}</b>, ${rangName(S.rang)} der 32. Halbbrigade, ${esc(grund.toLowerCase())}.</p>
        <p>${todesText()}</p>
      </div>
      <div class="grid2" style="margin-top:18px">
        <div>${wertungsTabelle(p)}</div>
        <div class="note ${neu?'green':'red'}">
          ${neu?`<b>Neuer Rekord.</b> Dein Vorrat steigt auf <b>${META.vp} Veteranenpunkte</b>. Der nächste Mann rückt besser ausgerüstet ein.`
                :`Dein bester Lauf bleibt bei <b>${META.vp} Punkten</b>. Dieser hier war nicht besser — er kostet dich aber auch nichts.`}
          <p style="margin-top:10px">Gezählt wird nur der beste Lauf. Es gibt nichts zu grinden, nur zu übertreffen.</p>
        </div>
      </div>
      <div class="probe" style="margin-top:14px">DER SPIELSTAND DIESES MANNES IST GELÖSCHT</div>
      <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="plain" onclick="zeigeErschaffung(true)">Nächster Mann</button>
        <button class="plain" onclick="zeigeTitel()">Zur Chronik</button>
        <button class="plain" onclick="speichern()">Spielstand sichern</button>
      </div>
    </div></div>`;
  LAUF=null; binde(); kopfzeile();
}
function todesText(){
  const t = [
    'Man nimmt ihm die Patronen ab und die Schuhe, wenn sie noch etwas taugen, und zieht weiter. Am Abend fehlt sein Name beim Appell, und am übernächsten Tag erinnert sich niemand mehr, wann genau er gefehlt hat.',
    'Zwei Männer tragen ihn an den Rand und legen ihn zu den anderen. Ein Brief nach Hause wird nicht geschrieben, weil in seiner Kompanie niemand schreiben kann.',
    'Er wird in eine Grube gelegt, die vierzig andere teilen. Die Halbbrigade marschiert am Morgen weiter, und seine Muskete bekommt ein Rekrut, der noch nicht weiß, wem sie gehört hat.'
  ];
  return t[Math.floor(Math.random()*t.length)];
}

function zeigeKapitelende(n){
  n = n || KAPITEL[KAPITEL.length-1] || {};
  const p = eintragen('Feldzüge überstanden · '+rangName(S.rang));
  const neu = p.summe >= META.vp;
  const rangSatz = S.rang>=3 ? 'Acht Mann sehen dich morgens an und warten, was du sagst.'
    : (S.rang===2 ? 'Du stehst nicht mehr in der Mitte des Bataillons, sondern dort, wo sie die Leute hinstellen, auf die es ankommt.'
                  : 'Du stehst noch in der Reihe wie am ersten Tag — aber du stehst.');
  app.innerHTML = `<div class="card"><div class="ch"><span>${esc(n.datum||'')}</span><span>${esc(n.ort||'')}</span></div>
    <div class="cb"><div class="prose">
      ${(n.text||[]).map(t=>`<p>${t}</p>`).join('')}
      <p>Du bist <b>${rangName(S.rang)}</b>. ${rangSatz}</p>
    </div>
    <div class="grid2" style="margin-top:18px">
      <div>${wertungsTabelle(p)}</div>
      <div class="note ${neu?'green':''}">
        ${neu?`<b>Neuer Rekord: ${META.vp} Veteranenpunkte.</b>`:`Dein bester Lauf bleibt bei <b>${META.vp} Punkten</b>.`}
        <p style="margin-top:10px">${n.ausblick||''}</p>
        <p style="margin-top:10px">Was hier funktioniert, funktioniert in den nächsten Kapiteln genauso: Proben gegen Attribute, Ausrüstung, die verschleißt, Ruf und Fürsprache, die über Beförderung entscheiden — und ein Tod, der endgültig ist.</p>
      </div>
    </div>
    <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="plain" onclick="zeigeErschaffung(true)">Noch einmal, besser</button>
      <button class="plain" onclick="zeigeTitel()">Zur Chronik</button>
      <button class="plain" onclick="speichern()">Spielstand sichern</button>
    </div>
  </div></div>`;
  LAUF=null; binde(); kopfzeile();
}

/* ══════════════════ SPIELSTAND ══════════════════ */

function speichern(){
  const blob = new Blob([dateiInhalt()],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'marschallstab-spielstand.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function laden(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    let e;
    try{ e = dateiEinlesen(r.result); }
    catch(x){ e = {ok:false, grund:'Diese Datei ließ sich nicht lesen.'}; }
    if(e.ok) zeigeTitel(); else alert(e.grund);
  };
  r.readAsText(f);
}


'use strict';

chronikLaden();
zeigeTitel();

</script>
