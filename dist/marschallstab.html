<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Der Marschallstab — Italien 1796/97</title>
<style>
:root{
    --bg:#121110; --panel:#1a1816; --panel2:#252119; --line:#3a342c;
    --text:#ded5c4; --dim:#aca192; --faint:#948a79;
    --blood:#c2483a; --brass:#d0a75e; --steel:#8b9aa3; --green:#8b9a68;
  }
  /* Kontrast: --dim und --faint waren #877e71 und #5c554b — auf dem Braun der
     Karten ergab das 2,2:1 bei den Beschriftungen. Jetzt 4,7:1 und 6,6:1.
     Wer hier abdunkelt, macht die Hälfte der Oberfläche wieder unlesbar. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:Georgia,'Iowan Old Style',serif;font-size:16px;line-height:1.65;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1460px;margin:0 auto;padding:24px 20px 70px}

  header.top{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  h1{font-size:19px;font-weight:normal;letter-spacing:.14em;text-transform:uppercase;margin:0}
  .sub{color:var(--dim);font-size:12.5px;font-style:italic;margin:3px 0 0}
  .hdrright{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
    color:var(--dim);letter-spacing:.1em;text-align:right}

  .card{background:var(--panel);border:1px solid var(--line);margin-bottom:18px}
  .ch{padding:8px 15px;border-bottom:1px solid var(--line);background:var(--panel2);
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c7bdab;
    display:flex;justify-content:space-between;gap:12px}
  .cb{padding:17px}

  .stage{display:grid;grid-template-columns:246px 1fr 292px;gap:18px;align-items:start}
  @media(max-width:1180px){.stage{grid-template-columns:1fr 292px}
    .stage>.verlauf{grid-column:1/-1;order:2}}
  @media(max-width:900px){.stage{grid-template-columns:1fr}}

  .prose p{margin:0 0 12px}
  .prose p:last-child{margin-bottom:0}
  .prose em{color:#e0d8c8}
  .said{color:var(--dim)}
  .ergebnis{border-left:2px solid var(--brass);background:#1c1915;padding:12px 15px;margin:14px 0 0;font-size:15px}
  .ergebnis.gut{border-left-color:var(--green)}
  .ergebnis.schlecht{border-left-color:var(--blood)}
  .probe{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    color:var(--dim);letter-spacing:.06em;margin-top:8px}

  .who{font-size:17px;margin:0 0 2px}
  .whorank{color:var(--brass);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 13px}
  .stat{margin-bottom:9px}
  .statlab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);
    margin-bottom:3px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .bar{height:5px;background:#0c0b0a;border:1px solid #2a2621}
  .bar i{display:block;height:100%;transition:width .3s}
  .b-red i{background:var(--blood)} .b-brass i{background:var(--brass)}
  .b-steel i{background:var(--steel)} .b-green i{background:var(--green)}
  .b-dim i{background:#5c554b}
  .rule{height:1px;background:var(--line);margin:14px 0}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;gap:10px;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}
  .kv b{font-weight:normal;color:#f0e7d5}
  .kv .warn{color:var(--blood)} .kv .ok{color:#8b9a68}
  .mini{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:0 0 7px}

  .orders{margin-top:18px;border:1px solid var(--line);background:var(--panel)}
  .ordbody{display:flex;flex-direction:column;gap:8px;padding:14px 15px}
  .ord{background:#100f0d;border:1px solid #443d33;color:var(--text);
    font-family:inherit;font-size:15px;padding:10px 14px;cursor:pointer;text-align:left;
    transition:border-color .15s,color .15s;line-height:1.45}
  .ord:hover:not(:disabled){border-color:var(--brass);color:#efe6d4}
  .ord.risk:hover:not(:disabled){border-color:var(--blood)}
  .ord:disabled{opacity:.32;cursor:not-allowed}
  .ord .cost{display:block;font-size:11.5px;color:var(--faint);letter-spacing:.05em;
    font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:4px}
  .ord.weiter{border-color:var(--brass);color:#efe6d4}

  button.plain{background:#100f0d;border:1px solid #443d33;color:var(--text);
    font-family:inherit;font-size:14px;padding:8px 16px;cursor:pointer}
  button.plain:hover{border-color:var(--brass);color:#efe6d4}
  button.plain:disabled{opacity:.3;cursor:not-allowed}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-weight:normal;color:var(--dim);font-size:10.5px;
    letter-spacing:.13em;text-transform:uppercase;padding:0 9px 7px 0;
    border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,Consolas,monospace}
  th.n,td.n{text-align:right;white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}
  td{padding:6px 9px 6px 0;border-bottom:1px solid #232019;vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.k{color:var(--brass);white-space:nowrap}
  td.d{color:#c2b8a6}
  tr.hi td{background:#201d17}

  .note{border-left:2px solid var(--brass);background:#1c1915;padding:13px 16px;
    color:#c9bfad;font-size:14.5px}
  .note.red{border-left-color:var(--blood)}
  .note.green{border-left-color:var(--green)}
  .note b{color:#e6ddcb;font-weight:normal}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:800px){.grid2{grid-template-columns:1fr}}
  .hidden{display:none !important}
  svg{display:block;width:100%;height:auto}

  /* Charaktererschaffung */
  .attrrow{display:grid;grid-template-columns:118px 1fr 46px 78px;gap:10px;align-items:center;
    margin-bottom:9px}
  .attrname{font-size:14px}
  .attrval{font-family:ui-monospace,monospace;font-size:14px;text-align:right;color:#e6ddcb}
  .pmbtn{background:#100f0d;border:1px solid #443d33;color:var(--text);width:32px;height:26px;
    cursor:pointer;font-family:ui-monospace,monospace;font-size:14px;line-height:1}
  .pmbtn:hover:not(:disabled){border-color:var(--brass)}
  .pmbtn:disabled{opacity:.25;cursor:not-allowed}
  input[type=text]{background:#100f0d;border:1px solid #443d33;color:var(--text);
    font-family:inherit;font-size:15px;padding:8px 11px;width:100%}
  input[type=text]:focus{outline:none;border-color:var(--brass)}
  .herkwahl{display:flex;flex-direction:column;gap:7px}
  .herk{background:#100f0d;border:1px solid #443d33;padding:10px 13px;cursor:pointer;
    font-size:14px;transition:border-color .15s}
  .herk:hover{border-color:#5b4f3a}
  .herk.on{border-color:var(--brass);background:#1c1913}
  .herk .hn{color:var(--brass);font-size:14.5px}
  .herk .hd{color:var(--dim);font-size:13px;margin-top:3px;
    font-family:ui-monospace,monospace;letter-spacing:.02em}

  /* Ausbildung vorwegnehmen — Veteranenpunkte in Werte umsetzen */
  .punktzeile{display:grid;grid-template-columns:1fr 96px 62px 68px;gap:10px;align-items:center;
    padding:5px 6px;border-bottom:1px solid #232019;font-size:14px}
  .punktzeile:last-child{border-bottom:none}
  .punktzeile.hi{background:#201d17}
  .punktwert{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;
    text-align:right;color:#f0e7d5;white-space:nowrap}
  .punktwert i{color:var(--brass);font-style:normal;padding:0 3px}
  .hinweis{color:var(--faint);font-size:13px;margin:0 0 14px}
  .punktvp{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    text-align:right;color:var(--brass)}
  .punktvp.aus{color:var(--faint)}

  /* Kampagnenverlauf links — was man gesehen hat, sieht man; sonst nichts */
  .verlauf .cb{padding:8px 9px}
  .kmp{border-bottom:1px solid #262219}
  .kmp:last-child{border-bottom:none}
  .kmpkopf{display:grid;grid-template-columns:14px 18px 1fr auto;gap:6px;align-items:baseline;
    width:100%;background:none;border:none;padding:8px 6px;cursor:pointer;text-align:left;
    font-family:inherit;color:var(--dim);font-size:14px}
  .kmpkopf:hover{color:#f0e7d5}
  .kmppfeil{color:var(--brass);font-size:10px;line-height:1}
  .kmpnr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--faint)}
  .kmpname{color:inherit}
  .kmpname i{color:var(--brass);font-style:normal;font-size:11.5px;letter-spacing:.06em}
  .kmpjahr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:var(--faint)}
  .kmp.ungebaut .kmpkopf{color:var(--faint)}
  .kmp.ungebaut .kmppfeil{color:var(--faint)}
  .kmpliste{display:none;padding:0 6px 9px 26px}
  .kmp.auf .kmpliste{display:block}
  .kmpst{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;
    padding:5px 6px 5px 10px;border-left:1px solid #3a342c;font-size:13.5px;color:var(--dim)}
  .kmpst.gefecht{border-left-color:var(--blood)}
  .kmpst.jetzt{border-left-color:var(--brass);background:#221e18}
  .kmpst.jetzt .kmpst-ort{color:#f0e7d5}
  .kmpst-ort{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kmpst-art{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
    border:1px solid #322c25;padding:1px 5px;white-space:nowrap}
  .kmpst.gefecht .kmpst-art{color:#d99184;border-color:#5a2a24}
  .kmpst.jetzt .kmpst-art{color:var(--brass);border-color:#5a4526}
  .kmpst-mal{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;
    color:var(--faint);white-space:nowrap}
  .kmpleer{padding:5px 0 5px 11px;font-size:12.5px;font-style:italic;color:var(--faint)}

  /* Warnung — nur da, wo es wirklich gleich etwas kostet */
  .warnung{margin:7px 0 0;padding:8px 11px;background:#2a1815;
    border-left:2px solid var(--blood);color:#eab5ab;font-size:13px;line-height:1.5}
  .warnung b{color:#f3d0c8;font-weight:normal;font-family:ui-monospace,Menlo,Consolas,monospace}
  .statlab .warn{color:var(--blood)}

  /* Erklärung beim Überfahren — reines CSS, keine Abhängigkeit */
  .hilfe{position:relative;cursor:help;border-bottom:1px dotted var(--faint)}
  .hilfe:hover{color:#f0e7d5;border-bottom-color:var(--brass)}
  .hilfe:hover::after{content:attr(data-hilfe);position:absolute;z-index:30;
    left:0;top:calc(100% + 7px);width:265px;padding:10px 13px;
    background:#221e18;border:1px solid var(--line);border-left:2px solid var(--brass);
    color:#ded5c4;font-family:Georgia,'Iowan Old Style',serif;font-size:13.5px;
    line-height:1.55;letter-spacing:0;text-transform:none;font-style:normal;
    box-shadow:0 8px 24px rgba(0,0,0,.65)}
  /* In der schmalen Seitenleiste nach links ausklappen, sonst steht es draußen */
  aside .hilfe:hover::after{left:auto;right:0}

  /* Ortswechsel — das Band über der Station */
  .weg{border:1px solid var(--line);border-left:2px solid var(--brass);background:#171512;
    padding:9px 15px;margin-bottom:14px}
  .wegorte{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
    letter-spacing:.13em;text-transform:uppercase;color:#ded5c4}
  .wegorte i{color:var(--brass);font-style:normal;padding:0 9px}
  .wegtext{color:#c2b8a6;font-size:13.5px;font-style:italic;margin-top:3px}

  /* Lagebild vor dem Gefecht */
  .lage{border-top:1px solid var(--line);margin-top:16px;padding-top:13px}
  .lagekopf{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--brass);margin-bottom:9px}
  .lage table{font-size:13.5px}
  .lage td{padding:4px 12px 4px 0}
  .lage .prose p{margin:0 0 7px;font-size:15px;color:var(--dim)}
  .fein{color:var(--faint);font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}

  /* Ergebnis einer Probe — nur gelungen oder misslungen, nicht die Rechnung */
  .pruefung{display:block;width:fit-content;margin-top:12px;padding:2px 8px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;
    letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--line);background:#100f0d;color:var(--dim)}
  .pruefung.gut{border-color:var(--green);color:#b6c48d}
  .pruefung.schlecht{border-color:var(--blood);color:#e08a7e}

  /* Was sich dadurch geändert hat — die wichtigste Zeile nach jeder Wahl */
  .wirkung{margin-top:13px;padding:9px 14px;background:#221e18;
    border-left:2px solid var(--brass);color:#e2d9c7;font-size:13.5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em}
  .wirkung span{display:block;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--brass);margin-bottom:3px}

  .log{max-height:200px;overflow-y:auto;font-size:14px;color:var(--dim)}
  .log div{padding:3px 0;border-bottom:1px solid #221f1a}
  .log div:last-child{border-bottom:none}
  .tot{color:var(--blood)}
  .zit{font-style:italic;color:#c2b8a6;border-left:2px solid var(--brass);padding-left:14px;margin:14px 0}
  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
    color:var(--faint);font-size:12px;font-style:italic;display:flex;
    justify-content:space-between;gap:14px;flex-wrap:wrap}

</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div>
    <h1>Der Marschallstab</h1>
    <p class="sub" id="untertitel">Erstes Kapitel · Italien 1796/97</p>
  </div>
  <div class="hdrright" id="kopfrechts"></div>
</header>

<div id="app"></div>

<footer>
  <span>Prototyp · Meilenstein 1 · Ränge 1–3</span>
  <span id="fusszeile"></span>
</footer>
</div>

<script>
'use strict';
/* Grundwerte: Attribute, Fertigkeiten, Ränge, Herkünfte, Ausrüstung, Kaufladen.
   Reine Daten. Wer hier Zahlen ändert, trägt sie in CLAUDE.md nach. */

/* ══════════════════ DATEN ══════════════════ */

/* Dritter Eintrag ist der Erklärtext, der beim Überfahren erscheint. Er sagt,
   was der Wert im Spiel tut — nicht, was er bedeutet. Wo ein Wert in diesem
   Kapitel noch nichts tut, steht das auch da. */
const ATTRIBUTE = [
  ['konstitution','Konstitution','Was du aushältst. Entscheidet mit, ob eine Kugel eine Wunde oder ein Ende ist, und ob dich die Grenadiere nehmen — sie verlangen 55.'],
  ['geschick','Geschick','Hände und Füße. Laden unter Beschuss, Deckung wechseln, Ausrüstung flicken. Die Voltigeure verlangen 55.'],
  ['kaltbluetigkeit','Kaltblütigkeit','Ob du stehen bleibst, wenn die Linie steht. Wird geprüft, wenn es darauf ankommt, und nie vorher.'],
  ['autoritaet','Autorität','Ob acht Männer tun, was du sagst. Als Fusilier ohne Wirkung, ab dem Caporal das Wichtigste.'],
  ['bildung','Bildung','Lesen, schreiben, rechnen. Du kannst es nicht — und ab dem Caporal-fourrier geht es ohne nicht weiter.'],
  ['menschenkenntnis','Menschenkenntnis','Wer redet, wer schweigt, wer dich deckt. Öffnet Wege durch Szenen, die andere nicht sehen.']
];
const FERTIGKEITEN = [
  ['muskete','Muskete','Treffen im Rauch. Die wichtigste Zahl im Gefecht — und die einzige, die vom Zustand deiner Waffe abhängt.'],
  ['bajonett','Bajonett','Der Angriff auf zehn Schritt. Richtet mehr an als jeder Schuss und bringt dich weit nach vorn, wo es am gefährlichsten ist.'],
  ['reiten','Reiten','In diesem Kapitel noch ohne Verwendung. Zählt ab den Rängen, die ein Pferd bekommen.'],
  ['drill','Drill','Handgriffe ohne Nachdenken. Hält die Linie und schließt Lücken, wenn du Männer zu befehligen hast.'],
  ['taktik','Taktik','Gelände lesen, Absichten erkennen. Kommt in Szenen vor, zählt aber erst in den höheren Rängen richtig.'],
  ['kartenkunde','Kartenkunde','In diesem Kapitel noch ohne Verwendung. Für den Fusilier bedeutungslos, für den General alles.'],
  ['verwaltung','Verwaltung','Listen, Rationen, Kompaniekasse. Der Weg zum Caporal-fourrier führt hier entlang.'],
  ['fouragieren','Fouragieren','Essen finden, wo keins ist. Hält dich und deine Kameradschaft am Leben, wenn der Nachschub ausbleibt.'],
  ['feldchirurgie','Feldchirurgie','In diesem Kapitel noch ohne Verwendung. Später der Unterschied zwischen einer Wunde und einem Grab.']
];
const NAMEN = ATTRIBUTE.concat(FERTIGKEITEN).reduce((o,[k,n])=>(o[k]=n,o),{});
const ERKLAERUNG = ATTRIBUTE.concat(FERTIGKEITEN).reduce((o,[k,,e])=>(o[k]=e||'',o),{});

/* Ein Wort mit Erklärung beim Überfahren. Reines CSS, keine Abhängigkeit. */
function mitHilfe(k, beschriftung){
  const e = ERKLAERUNG[k];
  return e ? `<span class="hilfe" data-hilfe="${String(e).replace(/"/g,'&quot;')}">${beschriftung}</span>` : beschriftung;
}

const RANG = [
  {n:1,name:'Fusilier',wert:0},{n:2,name:'Grenadier',wert:12},{n:3,name:'Caporal',wert:26},
  {n:4,name:'Caporal-fourrier',wert:42},{n:5,name:'Sergent',wert:62}
];
function rangNameVon(mann){
  if(mann.rang===2) return mann.zweig==='voltigeur' ? 'Voltigeur' : 'Grenadier';
  const r=RANG.find(r=>r.n===mann.rang); return r?r.name:'Fusilier';
}
function rangName(n){ return rangNameVon({rang:n, zweig:S?S.zweig:null}); }
function rangWert(n){ const r=RANG.find(r=>r.n===n); return r?r.wert:0; }

const HERKUENFTE = [
  {id:'bauer',name:'Bauernsohn',
   text:'Konstitution +20 · Fouragieren +25 · Bajonett +15 · Bildung −10',
   attr:{konstitution:20,bildung:-10}, fert:{fouragieren:25,bajonett:15}},
  {id:'schmied',name:'Schmiedsgeselle',
   text:'Geschick +20 · Muskete +25 · Bajonett +15 · Menschenkenntnis −10',
   attr:{geschick:20,menschenkenntnis:-10}, fert:{muskete:25,bajonett:15}},
  {id:'wilderer',name:'Wilderer',
   text:'Muskete +30 · Fouragieren +20 · Geschick +15 · Autorität −15',
   attr:{geschick:15,autoritaet:-15}, fert:{muskete:30,fouragieren:20}},
  {id:'fuhrmann',name:'Fuhrmannssohn',
   text:'Reiten +30 · Verwaltung +20 · Konstitution +10 · Kaltblütigkeit −10',
   attr:{konstitution:10,kaltbluetigkeit:-10}, fert:{reiten:30,verwaltung:20}},
  {id:'schreiber',name:'Schreibergehilfe',
   text:'Bildung +25 · Verwaltung +25 · Kartenkunde +20 · Konstitution −20',
   attr:{bildung:25,konstitution:-20}, fert:{verwaltung:25,kartenkunde:20}},
  {id:'strasse',name:'Straßenjunge aus Paris',
   text:'Menschenkenntnis +25 · Kaltblütigkeit +20 · Fouragieren +20 · Bildung −15',
   attr:{menschenkenntnis:25,kaltbluetigkeit:20,bildung:-15}, fert:{fouragieren:20}}
];

/* Die elf Kampagnen. Nur die erste ist gebaut; die übrigen stehen so im
   KONZEPT.md und werden im Verlauf links angezeigt, damit man sieht, wie lang
   der Weg ist. Jede Kapiteldatei trägt ihre Stationen selbst in STATIONEN ein. */
const KAMPAGNEN = [
  {id:'italien',    nr:1,  name:'Italien',        jahre:'1796–97', kurz:'Barfuß, hungrig, siegreich.',                 gebaut:true},
  {id:'aegypten',   nr:2,  name:'Ägypten',        jahre:'1798–99', kurz:'Hitze, Krankheit, Karrees gegen Mamluken.'},
  {id:'garnison',   nr:3,  name:'Garnison',       jahre:'1800–04', kurz:'Ruhe. Bildung nachholen, Beziehungen knüpfen.'},
  {id:'austerlitz', nr:4,  name:'Austerlitz',     jahre:'1805',    kurz:'Die perfekte Schlacht.'},
  {id:'jena',       nr:5,  name:'Jena–Auerstedt', jahre:'1806',    kurz:'Tempo, Verfolgung, Marschstrapazen.'},
  {id:'eylau',      nr:6,  name:'Eylau & Friedland', jahre:'1807', kurz:'Schnee und Massenverluste. Viele Vakanzen.'},
  {id:'spanien',    nr:7,  name:'Spanien',        jahre:'1808–12', kurz:'Guerilla. Kein Ruhm, nur Repressalien.'},
  {id:'russland',   nr:8,  name:'Russland',       jahre:'1812',    kurz:'Kein Feldzug, ein Überlebensspiel.'},

'use strict';
/* Spielstand: Fassungen, Wandler, Ablage, Aussetz-Spielstand.

   Zwei Dinge werden gespeichert, und sie haben nichts miteinander zu tun:

   CHRONIK  Veteranenpunkte, Chronik, erreichte Stationen. Lebt für immer,
            wächst, gehört später in die Steam-Cloud.
   LAUF     Der angefangene Feldzug. Ein einziger Platz, kein zweiter.
            Wird beim Tod sofort gelöscht und ist danach nicht mehr zu laden.

   Der Aussetz-Spielstand ist zum Aufhören da, nicht zum Wiederholen. Deshalb
   wird er bei jedem Schritt überschrieben und zeigt immer auf das Jetzt: Wer
   das Spiel beendet, kommt genau dorthin zurück, wo er war — nie weiter zurück.

   Die Datei bleibt das maßgebliche Format (Invariante 6). `localStorage` ist
   nur die bequeme Ablage, damit ein Absturz den Feldzug nicht kostet. Wo es
   sie nicht gibt, funktioniert alles weiter, nur eben ohne Absturzsicherung. */

const CHRONIK_FASSUNG = 1;
const LAUF_FASSUNG    = 1;
const CHRONIK_GRENZE  = 200;   // so viele Läufe im Einzelnen, der beste immer

const ORT_CHRONIK   = 'marschallstab.chronik';
const ORT_SICHERUNG = 'marschallstab.chronik.bak';
const ORT_LAUF      = 'marschallstab.lauf';

/* ══════════════════ ABLAGE ══════════════════ */

/* Eine Schicht, drei mögliche Rückseiten. Das Spiel darf nie wissen, wo es
   liegt — dieselbe Schnittstelle bedient später auch den Benutzerordner einer
   Electron-Verpackung und damit Steams Auto-Cloud. */
const Ablage = (function(){
  let echt = false;
  try { localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); echt = true; }
  catch(e){ echt = false; }        // file:// in manchen Browsern, privater Modus
  const fluechtig = {};
  return {
    dauerhaft: echt,
    lies(o){ try{ return echt ? localStorage.getItem(o) : (fluechtig[o] || null); }catch(e){ return fluechtig[o] || null; } },
    schreibe(o,t){ try{ if(echt) localStorage.setItem(o,t); else fluechtig[o]=t; return true; }
                   catch(e){ fluechtig[o]=t; return false; } },
    loesche(o){ try{ if(echt) localStorage.removeItem(o); }catch(e){} delete fluechtig[o]; }
  };
})();

/* ══════════════════ HÜLLE UND PRÜFSUMME ══════════════════ */

/* Nicht gegen Betrüger — auf dem eigenen Rechner ist das aussichtslos, und
   weil nur der beste Lauf zählt, lohnt es sich ohnehin nicht. Sondern gegen
   halb geschriebene Dateien und kaputte Cloud-Abgleiche. */
function pruefsumme(t){ let h = 0; for(let i=0;i<t.length;i++) h = (h*31 + t.charCodeAt(i))|0; return h; }

function huelle(nutzlast){
  const t = JSON.stringify(nutzlast);
  return JSON.stringify({pruef:pruefsumme(t), inhalt:nutzlast}, null, 1);
}
function auspacken(text){
  const d = JSON.parse(text);
  if(d && typeof d === 'object' && d.inhalt !== undefined){
    const heil = typeof d.pruef !== 'number' || d.pruef === pruefsumme(JSON.stringify(d.inhalt));
    return {inhalt:d.inhalt, heil};
  }
  return {inhalt:d, heil:true};        // Fassung 0: nackte Nutzlast, ohne Hülle
}

/* ══════════════════ WANDLER ══════════════════ */

/* Jeder Wandler hebt genau eine Fassung auf die nächste. Nie raten, nie eine
   Fassung überspringen. Wer das Format ändert, hängt hier einen Eintrag an und
   erhöht die Fassungszahl oben — sonst brechen alle Spielstände in der Welt. */
const CHRONIK_WANDLER = {
  0: alt => ({fassung:1, vp:alt.vp|0, chronik:alt.chronik||[], bestKapitel:alt.bestKapitel||{},
              laeufe:(alt.chronik||[]).length, zuletzt:null})
};
const LAUF_WANDLER = {};

function wandle(d, wandler, ziel){
  if(!d || typeof d !== 'object') return null;
  let f = typeof d.fassung === 'number' ? d.fassung : 0;
  while(f < ziel){
    const w = wandler[f];
    if(!w) return null;
    d = w(d); f = d.fassung;
  }
  return f === ziel ? d : null;        // aus der Zukunft: lieber nichts als Trümmer
}

function neueChronik(){
  return {fassung:CHRONIK_FASSUNG, vp:0, chronik:[], bestKapitel:{}, laeufe:0, zuletzt:null};
}

/* ══════════════════ CHRONIK ══════════════════ */

function chronikSichern(){
  META.fassung = CHRONIK_FASSUNG;
  META.zuletzt = new Date().toISOString();
  const alt = Ablage.lies(ORT_CHRONIK);
  if(alt) Ablage.schreibe(ORT_SICHERUNG, alt);     // eine Generation zurück bleibt
  Ablage.schreibe(ORT_CHRONIK, huelle(META));
}

function chronikLaden(){
  for(const ort of [ORT_CHRONIK, ORT_SICHERUNG]){
    const t = Ablage.lies(ort);
    if(!t) continue;
    try{
      const {inhalt, heil} = auspacken(t);
      const d = wandle(inhalt, CHRONIK_WANDLER, CHRONIK_FASSUNG);
      if(d && heil){ META = d; return true; }
      if(d && !heil) continue;                     // beschädigt: Sicherung versuchen
    }catch(e){ /* nächster Ort */ }
  }
  return false;
}

/* Die Chronik wächst mit jedem Lauf. Alle zählen, aber nur die jüngsten
   werden einzeln behalten — und der beste immer, denn er ist der Vorrat. */
function chronikKuerzen(){
  if(META.chronik.length <= CHRONIK_GRENZE) return;
  const best = META.chronik.reduce((a,b)=> b.punkte > a.punkte ? b : a);
  const jung = META.chronik.slice(-(CHRONIK_GRENZE-1));
  META.chronik = jung.indexOf(best) >= 0 ? jung : [best].concat(jung);
}

/* ══════════════════ AUSSETZ-SPIELSTAND ══════════════════ */

function laufSichern(){
  if(!LAUF || !LAUF.mann || !LAUF.mann.lebt) return;
  LAUF.zuletzt = new Date().toISOString();
  Ablage.schreibe(ORT_LAUF, huelle(LAUF));
}

/* Beim Tod. Sofort und ohne Umweg — danach gibt es nichts mehr zu laden. */
function laufVerwerfen(){ Ablage.loesche(ORT_LAUF); }

function laufVorhanden(){
  const t = Ablage.lies(ORT_LAUF);
  if(!t) return null;
  try{
    const {inhalt, heil} = auspacken(t);
    if(!heil) return null;
    const d = wandle(inhalt, LAUF_WANDLER, LAUF_FASSUNG);
    if(!d || !d.mann || !d.mann.lebt) return null;
    return d;
  }catch(e){ return null; }
}

/* ══════════════════ DATEI ══════════════════ */

/* Das maßgebliche Format: Chronik und, falls einer läuft, der Feldzug.
   Eine Datei, damit niemand zwei verwalten muss. */
function dateiInhalt(){
  return huelle({fassung:CHRONIK_FASSUNG, chronik:META, lauf:LAUF || laufVorhanden() || null});
}

function dateiEinlesen(text){
  const {inhalt, heil} = auspacken(text);
  if(!heil) return {ok:false, grund:'Die Datei ist beschädigt — die Prüfsumme stimmt nicht.'};
  // Fassung 0 war die nackte Chronik ohne Umschlag
  const rohChronik = inhalt && inhalt.chronik !== undefined && inhalt.chronik.vp !== undefined
    ? inhalt.chronik : inhalt;
  const c = wandle(rohChronik, CHRONIK_WANDLER, CHRONIK_FASSUNG);
  if(!c) return {ok:false, grund:'Diese Datei ist kein Spielstand oder stammt aus einer neueren Fassung des Spiels.'};
  META = c;
  chronikSichern();
  const l = inhalt && inhalt.lauf ? wandle(inhalt.lauf, LAUF_WANDLER, LAUF_FASSUNG) : null;
  if(l && l.mann && l.mann.lebt) Ablage.schreibe(ORT_LAUF, huelle(l));
  return {ok:true, lauf:!!l};
}


'use strict';
/* Mechanik: Spielzustand, Proben, Fertigkeitswachstum, Verschleiß, Wunden. */

/* ══════════════════ SPIELZUSTAND ══════════════════ */

let META = neueChronik();

/* Der ganze laufende Feldzug in einem Objekt — nur Daten, keine Verweise auf
   Kapiteldaten, keine Funktionen. Genau deshalb lässt er sich speichern.
   S und K sind bloß Kurznamen darauf und werden von binde() neu gesetzt. */
let LAUF = null;
let S = null;      // = LAUF.mann
let K = null;      // = LAUF.kampf

function binde(){ S = LAUF ? LAUF.mann : null; K = LAUF ? LAUF.kampf : null; }
function setzeKampf(k){ if(LAUF) LAUF.kampf = k; K = k; }

function neuerLauf(mann){
  LAUF = {fassung:LAUF_FASSUNG, mann, node:0, kampf:null, szene:null,
          lager:{id:null, abende:0, log:[]}, winter:{wochen:3, log:[]},
          begonnen:new Date().toISOString(), zuletzt:null};
  binde();
}

/* Die Station ist abgeschlossen und ihre Wirkung angewandt: Der Spielstand
   zeigt schon auf die nächste, damit ein Beenden auf dem Ergebnisbildschirm
   die Entscheidung nicht rückgängig macht. */
function stationErledigt(){ if(LAUF){ LAUF.node++; LAUF.szene = null; laufSichern(); } }

function neuerCharakter(name, herkunftId, attrVerteilung, kaeufe, punkte){
  const h = HERKUENFTE.find(x=>x.id===herkunftId);
  const attr = {}; ATTRIBUTE.forEach(([k])=> attr[k] = attrVerteilung[k]);
  const fert = {}; FERTIGKEITEN.forEach(([k])=> fert[k] = 10);
  for(const k in h.attr) attr[k] = Math.max(0, Math.min(100, attr[k] + h.attr[k]));
  for(const k in h.fert) fert[k] = Math.max(0, Math.min(100, fert[k] + h.fert[k]));
  // Mit Veteranenpunkten vorweggenommene Ausbildung, oben auf Herkunft und Pool
  for(const k in (punkte||{})){
    if(attr[k] !== undefined) attr[k] = Math.min(100, attr[k] + punkte[k]);
    else if(fert[k] !== undefined) fert[k] = Math.min(100, fert[k] + punkte[k]);
  }
  const ausr = AUSRUESTUNG_START();
  let geld = 4;
  (kaeufe||[]).forEach(id=>{
    if(id==='muskete_gut'){ ausr.muskete={name:'Modell 1777 An IX, eingeschossen',zustand:95,verschleiss:12}; fert.muskete+=8; }
    if(id==='bajonett_gut'){ ausr.seitenwaffe={name:'Geschliffenes Bajonett',zustand:95,verschleiss:8}; fert.bajonett+=5; }
    if(id==='schuhe_gut'){ ausr.schuhe={name:'Doppelt besohlte Schuhe',zustand:100,verschleiss:12}; }
    if(id==='tornister_gut'){ ausr.tornister={name:'Verstärkter Tornister',zustand:100,verschleiss:8}; }
    if(id==='geld'){ geld += 50; }
  });
  return {
    name, herkunft:h.name, herkunftId, attr, fert, ausr, geld,
    rang:1, zweig:null, ruf:0, gunst:0, kameradschaft:20, belastung:0,
    atem:100, wunden:[], nennungen:0, kaeufe:kaeufe||[], gekauft:punkte||{},
    kapitel:0, lebt:true, ende:null, log:[]
  };
}

/* ══════════════════ MECHANIK ══════════════════ */

function wert(k){
  let v = (S.attr[k] !== undefined) ? S.attr[k] : S.fert[k];
  if(k==='kaltbluetigkeit' && S.kaeufe.includes('amulett')) v += 5;
  // Wunden schlagen auf den Körper, nicht auf den Kopf
  const koerperlich = ['konstitution','geschick','muskete','bajonett','reiten'];
  if(koerperlich.includes(k)) S.wunden.forEach(w=>{ v -= w.abzug || 0; });
  else S.wunden.forEach(w=>{ v -= Math.round((w.abzug||0)/3); });
  v -= Math.floor(S.belastung/12);
  if(k==='muskete' && S.ausr.muskete.zustand < 35) v -= 15;
  if(k==='konstitution' && S.ausr.schuhe.zustand < 25) v -= 18;
  return Math.max(1, Math.round(v));
}

function probe(k, schwierigkeit){
  const w = wert(k);
  const ziel = Math.max(5, Math.min(95, w - schwierigkeit + 50));
  const wurf = 1 + Math.floor(Math.random()*100);
  nutzen(k, 1);
  return {wurf, ziel, wertRoh:w, erfolg: wurf <= ziel};
}

function nutzen(k, intens){
  const ist = (S.attr[k] !== undefined) ? S.attr[k] : S.fert[k];
  if(ist >= 100) return;
  const zuwachs = (1.7 * intens * (100-ist)/100) * (0.5 + Math.random());
  if(Math.random() < 0.75){
    const neu = Math.min(100, ist + Math.max(1, Math.round(zuwachs)));
    if(S.attr[k] !== undefined) S.attr[k] = neu; else S.fert[k] = neu;
  }
}

function anwenden(e){
  if(!e) return;
  if(e.ruf) S.ruf = Math.max(0, S.ruf + e.ruf);
  if(e.gunst) S.gunst = Math.max(0, S.gunst + e.gunst);
  if(e.kameradschaft) S.kameradschaft = Math.max(0, Math.min(100, S.kameradschaft + e.kameradschaft));
  if(e.belastung) S.belastung = Math.max(0, Math.min(100, S.belastung + e.belastung));
  if(e.atem) S.atem = Math.max(0, Math.min(100, S.atem + e.atem));
  if(e.geld) S.geld = Math.max(0, S.geld + e.geld);
  if(e.nennung){ S.nennungen++; }
  if(e.attr) for(const k in e.attr) S.attr[k] = Math.max(0, Math.min(100, S.attr[k] + e.attr[k]));
  if(e.fert) for(const k in e.fert) S.fert[k] = Math.max(0, Math.min(100, S.fert[k] + e.fert[k]));
  if(e.ausr) for(const k in e.ausr) S.ausr[k].zustand = Math.max(0, Math.min(100, S.ausr[k].zustand + e.ausr[k]));
  if(e.wunde) wundeGeben(e.wunde, 8);
}

function wundeGeben(name, abzug){
  S.wunden.push({name, abzug});
  S.belastung = Math.min(100, S.belastung + 6);
}

function verschleiss(faktor){
  for(const k in S.ausr){
    const a = S.ausr[k];
    if(a.verschleiss>0) a.zustand = Math.max(0, a.zustand - Math.round(a.verschleiss*faktor));
  }
}

/* Der Tod nimmt dem Spielstand im selben Augenblick die Gültigkeit. Kein
   Zurück, keine zweite Ausfertigung — Invariante 1. */
function toetlich(grund){
  S.lebt = false; S.ende = 'tot'; S.todesart = grund;
  laufVerwerfen();
}


'use strict';
/* Oberfläche: Titel, Kaufladen, Charaktererschaffung, Ablaufsteuerung, Szenen. */

/* ══════════════════ DARSTELLUNG ══════════════════ */

const app = document.getElementById('app');
const kopf = document.getElementById('kopfrechts');
const fuss = document.getElementById('fusszeile');
const untertitel = document.getElementById('untertitel');

function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function balken(klasse, v, max){ return `<div class="bar ${klasse}"><i style="width:${Math.max(0,Math.min(100,100*v/max))}%"></i></div>`; }

/* Ortswechsel über der Station: woher, wohin, wie weit, wie lange.
   Die Wege sind die halbe Erzählung dieses Feldzugs — 1 200 km in einem Jahr. */
function wegband(n){
  if(!n || !n.marsch) return '';
  const m = n.marsch;
  return `<div class="weg">
    <div class="wegorte">${esc(m.von)}<i>→</i>${esc(m.nach)}</div>
    <div class="wegtext">${esc(m.weg)}</div></div>`;
}

function kopfzeile(){
  fuss.textContent = `Veteranenpunkte: ${META.vp}`;
  if(!S){ kopf.innerHTML = `VETERANENPUNKTE ${META.vp} · LÄUFE ${META.laeufe|0}`; untertitel.textContent='Erstes Kapitel · Italien 1796/97'; return; }
  kopf.innerHTML = `${esc(S.name.toUpperCase())} · ${rangName(S.rang).toUpperCase()} · RUF ${S.ruf}`;
  const n = KAPITEL[Math.min(LAUF?LAUF.node:0, KAPITEL.length-1)];
  untertitel.textContent = n && n.datum ? n.datum : 'Italien 1796/97';
}

/* ── Kampagnenverlauf links ──
   Zeigt alle elf Kampagnen, aber innerhalb einer Kampagne nur die Stationen,
   die man mindestens einmal betreten hat. Was danach kommt, weiß man nicht —
   das ist Absicht und dieselbe Haltung wie im Gefecht: Du siehst, wo du bist,
   nicht, was auf dich zukommt. Der Nebel liegt in META.bestKapitel und
   überlebt deshalb den Tod. */

let VERLAUF_OFFEN = {italien:1};

/* Kurze Wörter: Die Spalte ist 246 px breit, „Neuaufstellung" bricht dort um. */
function stationsArt(n){
  return {kampf:'Gefecht', lager:'Lager', winter:'Winter',
          befoerderung:'Musterung', elite:'Auswahl', ende:'Ende'}[n.typ] || '';
}

function verlauf(){
  const jetzt = LAUF ? (KAPITEL[Math.min(LAUF.node,KAPITEL.length-1)]||{}).id : null;
  const bloecke = KAMPAGNEN.map(k=>{
    const auf = !!VERLAUF_OFFEN[k.id];
    const st = STATIONEN[k.id] || [];
    const gesehen = st.filter(n=>n.id && META.bestKapitel[n.id]);
    const hier = st.some(n=>n.id===jetzt);
    let inhalt;
    if(!k.gebaut){
      inhalt = `<div class="kmpleer">Noch nicht gebaut. ${esc(k.kurz)}</div>`;
    } else if(!gesehen.length){
      inhalt = '<div class="kmpleer">Du warst noch nirgends. Es fängt in Savona an.</div>';
    } else {
      // Eine Zeile je Station: Ort, Art, wie oft. Das Datum stand früher darunter
      // und machte aus der Liste eine Tabelle — es steht ohnehin im Kartenkopf,
      // sobald man dort ist. Die beiden Stationen in Savona trennt jetzt die Art.
      inhalt = gesehen.map(n=>{
        const b = META.bestKapitel[n.id];
        const ort = (n.datum||'').split(' · ')[1] || n.ort || n.id;
        const art = stationsArt(n);
        return `<div class="kmpst ${n.id===jetzt?'jetzt':''} ${n.typ==='kampf'?'gefecht':''}"
          title="${esc(n.datum||'')}">
          <span class="kmpst-ort">${esc(ort)}</span>
          ${art?`<span class="kmpst-art">${art}</span>`:''}
          ${b.mal>1?`<span class="kmpst-mal">${b.mal}×</span>`:''}</div>`;
      }).join('');
      if(gesehen.length < st.length)
        inhalt += '<div class="kmpleer">Was danach kommt, weißt du nicht.</div>';
    }
    return `<div class="kmp ${auf?'auf':''} ${k.gebaut?'':'ungebaut'}" id="kmp_${k.id}">
      <button class="kmpkopf" onclick="verlaufUm('${k.id}')">
        <span class="kmppfeil">${auf?'▾':'▸'}</span>
        <span class="kmpnr">${k.nr}</span>
        <span class="kmpname">${esc(k.name)}${hier?' <i>· hier</i>':''}</span>
        <span class="kmpjahr">${esc(k.jahre)}</span>
      </button>
      <div class="kmpliste">${inhalt}</div></div>`;
  }).join('');
  return `<aside class="card verlauf"><div class="ch"><span>Der Weg</span><span>11 Feldzüge</span></div>
    <div class="cb">${bloecke}</div></aside>`;
}

/* Auf- und zuklappen ohne Neuaufbau des Bildschirms — sonst müsste jede
   Ansicht wissen, wie sie sich selbst neu zeichnet. */
function verlaufUm(id){
  const e = document.getElementById('kmp_'+id); if(!e) return;
  const auf = e.classList.toggle('auf');
  if(auf) VERLAUF_OFFEN[id]=1; else delete VERLAUF_OFFEN[id];
  const p = e.querySelector('.kmppfeil'); if(p) p.textContent = auf ? '▾' : '▸';
}

/* Ab 35 wird gewarnt, ab 30 kostet es wirklich (+5 Gefahr je Kampfrunde).
   Die Warnung kommt absichtlich fünf Punkte früher als der Malus — sie soll
   zum Schlafen im Lager bewegen, nicht den Schaden bloß melden. */
const ATEM_WARNUNG = 35;
function ausserAtem(){ return S && S.atem <= ATEM_WARNUNG; }

function seitenleiste(){
  const geladen = K ? (K.geladen?'geladen':'ungeladen') : '—';
  const w = S.wunden.length ? S.wunden.map(x=>esc(x.name)).join(', ') : 'keine';
  const zust = k => { const a=S.ausr[k]; const c = a.zustand<20?'warn':(a.zustand<40?'':'ok');
    return `<div class="kv"><span>${esc(a.name)}</span><b class="${a.zustand<20?'warn':''}">${a.zustand}</b></div>`; };
  return `<aside class="card">
    <div class="ch"><span>${K?'Dein Zustand':'Charakterbogen'}</span></div>
    <div class="cb">
      <p class="who">${esc(S.name)}</p>

      <div class="stat"><div class="statlab"><span>Atem</span><span class="${ausserAtem()?'warn':''}">${S.atem}</span></div>
        ${balken(ausserAtem()?'b-red':'b-steel',S.atem,100)}
        ${ausserAtem()?`<p class="warnung">Du bist außer Atem.${S.atem<30?' Unter 30 wird jede Runde im Gefecht gefährlicher — du triffst schlechter und sie treffen dich leichter.':' Unter 30 wird es im Gefecht gefährlich.'}</p>`:''}</div>
      <div class="stat"><div class="statlab"><span>Belastung</span><span>${S.belastung}</span></div>${balken('b-red',S.belastung,100)}</div>
      <div class="stat"><div class="statlab"><span>Ruf</span><span>${S.ruf}</span></div>${balken('b-brass',S.ruf,100)}</div>
      <div class="stat"><div class="statlab"><span>Kameradschaft</span><span>${S.kameradschaft}</span></div>${balken('b-green',S.kameradschaft,100)}</div>
      ${K?`<div class="rule"></div><div class="kv"><span>Muskete</span><b>${geladen}</b></div>
           <div class="kv"><span>Deckung</span><b>${K.deckung?'ja':'nein'}</b></div>`:''}
      <div class="rule"></div>
      <p class="mini">Attribute</p>
      ${ATTRIBUTE.map(([k,n])=>`<div class="kv"><span>${mitHilfe(k,n)}</span><b>${S.attr[k]}</b></div>`).join('')}
      <div class="rule"></div>
      <p class="mini">Fertigkeiten</p>
      ${FERTIGKEITEN.filter(([k])=>S.fert[k]>10).map(([k,n])=>`<div class="kv"><span>${mitHilfe(k,n)}</span><b>${S.fert[k]}</b></div>`).join('') || '<div class="kv"><span>alle bei 10</span><b>—</b></div>'}
      <div class="rule"></div>
      <p class="mini">Ausrüstung · Zustand</p>
      ${Object.keys(S.ausr).filter(k=>S.ausr[k].verschleiss>0).map(zust).join('')}
      <div class="rule"></div>
      <div class="kv"><span>Geld</span><b>${S.geld} F</b></div>
      <div class="kv"><span>Wunden</span><b class="${S.wunden.length?'warn':''}">${w}</b></div>
      <div class="kv"><span>Im Tagesbefehl</span><b>${S.nennungen}×</b></div>
      <div class="kv"><span>Gunst Martel</span><b>${S.gunst}</b></div>
    </div>
  </aside>`;
}

/* ── Titelbildschirm ── */

  <div class="card"><div class="ch"><span>Der Marschallstab</span><span>Prototyp · Italien 1796/97</span></div>
   <div class="cb">
    <div class="zit">Du beginnst 1796 als Rekrut mit einer Muskete, die dir nicht gehört.<br>
    Wenn du dieses Kapitel überlebst, bist du vielleicht Caporal.<br>

    ${offen ? `<div class="wirkung" style="margin-bottom:14px"><span>Unterbrochener Feldzug</span>
      ${esc(offen.mann.name)} · ${esc(rangNameVon(offen.mann))} · ${esc((KAPITEL[Math.min(offen.node,KAPITEL.length-1)].datum||'').split(' · ')[0])}</div>` : ''}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
      ${offen ? '<button class="plain" onclick="fortsetzen()">Feldzug fortsetzen</button>' : ''}
      <button class="plain" onclick="zeigeErschaffung(true)">Neuen Mann aufstellen</button>
      <button class="plain" onclick="speichern()">Spielstand sichern</button>
      <button class="plain" onclick="document.getElementById('ladefeld').click()">Spielstand laden</button>
      <input type="file" id="ladefeld" accept=".json" class="hidden" onchange="laden(event)">
    </div>
    ${offen ? '' : `<p class="mini" style="margin:14px 0 0;color:var(--faint)">${Ablage.dauerhaft
      ? 'Der Feldzug wird selbsttätig gesichert. Wer stirbt, verliert ihn — wer aufhört, kommt zurück.'
      : 'Dieser Browser erlaubt keine selbsttätige Sicherung. Der Spielstand geht nur über die Datei.'}</p>`}
   </div></div>

  <div class="grid2">

/* ── Veteranenpunkte ausgeben ──
   Zwei Arten, sie loszuwerden: Ausrüstung als Ganzes, oder Ausbildung in
   einzelnen Punkten. Die Punkte werden mit jedem Zehnerbereich teurer
   (PRO_PUNKT in grundwerte.js) — von 10 auf 20 kostet 10 VP, von 50 auf 60
   schon 40. Damit kauft man sich einen Vorsprung, aber nie eine Laufbahn:
   Rang, Ruf und Gunst bleiben unkäuflich (Invariante 3). */

let AUSWAHL = [], PUNKTE = {};
const PUNKT_SCHRITT = 5;
function istAttribut(k){ return ATTRIBUTE.some(([a])=>a===k); }

/* Der Preis rechnet vom **tatsächlichen** Wert, nicht vom Sockel: Die Erschaffung
   kommt zuerst, also steht schon fest, was Herkunft und Pool ergeben haben. Wer
   als Wilderer mit Muskete 40 anfängt, zahlt für den nächsten Punkt mehr als
   einer, der bei 10 steht — das ist der Sinn von PRO_PUNKT. */
function istWert(k){
  const h = HERKUENFTE.find(x=>x.id===(ERSCH&&ERSCH.herkunft)) || {attr:{},fert:{}};
  return istAttribut(k)
    ? Math.max(0, Math.min(100, (ERSCH?ERSCH.attr[k]:20) + (h.attr[k]||0)))
    : Math.max(0, Math.min(100, 10 + (h.fert[k]||0)));
}
function punktGrenze(k){ return istAttribut(k) ? 70 : 60; }   // darüber nur noch im Feld
function punktKosten(k){ const b = istWert(k); return kostenVon(b, b + (PUNKTE[k]||0)); }
function gesamtKosten(){
  return AUSWAHL.reduce((s,id)=>s+LADEN.find(p=>p.id===id).vp,0)
       + Object.keys(PUNKTE).reduce((s,k)=>s+punktKosten(k),0);
}

function punktZeile(k,n){
  const p = PUNKTE[k]||0, ist = istWert(k);
  return `<div class="punktzeile ${p?'hi':''}" id="pz_${k}">
    <span>${mitHilfe(k,n)}</span>
    <span class="punktwert" id="pw_${k}">${ist}${p?` <i>→</i> ${ist+p}`:''}</span>
    <span class="punktvp ${p?'':'aus'}" id="pv_${k}">${p?punktKosten(k)+' VP':''}</span>
    <span><button class="pmbtn" onclick="stellePunkt('${k}',-PUNKT_SCHRITT)" id="pm_${k}">−</button>
    <button class="pmbtn" onclick="stellePunkt('${k}',PUNKT_SCHRITT)" id="pa_${k}">+</button></span>
  </div>`;
}

/* Zweiter Schritt der Erschaffung: Was der Vorrat aus dem fertigen Mann macht. */
function zeigeLaden(){
  if(!ERSCH || !ERSCH.herkunft){ zeigeErschaffung(); return; }
  AUSWAHL = []; PUNKTE = {};
  const zeilen = LADEN.map(p=>`<tr id="kz_${p.id}"><td class="k">${p.label}</td><td class="d">${p.beschr}</td>
    <td class="n">${p.vp}</td><td class="n"><button class="plain" style="padding:4px 12px;font-size:13px"
    onclick="waehle('${p.id}')" id="kb_${p.id}">wählen</button></td></tr>`).join('');
  const h = HERKUENFTE.find(x=>x.id===ERSCH.herkunft);
  app.innerHTML = `
  <div class="card"><div class="ch"><span>Zweiter Schritt · Veteranenpunkte</span><span id="vpanz">${META.vp} verfügbar</span></div>
   <div class="cb">
    <div class="note"><b>${esc(ERSCH.name)}</b>, ${esc(h.name)}. Die Werte unten sind die, mit denen er einrücken würde.
    Der Vorrat ist die Punktzahl deines besten Laufs; er wird nicht verbraucht, sondern bei jedem Neustart neu verteilt.
    ${META.vp===0?'<br><br><b>Beim ersten Mal hast du nichts.</b> Das gehört dazu — der erste Mann rückt ein, wie er ist.':''}</div>
   </div></div>

  <div class="card"><div class="ch"><span>Attribute ergänzen</span><span>je ${PUNKT_SCHRITT} Punkte · höchstens 70</span></div>
   <div class="cb">
    <p class="hinweis">Gerechnet wird vom jetzigen Wert. Der erste Zehner kostet 1 VP je Punkt, der fünfte schon 4 — wer schon hoch steht, zahlt für jeden weiteren Punkt mehr.</p>
    ${ATTRIBUTE.map(([k,n])=>punktZeile(k,n)).join('')}
   </div></div>

  <div class="card"><div class="ch"><span>Fertigkeiten ergänzen</span><span>je ${PUNKT_SCHRITT} Punkte · höchstens 60</span></div>
   <div class="cb">
    <p class="hinweis">Alle beginnen bei 10, sofern die Herkunft nichts anderes mitgebracht hat. Was darüber hinausgeht, musst du dir im Feld verdienen.</p>
    ${FERTIGKEITEN.map(([k,n])=>punktZeile(k,n)).join('')}
   </div></div>

  <div class="card"><div class="ch"><span>Ausrüstung</span><span>fertige Stücke statt einzelner Punkte</span></div>
   <div class="cb">
    <table><tr><th>Kauf</th><th>Wirkung</th><th class="n">VP</th><th class="n"></th></tr>${zeilen}</table>
    <div style="margin-top:18px;display:flex;gap:10px">
      <button class="plain" id="startbtn" onclick="starte()">Einrücken</button>
      <button class="plain" onclick="zeigeErschaffung()">Zurück zur Erschaffung</button></div>
   </div></div>`;
  aktualisiereLaden();
}
function waehle(id){
  const i = AUSWAHL.indexOf(id);
  if(i>=0) AUSWAHL.splice(i,1);
  else { AUSWAHL.push(id); if(gesamtKosten() > META.vp) AUSWAHL.pop(); }
  aktualisiereLaden();
}
function stellePunkt(k,d){
  const alt = PUNKTE[k]||0, neu = alt + d;
  if(neu < 0 || istWert(k)+neu > punktGrenze(k)) return;
  PUNKTE[k] = neu;
  if(gesamtKosten() > META.vp){ PUNKTE[k] = alt; }     // der Vorrat ist die Grenze
  if(!PUNKTE[k]) delete PUNKTE[k];
  aktualisiereLaden();
}
function aktualisiereLaden(){
  const rest = META.vp - gesamtKosten();
  document.getElementById('vpanz').textContent = `${rest} von ${META.vp} übrig`;
  LADEN.forEach(p=>{
    const b = document.getElementById('kb_'+p.id), z = document.getElementById('kz_'+p.id);
    const drin = AUSWAHL.includes(p.id);
    b.textContent = drin?'gewählt':'wählen';
    b.disabled = !drin && p.vp>rest;
    z.className = drin?'hi':'';
  });
  ATTRIBUTE.concat(FERTIGKEITEN).forEach(([k])=>{
    const p = PUNKTE[k]||0, b = istWert(k);
    const pw = document.getElementById('pw_'+k), pv = document.getElementById('pv_'+k);
    pw.innerHTML = p ? `${b} <i>→</i> ${b+p}` : String(b);
    pv.textContent = p?punktKosten(k)+' VP':''; pv.className = 'punktvp'+(p?'':' aus');
    document.getElementById('pz_'+k).className = 'punktzeile'+(p?' hi':'');
    document.getElementById('pm_'+k).disabled = !p;
    document.getElementById('pa_'+k).disabled =
      b+p+PUNKT_SCHRITT > punktGrenze(k) || kostenVon(b+p, b+p+PUNKT_SCHRITT) > rest;
  });
}

/* ── Charaktererschaffung ── */
const POOL = 120, SOCKEL = 20, MAXE = 70;
let ERSCH = null;
function zeigeErschaffung(neu){
  if(neu || !ERSCH){
    ERSCH = {name:'', herkunft:null, attr:{}};
    ATTRIBUTE.forEach(([k])=> ERSCH.attr[k]=SOCKEL);
  }
  const zeilen = ATTRIBUTE.map(([k,n])=>`
    <div class="attrrow">
      <span class="attrname">${mitHilfe(k,n)}${k==='bildung'?' <span style="color:var(--faint);font-size:11px">(fest)</span>':''}</span>
      ${balken('b-brass',ERSCH.attr[k],100).replace('class="bar','id="ab_'+k+'" class="bar')}
      <span class="attrval" id="av_${k}">${ERSCH.attr[k]}</span>
      <span><button class="pmbtn" onclick="stelle('${k}',-10)" id="am_${k}">−</button>
      <button class="pmbtn" onclick="stelle('${k}',10)" id="ap_${k}">+</button></span>
    </div>`).join('');
  app.innerHTML = `
  <div class="stage">${verlauf()}
    <div>
      <div class="card"><div class="ch"><span>Erster Schritt · Wer bist du</span></div><div class="cb">
        <input type="text" id="namefeld" placeholder="Name des Rekruten" value="${esc(ERSCH.name||zufallsName())}" oninput="ERSCH.name=this.value">
      </div></div>
      <div class="card"><div class="ch"><span>Attribute</span><span id="poolanz">${POOL} Punkte zu verteilen</span></div>
        <div class="cb">${zeilen}
        <p style="color:var(--faint);font-size:12.5px;margin-top:12px">Sockel 20 · höchstens 70 bei der Erschaffung · Bildung ist vom Pool ausgenommen.
        Alle neun Fertigkeiten beginnen bei 10.</p>
        <div style="margin-top:12px"><button class="plain" onclick="wuerfeln()">Auswürfeln</button></div>
      </div></div>
    </div>
    <div class="card"><div class="ch"><span>Herkunft</span><span>je genau 50 Punkte</span></div><div class="cb">
      <div class="herkwahl">${HERKUENFTE.map(h=>`<div class="herk${h.id===ERSCH.herkunft?' on':''}" id="h_${h.id}" onclick="waehleHerkunft('${h.id}')">
        <div class="hn">${h.name}</div><div class="hd">${h.text}</div></div>`).join('')}</div>
      <div style="margin-top:16px"><button class="plain" id="weiterbtn" onclick="zeigeLaden()" disabled>Weiter zu den Veteranenpunkten</button>
      <p class="hinweis" style="margin-top:10px">Danach kannst du auf diese Werte noch Veteranenpunkte legen.</p></div>
    </div></div>
  </div>`;
  ERSCH.name = document.getElementById('namefeld').value;
  aktualisiereErschaffung();
}
function zufallsName(){
  const v=['Étienne','Jean-Baptiste','Pierre','Antoine','Louis','Nicolas','Claude','Michel','François','Gilbert'];
  const n=['Duval','Rey','Vasseur','Marchand','Ferrand','Bonnet','Lemoine','Charpentier','Roussel','Barbier'];
  return v[Math.floor(Math.random()*v.length)]+' '+n[Math.floor(Math.random()*n.length)];
}
function verteilt(){ return ATTRIBUTE.reduce((s,[k])=>s+(ERSCH.attr[k]-SOCKEL),0); }
function stelle(k,d){
  if(k==='bildung') return;
  const neu = ERSCH.attr[k]+d;
  if(neu<SOCKEL || neu>MAXE) return;
  if(d>0 && verteilt()+d>POOL) return;
  ERSCH.attr[k]=neu; aktualisiereErschaffung();
}
function wuerfeln(){
  ATTRIBUTE.forEach(([k])=> ERSCH.attr[k]=SOCKEL);
  const frei = ATTRIBUTE.map(([k])=>k).filter(k=>k!=='bildung');
  let rest = POOL;
  const gew = frei.map(()=>Math.random()+0.35);
  while(rest>0){
    const i = gew.map((g,i)=>[g*Math.random(),i]).sort((a,b)=>b[0]-a[0])[0][1];
    const k = frei[i];
    if(ERSCH.attr[k]+10<=MAXE){ ERSCH.attr[k]+=10; rest-=10; }
    else { gew[i]=0; if(gew.every(g=>g===0)) break; }
  }
  aktualisiereErschaffung();
}
function waehleHerkunft(id){
  ERSCH.herkunft=id;
  HERKUENFTE.forEach(h=> document.getElementById('h_'+h.id).className = 'herk'+(h.id===id?' on':''));
  aktualisiereErschaffung();
}
function aktualisiereErschaffung(){
  const v = verteilt();
  document.getElementById('poolanz').textContent = `${POOL-v} von ${POOL} übrig`;
  ATTRIBUTE.forEach(([k])=>{
    document.getElementById('av_'+k).textContent = ERSCH.attr[k];
    const b = document.getElementById('ab_'+k); if(b) b.querySelector('i').style.width = ERSCH.attr[k]+'%';
    document.getElementById('am_'+k).disabled = (k==='bildung')||ERSCH.attr[k]<=SOCKEL;
    document.getElementById('ap_'+k).disabled = (k==='bildung')||ERSCH.attr[k]>=MAXE||v+10>POOL;
  });
  const b = document.getElementById('weiterbtn');
  if(b) b.disabled = !(ERSCH.herkunft && v===POOL && ERSCH.name.trim().length>0);
}
function starte(){
  laufVerwerfen();       // ein Platz, kein zweiter — der alte Feldzug ist damit vorbei
  neuerLauf(neuerCharakter(ERSCH.name.trim(), ERSCH.herkunft, ERSCH.attr, AUSWAHL, PUNKTE));
  naechster();
}

/* Fortsetzen ist kein Zurückspulen: Der Spielstand zeigt immer auf den letzten
   Schritt, nicht auf den letzten Halt. */
function fortsetzen(){
  const d = laufVorhanden();
  if(!d){ zeigeTitel(); return; }
  LAUF = d; binde(); naechster();
}

/* ══════════════════ ABLAUF ══════════════════ */

function naechster(){
  if(!S.lebt){ zeigeTod(); return; }
  if(LAUF.node >= KAPITEL.length){ zeigeKapitelende(); return; }
  const n = KAPITEL[LAUF.node];
  if(n.datum && n.id && LAUF.gezaehlt !== n.id){
    LAUF.gezaehlt = n.id;                 // beim Fortsetzen nicht doppelt zählen
    const b = META.bestKapitel[n.id] || {mal:0,rang:''};
    b.mal++; if(!b.rang || S.rang>=RANG.findIndex(r=>r.name===b.rang)+1) b.rang = rangName(S.rang);
    META.bestKapitel[n.id]=b;
    chronikSichern();
  }
  laufSichern();
  kopfzeile();
  if(n.typ==='szene') zeigeSzene(n);
  else if(n.typ==='lager') zeigeLager(n);
  else if(n.typ==='kampf'){ if(K) zeigeKampf('Das Gefecht geht weiter, wo du es verlassen hast.'); else starteKampf(n); }
  else if(n.typ==='befoerderung') zeigeBefoerderung(n);
  else if(n.typ==='elite') zeigeElite(n);
  else if(n.typ==='winter') zeigeWinter(n);
  else if(n.typ==='ende') zeigeKapitelende();
}

/* ── Szene ── */
function zeigeSzene(n){
  const opt = n.optionen.map((o,i)=>{
    const gesperrt = o.probe && wert(o.probe.wert)<5;
    return `<button class="ord ${o.risk?'risk':''}" onclick="waehleOption(${i})" ${gesperrt?'disabled':''}>
      ${esc(o.label)}<span class="cost">${esc(o.kosten||o.hint||'')}${o.probe?' · '+NAMEN[o.probe.wert]+' '+wert(o.probe.wert)+' gegen '+o.probe.schw:''}</span></button>`;
  }).join('');
  app.innerHTML = `<div class="stage">${verlauf()}
    <div>${wegband(n)}<div class="card"><div class="ch"><span>${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
      <div class="cb"><div class="prose">${n.text.map(t=>`<p>${t}</p>`).join('')}</div></div></div>
      <div class="orders"><div class="ch"><span>Was tust du?</span></div><div class="ordbody">${opt}</div></div>
    </div>${seitenleiste()}</div>`;
  LAUF.szene = n.id;
}
function waehleOption(i){
  const n = KAPITEL[LAUF.node], o = n.optionen[i];
  let erg, klasse='', probeText='';
  if(o.probe){
    const p = probe(o.probe.wert, o.probe.schw);
    erg = p.erfolg ? o.erfolg : (o.misserfolg||o.erfolg);
    klasse = p.erfolg ? 'gut' : 'schlecht';
    // Nur das Ergebnis, nicht die Rechnung: Wert und Schwierigkeit stehen schon
    // vor der Wahl auf dem Knopf, und Zielwert und Wurf sagen hinterher nichts mehr.
    probeText = `<div class="pruefung ${klasse}">${NAMEN[o.probe.wert]} — ${p.erfolg?'gelungen':'misslungen'}</div>`;
  } else { erg = o.erfolg; klasse='gut'; }
  anwenden(erg);
  verschleiss(0.35);
  S.log.push(n.id+': '+o.label);
  stationErledigt();
  app.innerHTML = `<div class="stage">${verlauf()}
    <div><div class="card"><div class="ch"><span>${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
      <div class="cb"><div class="prose"><p class="said">${esc(o.label)}</p></div>
        <div class="ergebnis ${klasse}">${erg.text}${probeText}</div>
        ${wirkungen(erg)}</div></div>
      <div class="orders"><div class="ordbody"><button class="ord weiter" onclick="naechster()">Weiter</button></div></div>
    </div>${seitenleiste()}</div>`;
  kopfzeile();
}
function wirkungen(e){
  const t=[];
  const m = {ruf:'Ruf',gunst:'Gunst',kameradschaft:'Kameradschaft',belastung:'Belastung',atem:'Atem',geld:'Francs'};
  for(const k in m) if(e[k]) t.push(`${m[k]} ${e[k]>0?'+':''}${e[k]}`);
  if(e.attr) for(const k in e.attr) t.push(`${NAMEN[k]} ${e.attr[k]>0?'+':''}${e.attr[k]}`);
  if(e.fert) for(const k in e.fert) if(e.fert[k]) t.push(`${NAMEN[k]} ${e.fert[k]>0?'+':''}${e.fert[k]}`);
  if(e.ausr) for(const k in e.ausr) t.push(`${S.ausr[k].name} ${e.ausr[k]>0?'+':''}${e.ausr[k]}`);
  if(e.wunde) t.push('Wunde: '+e.wunde);
  if(e.nennung) t.push('Im Tagesbefehl genannt');
  return t.length ? `<div class="wirkung"><span>Wirkung</span>${t.join(' · ')}</div>` : '';
}


'use strict';
/* Gefecht, Elitekompanie und Beförderung. */

/* ══════════════════ KAMPF ══════════════════ */

function aktionen(){
  const a = [];
  const zw = S.zweig;
  a.push({id:'laden',label:'Laden',cost:'Geschick · Atem −8',aus:()=>K.geladen});
  if(zw==='voltigeur'){
    a.push({id:'zielen',label:'Sorgfältig zielen und feuern',cost:'Muskete +15 · kostet zwei Atemzüge',aus:()=>!K.geladen});
    a.push({id:'feuern',label:'Schnell feuern',cost:'Muskete',aus:()=>!K.geladen});
    a.push({id:'deckung',label:'Deckung wechseln',cost:'Geschick · du bist schwer zu treffen'});
  } else {
    a.push({id:'feuern',label:'Anlegen und feuern',cost:'Muskete',aus:()=>!K.geladen});
    a.push({id:'ducken',label:'Hinwerfen',cost:'Atem +10 · Belastung −2 · du schießt nicht, aber sie treffen dich auch nicht'});
    a.push({id:'halten',label:'Stehenbleiben und die Linie halten',cost:'Kaltblütigkeit'});
  }
  a.push({id:'bajonett',label:zw==='grenadier'?'Bajonett fällen und vorgehen':'Mit dem Bajonett vor',
    cost:(zw==='grenadier'?'Bajonett +10 · ':'Bajonett · ')+'sehr gefährlich',risk:true});
  if(S.rang>=3){
    a.push({id:'salve',label:'Der Korporalschaft Salve befehlen',cost:'Autorität · acht Mann feuern zugleich'});
    a.push({id:'luecke',label:'Die Lücke links schließen lassen',cost:'Drill · schützt deine Männer'});
  }
  a.push({id:'zurueck',label:'Zurückweichen',cost:'Ruf −− · der Kampf ist für dich vorbei',risk:true});
  return a;
}

/* ── Anmarsch: der Weg dorthin, die Lage, das Warten ──
   Zwischen zwei Gefechten liegen Wochen und hunderte Kilometer. Wer direkt aus
   der Szene in die erste Runde fällt, merkt davon nichts. Der Anmarsch kostet
   deshalb auch etwas: Marsch nutzt Schuhe ab und geht auf den Atem. */

function starteKampf(n){
  if(n.anmarsch && !S.anmarschGesehen){
    S.anmarschGesehen = n.id;
    verschleiss(0.15);
    S.atem = Math.max(0, S.atem-4);
    S.belastung = Math.min(100, S.belastung+1);
    laufSichern();
    zeigeAnmarsch(n);
    return;
  }
  S.anmarschGesehen = null;
  setzeKampf({runde:1, geladen:true, deckung:false, feindMoral:n.feindMoral,
              protokoll:['Das Gefecht beginnt.'], zielt:false, verluste:0});
  laufSichern();
  zeigeKampf(n.intro);
}

/* Was du über dich selbst weißt, bevor es losgeht. Keine Zahlen, die in der
   Seitenleiste schon stehen — sondern was sie bedeuten. */
function gefechtsbereitschaft(){
  const z = [], m = S.ausr.muskete.zustand, sch = S.ausr.schuhe.zustand;
  if(m<35) z.push('Das Schloss ist braun vom Rost. Ob die Muskete zündet, wird sich zeigen, wenn es darauf ankommt.');
  else if(m<60) z.push('Die Muskete ist gebraucht, aber trocken. Sie hat bisher gezündet.');
  else z.push('Die Muskete ist sauber und geölt. In dieser Armee ist das keine Selbstverständlichkeit.');
  if(sch<25) z.push('Von deinen Schuhen ist wenig übrig. Du hast seit dem Aufbruch nasse Füße und spürst jeden Stein.');
  else if(sch<50) z.push('Die Schuhe halten. Noch.');
  if(S.wunden.length) z.push('Du trägst ' + (S.wunden.length===1?'eine alte Wunde':S.wunden.length+' alte Wunden') +
    ' mit dir: ' + S.wunden.map(w=>esc(w.name)).join(', ') + '.');
  if(ausserAtem()) z.push(S.atem<30
    ? 'Du bist ausgepumpt, bevor der erste Schuss fällt. Unter 30 Atem trifft dich mehr, als dich treffen müsste — das hier wird teuer.'
    : 'Dir geht die Luft aus, bevor es losgeht. Unter 30 wird jede Runde gefährlicher.');
  if(S.belastung>60) z.push('Deine Hände sind nicht ruhig. Du hältst sie an den Riemen, damit es niemand sieht.');
  if(S.kameradschaft>=50) z.push('Links und rechts stehen Männer, die deinen Namen kennen. Das ist keine Kleinigkeit.');
  if(S.rang>=3) z.push('Acht Mann sehen dich an und warten darauf, dass du etwas sagst.');
  else if(S.zweig==='voltigeur') z.push('Du gehst vor der Linie. Wenn es losgeht, steht neben dir niemand.');
  else if(S.zweig==='grenadier') z.push('Die Grenadierkompanie steht vorne. Das ist der Sinn der Bärenfellmütze.');
  return z;
}

    .filter(([,v])=>v).map(([k,v])=>`<tr><td class="k">${k}</td><td class="d">${esc(v)}</td></tr>`).join('');
  app.innerHTML = `<div class="stage">${verlauf()}
    <div>${wegband(n)}
      <div class="card"><div class="ch"><span>Anmarsch · ${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
        <div class="cb">
          <div class="prose">${n.anmarsch.map(t=>`<p>${t}</p>`).join('')}</div>
          ${zeilen?`<div class="lage"><div class="lagekopf">Was man weiß</div>
            <table>${zeilen}</table></div>`:''}
          <div class="lage"><div class="lagekopf">Womit du dastehst</div>

  kopfzeile();
}

function zeigeKampf(text){
  const n = KAPITEL[LAUF.node];
  const opt = aktionen().map(a=>`<button class="ord ${a.risk?'risk':''}" onclick="kampfAktion('${a.id}')"
      ${a.aus&&a.aus()?'disabled':''}>${a.label}<span class="cost">${a.cost}</span></button>`).join('');
  app.innerHTML = `<div class="stage">${verlauf()}
    <div><div class="card"><div class="ch"><span>Sichtfeld</span><span>${esc(n.datum)}</span></div>
      <div class="cb">${sichtfeld()}
        <div class="prose" style="margin-top:15px"><p>${text}</p></div>
        ${ausserAtem()?`<p class="warnung">Du bekommst keine Luft mehr. ${S.atem<30?'Jeder Handgriff dauert zu lange, und du bist ein leichteres Ziel.':'Noch geht es — aber nicht mehr lange.'} <b>Atem ${S.atem}</b> · Hinwerfen bringt +10.</p>`:''}
        <div class="probe" style="margin-top:12px">RUNDE ${K.runde} VON ${n.runden} · WIDERSTAND DES FEINDES ${Math.max(0,Math.round(K.feindMoral))}</div>
        ${balken('b-red',Math.max(0,K.feindMoral),n.feindMoral)}
        <div class="log" style="margin-top:14px">${K.protokoll.slice(-5).reverse().map(z=>`<div>${z}</div>`).join('')}</div>
      </div></div>
      <div class="orders"><div class="ch"><span>Was tust du?</span></div><div class="ordbody">${opt}</div></div>
    </div>${seitenleiste()}</div>`;
}

function kampfAktion(id){
  const n = KAPITEL[LAUF.node]; let text = '', schaden = 0, gefahrMod = 0;
  const zw = S.zweig;

  if(id==='laden'){
    const p = probe('geschick', 30);
    S.atem = Math.max(0,S.atem-8);
    if(p.erfolg){ K.geladen=true; text='Patrone auf, Pulver, Kugel, Ladestock. Die Muskete ist geladen.'; }
    else { text='Die Patrone rutscht dir durch die Finger. Du musst eine neue nehmen.'; S.atem=Math.max(0,S.atem-4); }
  }
  else if(id==='feuern' || id==='zielen'){
    const sorgfalt = (id==='zielen');
    const p = probe('muskete', sorgfalt? 20 : 35);
    K.geladen = false;
    S.atem = Math.max(0, S.atem - (sorgfalt?10:5));
    if(p.erfolg){ schaden = sorgfalt? 22+Math.random()*10 : 12+Math.random()*8;
      text = sorgfalt? 'Du liegst still, atmest aus und drückst ab. Drüben fällt einer, und du weißt, dass er dir gehört.'
                     : 'Du feuerst in den Rauch. Irgendetwas drüben gerät in Unordnung.'; }
    else { text = S.ausr.muskete.zustand<35 ? 'Das Schloss klickt und nichts geschieht. Die Waffe ist verrostet.'
                                            : 'Der Schuss geht zu hoch. In diesem Rauch trifft man mehr durch Zufall als durch Können.'; }
    if(S.ausr.muskete.verschleiss) S.ausr.muskete.zustand = Math.max(0,S.ausr.muskete.zustand-2);
  }
  else if(id==='ducken'){
    K.deckung=true; S.atem=Math.min(100,S.atem+10); S.belastung=Math.max(0,S.belastung-2);
    text='Du wirfst dich hin. Über dir geht es hinweg. Man kann nicht ewig liegen bleiben, aber jetzt gerade schon.';
    gefahrMod = -22;
  }
  else if(id==='deckung'){
    const p = probe('geschick', 35);
    if(p.erfolg){ K.deckung=true; gefahrMod=-20; text='Drei Sprünge nach links, hinter einen Weidenstumpf. Wer dort hinschießt, wo du warst, trifft nichts.'; }
    else { text='Du bleibst auf halbem Weg im Freien hängen und musst dich flach machen, wo keine Deckung ist.'; gefahrMod=+10; }
  }
  else if(id==='halten'){
    const p = probe('kaltbluetigkeit', 40);
    K.deckung=false;
    if(p.erfolg){ schaden = 6; S.belastung=Math.max(0,S.belastung-3);
      text='Du bleibst stehen. Links und rechts bleiben sie auch stehen, weil du stehst. Die Linie hält.'; nutzen('drill',1); }
    else { S.belastung=Math.min(100,S.belastung+6);
      text='Du stehst, aber deine Hände zittern so, dass du nichts damit anfangen kannst.'; }
  }
  else if(id==='bajonett'){
    const p = probe('bajonett', zw==='grenadier'?30:45);
    K.deckung=false; S.atem=Math.max(0,S.atem-18); gefahrMod = +26;
    if(p.erfolg){ schaden = 30+Math.random()*14;
      text='Du gehst vor. Es ist laut und kurz und danach stehst du zehn Schritt weiter als vorher.'; S.ruf+=2; }
    else { text='Du gehst vor, aber niemand geht mit. Nach fünf Schritten stehst du allein und kehrst um.'; S.belastung+=7; }
  }
  else if(id==='salve'){
    const p = probe('autoritaet', 40);
    if(p.erfolg){ schaden = 26+Math.random()*10; nutzen('drill',1);
      text='„Anlegen — Feuer!" Acht Musketen gehen fast gleichzeitig los. Fast. Aber es reicht.'; }
    else { text='Du rufst den Befehl, und drei von acht hören ihn. Das Ergebnis ist ein trauriges Geknatter.'; schaden=6; }
  }
  else if(id==='luecke'){
    const p = probe('drill', 35);
    if(p.erfolg){ gefahrMod=-14; S.kameradschaft=Math.min(100,S.kameradschaft+4);
      text='Du schiebst die Männer zusammen, bis kein Loch mehr in der Linie ist. Deine acht wissen jetzt, wozu du gut bist.'; }
    else { text='Sie rücken auf, aber zu langsam, und die Lücke bleibt.'; }
  }
  else if(id==='zurueck'){
    S.ruf = Math.max(0, S.ruf-8); S.belastung=Math.min(100,S.belastung+10); S.gekniffen=true;
    kampfEnde(false, 'Du gehst zurück. Niemand hält dich auf, und das ist das Schlimmste daran.');
    return;
  }

  // Die Linie kämpft auch ohne dich
  const linie = 2 + Math.random()*4;
  K.feindMoral -= schaden + linie;
  K.protokoll.push(text);

  // Feindliche Wirkung
  let gefahr = n.gefahr + gefahrMod;
  if(K.deckung && id!=='ducken' && id!=='deckung') K.deckung=false;
  if(S.belastung>60) gefahr += 6;
  if(S.atem<30) gefahr += 5;
  gefahr = Math.max(4, gefahr);
  let treffer = '';
  if(Math.random()*100 < gefahr){
    const schwere = Math.random()*100 - (wert('konstitution')-40)/3;
    if(schwere > 94){
      kampfEnde(false, text + ' — Dann trifft dich etwas in die Brust, und du siehst noch, wie der Himmel kippt.');
      toetlich('Gefallen bei '+n.datum.split(' · ')[1]);
      zeigeTod(); return;
    } else if(schwere > 72){
      wundeGeben('Schwere Wunde ('+n.datum.split(' · ')[1]+')', 14);
      treffer = ' Ein Schlag gegen die Schulter, dann Nässe im Ärmel. Du kannst den Arm noch bewegen, aber es tut sehr weh.';
      S.atem = Math.max(0,S.atem-20);
    } else {
      wundeGeben('Streifschuss', 5);
      treffer = ' Etwas reißt dir den Ärmel auf und brennt. Nicht schlimm. Noch nicht.';
      S.atem = Math.max(0,S.atem-8);
    }
    K.protokoll.push('Du wirst getroffen.');
  }
  if(S.wunden.length>=5){
    kampfEnde(false, text+treffer);
    toetlich('Verblutet bei '+n.datum.split(' · ')[1]); zeigeTod(); return;
  }

  if(K.feindMoral <= 0){ kampfEnde(true, text+treffer); return; }
  K.runde++;
  if(K.runde > n.runden){
    const knapp = K.feindMoral < n.feindMoral*0.35;
    kampfEnde(knapp, text+treffer+(knapp?' Und dann ist es plötzlich vorbei.':' Es wird dunkel, und nichts ist entschieden.'));
    return;
  }
  laufSichern();
  zeigeKampf(text + treffer);
}

function kampfEnde(sieg, letzterText){
  const n = KAPITEL[LAUF.node];
  const erg = sieg ? n.sieg : n.niederlage;
  anwenden(erg);
  verschleiss(0.9);
  // Der Feldscher flickt nach dem Gefecht die leichteste Wunde
  const leicht = S.wunden.findIndex(w=>w.abzug<=5);
  if(leicht>=0) S.wunden.splice(leicht,1);
  if(sieg && n.ruhm && S.ruf>=20 && Math.random()<0.6){ S.nennungen++; }
  const kk = K; setzeKampf(null);
  stationErledigt();
  app.innerHTML = `<div class="stage">${verlauf()}
    <div><div class="card"><div class="ch"><span>${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
      <div class="cb"><div class="prose"><p>${letzterText}</p></div>
        <div class="ergebnis ${sieg?'gut':'schlecht'}">${erg.text}</div>${wirkungen(erg)}
        <div class="probe" style="margin-top:10px">${sieg?'GEFECHT BESTANDEN':'GEFECHT VERLOREN'} · ${kk.runde} RUNDEN</div>
      </div></div>
      <div class="orders"><div class="ordbody"><button class="ord weiter" onclick="naechster()">Weiter</button></div></div>
    </div>${seitenleiste()}</div>`;
  kopfzeile();
}

      : 'Der Adjutant lässt dich dreißig Schritt laufen und wieder zurück, dann nickt er. Ab morgen gehst du vor der Linie, allein oder zu zweit, und schießt auf das, was du siehst — nicht auf das, wohin alle schießen.';

/* ══════════════════ BEFÖRDERUNG ══════════════════ */

/* Schwelle zum Caporal. Beides zusammen, und dazu die Vakanz — siehe CLAUDE.md.
   Wer diese Zahlen ändert, trägt sie dort nach. */
const CAPORAL_RUF = 30, CAPORAL_GUNST = 4;

function zeigeBefoerderung(n){
  if(S.befoerderungGeprueft===undefined){ S.befoerderungRuf=S.ruf; S.befoerderungGunst=S.gunst; S.befoerderungGeprueft=true; }
  const ruf = S.befoerderungRuf, gunst = S.befoerderungGunst;
  const reichtRuf = ruf>=CAPORAL_RUF, reichtGunst = gunst>=CAPORAL_GUNST;
  const bekommt = reichtRuf && reichtGunst;
  let text, klasse;
  if(bekommt){
    S.rang = Math.max(S.rang,3);
    S.ruf += 5;
    text = `Martel — inzwischen Sergent-major — nennt deinen Namen, und der Capitaine schreibt ihn auf. Es gibt keine Zeremonie. Du bekommst zwei Wollstreifen an den Ärmel, acht Mann und die Verantwortung dafür, dass diese acht Mann morgens da sind, Schuhe haben und ihre Musketen zünden.
    <br><br>Der Mann, dessen Stelle du bekommst, heißt Guérin. Er ist bei Castiglione geblieben.`;
    klasse='gut';
  } else if(!reichtRuf){
    text = `Zwei Stellen werden besetzt. Keine mit dir. Der Capitaine kennt deinen Namen nicht, und das ist die ganze Erklärung.
    <br><br><em>Für den Caporal braucht es Ruf ${CAPORAL_RUF} — du hast ${ruf}.</em>`;
    klasse='schlecht';
  } else {
    text = `Dein Name fällt. Er fällt sogar zweimal. Aber niemand am Tisch legt die Hand für dich auf den Tisch, und ohne das geht es nicht.
    <br><br><em>Für den Caporal braucht es einen Fürsprecher — Gunst ${CAPORAL_GUNST}, du hast ${gunst}. Fürsprache sammelt sich in Abenden am Feuer, nicht in einer einzigen Tat.</em>`;
    klasse='schlecht';
  }
  stationErledigt();     // die Entscheidung ist gefallen, bevor der Knopf kommt
  app.innerHTML = `<div class="stage">${verlauf()}<div>${wegband(n)}
    <div class="card"><div class="ch"><span>${esc(n.ort)}</span><span>${esc(n.datum)}</span></div>
      <div class="cb"><div class="prose">${(n.text||[]).map(t=>`<p>${t}</p>`).join('')}</div>
      <div class="ergebnis ${klasse}">${text}</div>
      <div class="probe" style="margin-top:10px">VAKANZ VORHANDEN · RUF ${ruf}/${CAPORAL_RUF} · FÜRSPRACHE ${gunst}/${CAPORAL_GUNST} · ${bekommt?'BEFÖRDERT':'ÜBERGANGEN'}</div>
      </div></div>
    <div class="orders"><div class="ordbody"><button class="ord weiter" onclick="naechster()">Weiter</button></div></div>
    </div>${seitenleiste()}</div>`;
  kopfzeile();
}


'use strict';
/* Lager, Winterquartier, Punktwertung, Tod, Kapitelende, Spielstand. */

/* ══════════════════ LAGER ══════════════════ */

/* Ein Lager ist die kleine Fassung des Winterquartiers: zwei bis drei Abende,
   und immer mehr zu tun, als Zeit da ist. Ausbildung und Instandhaltung
   konkurrieren miteinander — das ist der ganze Entwurf. Was hier nicht getan
   wird, fehlt im nächsten Gefecht.

   Die Handlungen stehen hier, die Auswahl je Lager in den Kapiteldaten (tun:[…]).
   Handlungen für Rang und Zweig kommen selbsttätig dazu — ein höherer Rang gibt
   auch im Lager neue Knöpfe, nicht größere Zahlen. */

const LAGER_TUN = {

    cost:'Muskete und Drill · Atem −6',
    tu(){ nutzen('muskete',2); nutzen('drill',2);
      S.atem=Math.max(0,S.atem-6); S.belastung=Math.min(100,S.belastung+2);
      return 'Laden in zwölf Zeiten, achtzig Mal hintereinander, bis die Hände es ohne den Kopf können. Ein Caporal zählt laut mit, und wer nachhängt, fängt von vorn an. <span class="fein">Muskete und Drill steigen · Atem −6</span>'; }},

  bajonett:{label:'Bajonettfechten gegen einen Strohmann',
    cost:'Bajonett · Atem −8',
    tu(){ nutzen('bajonett',2.5);
      S.atem=Math.max(0,S.atem-8); S.belastung=Math.min(100,S.belastung+2);
      return 'Ein Sack Stroh an einem Pfahl, zweihundert Stöße. Der Sergent sagt, du sollst nicht stechen wie einer, der jemanden verletzen will, sondern wie einer, der weitergehen will. <span class="fein">Bajonett steigt · Atem −8</span>'; }},

  scharf:{label:'Scharf schießen, mit gekauftem Pulver',
    cost:'Muskete ++ · kostet 4 Francs',

      S.geld-=4; nutzen('muskete',3.5);
      S.ausr.muskete.zustand = Math.max(0, S.ausr.muskete.zustand-5);
      return 'Zwölf scharfe Schüsse auf eine Scheibe aus Brettern, achtzig Schritt. Beim Bataillon sind drei Schuss im Jahr vorgesehen; den Rest muss man sich selbst kaufen. Beim neunten triffst du zum ersten Mal, weil du es willst, und nicht, weil es sich ergeben hat. <span class="fein">Muskete steigt deutlich · −4 F · Waffe −5</span>'; }},

  instand:{label:'Ausrüstung durchsehen und flicken',
    cost:'Geschick · alles ein Stück besser',
    tu(){ const p = probe('geschick',30);
      const plus = p.erfolg ? 20 : 8;
      for(const k in S.ausr) if(S.ausr[k].verschleiss) S.ausr[k].zustand = Math.min(100, S.ausr[k].zustand+plus);
      return (p.erfolg
        ? 'Riemen nachgenäht, Sohlen mit Draht gefasst, das Schloss zerlegt und ausgewischt. Du bist der Letzte am Feuer und der Einzige, dessen Zeug morgen noch hält.'
        : 'Du machst, was du kannst, und was du kannst, ist nicht viel. Der Riemen hält bis übermorgen, mehr nicht.')

    cost:'Schuhe ++ · kostet 6 Francs',
    tu(){ if(S.geld<6) return 'Der Schuster hält die Hand auf, bevor er die Schuhe nimmt. Sechs Francs. Du hast sie nicht und gehst mit denselben Sohlen wieder hinaus. <span class="fein">nichts passiert</span>';
      S.geld-=6; S.ausr.schuhe.zustand = Math.min(100, S.ausr.schuhe.zustand+45);
      return 'Er sieht sie sich an, sagt etwas auf Italienisch, das nicht freundlich klingt, und näht trotzdem. Neue Sohlen, doppelt genagelt, und ein Stück Leder über der linken Ferse. <span class="fein">Schuhe +45 · −6 F</span>'; }},

  waffe:{label:'Die Muskete zerlegen und ölen',
    cost:'Waffenzustand ++',
    tu(){ S.ausr.muskete.zustand = Math.min(100, S.ausr.muskete.zustand+30); nutzen('muskete',0.5);
      return 'Schloss heraus, Feder ab, Pfanne blank, alles mit Öl und einem Lappen, den du dafür zerschnitten hast. Eine Muskete, die zündet, ist der Unterschied zwischen einem Soldaten und einem Mann mit einem Stock. <span class="fein">Muskete +30</span>'; }},

  lesen:{label:'Buchstaben lernen, gegen Bezahlung',
    cost:'Bildung · kostet 5 Francs',
    tu(){ if(S.geld<5) return 'Der Schreiber der Kompanie will fünf Francs für zwei Abende. Du hast sie nicht, und er hat keine Zeit zu verschenken. <span class="fein">nichts passiert</span>';
      S.geld-=5; S.attr.bildung=Math.min(100,S.attr.bildung+5); nutzen('verwaltung',1.5);
      return 'Der Kompanieschreiber malt dir Buchstaben in den Sand und wischt sie wieder weg. Am Ende des Abends kannst du drei Wörter, und eines davon ist dein Name. <span class="fein">Bildung +5 · −5 F</span>'; }},

  leute:{label:'Am Feuer sitzen bleiben',

      S.belastung=Math.max(0,S.belastung-4); nutzen('menschenkenntnis',1);
      return 'Karten um Knöpfe, weil niemand Geld hat. Martel erzählt von der Rheinfront und lässt die Stellen weg, an denen es schlecht ausging. Du merkst dir, wer redet und wer zuhört. <span class="fein">Kameradschaft +8 · Gunst +1 · Belastung −4</span>'; }},

  fouragieren:{label:'Die Höfe in der Umgegend abgehen',
    cost:'Fouragieren · Geld und Essen',
    tu(){ const p = probe('fouragieren',40);
      if(p.erfolg){ S.geld+=7; S.atem=Math.min(100,S.atem+8);
        return 'Zwei Hühner, ein Sack Kastanien und ein Bauer, der lieber verkauft als beraubt wird. Du bringst mehr zurück, als du selbst brauchst, und das spricht sich herum. <span class="fein">+7 F · Atem +8</span>'; }
      S.belastung=Math.min(100,S.belastung+3);
      return 'Vier Stunden auf nassen Feldwegen. Die Höfe sind leer, die Leute sind in den Bergen, und ihr Vieh ist bei ihnen. <span class="fein">Belastung +3</span>'; }},

      return 'Du legst dich hin, sobald es dunkel wird, und stehst auf, als man dich tritt. Dazwischen war nichts, und nichts ist genau das, was du gebraucht hast. <span class="fein">Belastung −10 · Atem +18</span>'; }},

  /* Ab Rang 3: nicht mehr üben, sondern üben lassen. */
  korporalschaft:{label:'Deine acht Mann drillen',
    cost:'Autorität und Drill · Ruf +1',
    tu(){ nutzen('autoritaet',2); nutzen('drill',2); S.ruf+=1;
      S.kameradschaft=Math.min(100,S.kameradschaft+6);
      return 'Du stellst acht Mann in zwei Glieder und lässt sie laden, bis es gleichzeitig knackt. Zwei von ihnen sind älter als du. Einer sieht dich an, als wolle er etwas sagen, und sagt es dann doch nicht. <span class="fein">Autorität und Drill steigen · Ruf +1 · Kameradschaft +6</span>'; }},

  tornister:{label:'Mit vollem Tornister auf den Hügel und zurück',
