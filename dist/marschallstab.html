/* Anmeldung: an das laufende Band anhängen und beim Verlauf eintragen.
   `.slice()` ist Pflicht, nicht Kosmetik — siehe die Warnung in Kapitel 1. */
KAPITEL.push(...KAPITEL3);
STATIONEN.garnison = KAPITEL3.slice();
(KAMPAGNEN.find(k=>k.id==='garnison')||{}).gebaut = true;


'use strict';
/* Spielstand: Fassungen, Wandler, Ablage, Aussetz-Spielstand.

   Zwei Dinge werden gespeichert, und sie haben nichts miteinander zu tun:

   CHRONIK  Veteranenpunkte, Chronik, erreichte Stationen. Lebt für immer,
            wächst, gehört später in die Steam-Cloud.
   LAUF     Der angefangene Feldzug. Ein einziger Platz, kein zweiter.
            Wird beim Tod sofort gelöscht und ist danach nicht mehr zu laden.

   Der Aussetz-Spielstand ist zum Aufhören da, nicht zum Wiederholen. Deshalb
   wird er bei jedem Schritt überschrieben und zeigt immer auf das Jetzt: Wer
   das Spiel beendet, kommt genau dorthin zurück, wo er war — nie weiter zurück.

   Die Datei bleibt das maßgebliche Format (Invariante 6). `localStorage` ist
   nur die bequeme Ablage, damit ein Absturz den Feldzug nicht kostet. Wo es
   sie nicht gibt, funktioniert alles weiter, nur eben ohne Absturzsicherung. */

const CHRONIK_FASSUNG = 1;
const LAUF_FASSUNG    = 5;   // 2: Lebenspunkte · 3: die Kette über dir · 4: Orden · 5: Tatenzählung
const CHRONIK_GRENZE  = 200;   // so viele Läufe im Einzelnen, der beste immer

const ORT_CHRONIK   = 'marschallstab.chronik';
const ORT_SICHERUNG = 'marschallstab.chronik.bak';
const ORT_LAUF      = 'marschallstab.lauf';

/* ══════════════════ ABLAGE ══════════════════ */

/* Eine Schicht, drei mögliche Rückseiten. Das Spiel darf nie wissen, wo es
   liegt — dieselbe Schnittstelle bedient später auch den Benutzerordner einer
   Electron-Verpackung und damit Steams Auto-Cloud. */
const Ablage = (function(){
  let echt = false;
  try { localStorage.setItem('__probe','1'); localStorage.removeItem('__probe'); echt = true; }
  catch(e){ echt = false; }        // file:// in manchen Browsern, privater Modus
  const fluechtig = {};
  return {
    dauerhaft: echt,
    lies(o){ try{ return echt ? localStorage.getItem(o) : (fluechtig[o] || null); }catch(e){ return fluechtig[o] || null; } },
    schreibe(o,t){ try{ if(echt) localStorage.setItem(o,t); else fluechtig[o]=t; return true; }
                   catch(e){ fluechtig[o]=t; return false; } },
    loesche(o){ try{ if(echt) localStorage.removeItem(o); }catch(e){} delete fluechtig[o]; }
  };
})();

/* ══════════════════ HÜLLE UND PRÜFSUMME ══════════════════ */

/* Nicht gegen Betrüger — auf dem eigenen Rechner ist das aussichtslos, und
   weil nur der beste Lauf zählt, lohnt es sich ohnehin nicht. Sondern gegen
   halb geschriebene Dateien und kaputte Cloud-Abgleiche. */
function pruefsumme(t){ let h = 0; for(let i=0;i<t.length;i++) h = (h*31 + t.charCodeAt(i))|0; return h; }

function huelle(nutzlast){
  const t = JSON.stringify(nutzlast);
  return JSON.stringify({pruef:pruefsumme(t), inhalt:nutzlast}, null, 1);
}
function auspacken(text){
  const d = JSON.parse(text);
  if(d && typeof d === 'object' && d.inhalt !== undefined){
    /* Fehlt die Prüfsumme oder ist sie keine Zahl, gilt die Datei als **kaputt**,
       nicht als heil — sonst genügte das Löschen einer Zeile, um sie zu umgehen,
       und genau das passiert bei einem verschluckten Cloud-Abgleich. */
    const heil = typeof d.pruef === 'number' && d.pruef === pruefsumme(JSON.stringify(d.inhalt));
    return {inhalt:d.inhalt, heil};
  }
  return {inhalt:d, heil:true};        // Fassung 0: nackte Nutzlast, ohne Hülle
}

/* ══════════════════ WANDLER ══════════════════ */

/* Jeder Wandler hebt genau eine Fassung auf die nächste. Nie raten, nie eine
   Fassung überspringen. Wer das Format ändert, hängt hier einen Eintrag an und
   erhöht die Fassungszahl oben — sonst brechen alle Spielstände in der Welt. */
const CHRONIK_WANDLER = {
  0: alt => ({fassung:1, vp:alt.vp|0, chronik:alt.chronik||[], bestKapitel:alt.bestKapitel||{},
              laeufe:(alt.chronik||[]).length, zuletzt:null})
};
/* Fassung 1 kannte keine Lebenspunkte — der Tod war ein Wurf je Treffer. Ein
   angefangener Feldzug von damals bekommt sie voll, abzüglich dessen, was seine
   bleibenden Wunden ohnehin schon gekostet haben. Wer mit vier Wunden aus der
   alten Fassung kommt, steht also angeschlagen da, aber nicht tot. */
const LAUF_WANDLER = {
  1: alt => {
    const m = alt.mann;
    if(m && m.leben === undefined){
      const max = 40 + Math.round((m.attr && m.attr.konstitution || 20) * 0.6);
      const gezahlt = (m.wunden||[]).reduce((s,w)=> s + (w.abzug||0), 0);
      m.leben = Math.max(Math.round(max*0.3), max - gezahlt);
    }
    return Object.assign({}, alt, {fassung:2});
  },
  /* Fassung 2 hatte eine einzige Gunst-Zahl, die immer Martel meinte. Sie wird
     zu seiner Beziehung; die drei anderen fangen bei null an — man hat sie in
     diesem Feldzug schlicht noch nicht kennengelernt. */
  2: alt => {
    const m = alt.mann;
    if(m && !m.leute){
      m.leute = leuteStart();
      m.leute.martel.gunst = Math.max(-5, Math.min(5, m.gunst|0));
      delete m.gunst;
    }
    return Object.assign({}, alt, {fassung:3});
  },
  /* Fassung 3 kannte keine Orden. Ein angefangener Feldzug bekommt eine leere
     Liste — nachträglich verleihen wäre geraten, und `ordenFaellig()` holt es
     an der nächsten Station ohnehin nach, wenn die Bedingungen stimmen. */
  3: alt => {
    if(alt.mann && !alt.mann.orden) alt.mann.orden = [];
    return Object.assign({}, alt, {fassung:4});
  },
  /* Fassung 4 zählte Taten noch nicht. Alle drei Zähler fangen bei null an —
     rückwirkend aus den Nennungen zu raten wäre geraten, und die Zähler wirken
     ohnehin erst auf die Gefechte, die noch kommen. */
  4: alt => {
    const m = alt.mann;
    if(m){
      if(m.belobigungen === undefined) m.belobigungen = 0;
      if(m.bulletins === undefined) m.bulletins = 0;
      if(m.sondermissionen === undefined) m.sondermissionen = 0;
    }
    return Object.assign({}, alt, {fassung:5});
  }
};

function wandle(d, wandler, ziel){
  if(!d || typeof d !== 'object') return null;
  let f = typeof d.fassung === 'number' ? d.fassung : 0;
  while(f < ziel){
    const w = wandler[f];
    if(!w) return null;
    const vorher = f;
    d = w(d); f = d.fassung;
    // Ein Wandler, der die Fassung nicht erhöht, hinge sonst für immer.
    if(!(typeof f === 'number' && f > vorher)) return null;
  }
  return f === ziel ? d : null;        // aus der Zukunft: lieber nichts als Trümmer
}

function neueChronik(){
  return {fassung:CHRONIK_FASSUNG, vp:0, chronik:[], bestKapitel:{}, laeufe:0, zuletzt:null};
}

/* ══════════════════ CHRONIK ══════════════════ */

/* **Der Riegel gegen die schlimmste Datenvernichtung des Spiels.** Schlägt das
   Laden fehl, obwohl eine Datei da war (Prüfsumme kaputt, Fassung aus der
   Zukunft), bleibt `META` die leere Neuchronik. Ohne Riegel überschrieb das
   erste `chronikSichern()` — und das läuft an *jeder* Station — die gute Datei
   mit der leeren, das zweite auch noch die `.bak`-Generation. Nach zwei
   Stationen waren alle Veteranenpunkte weg, und der Schutz in `wandle()`
   („aus der Zukunft: lieber nichts als Trümmer") war für nichts.
   Gelöst wird der Riegel nur, wenn der Spieler ausdrücklich verwirft. */
let CHRONIK_GESPERRT = false;

function chronikSichern(){
  if(CHRONIK_GESPERRT) return;
  META.fassung = CHRONIK_FASSUNG;
  META.zuletzt = new Date().toISOString();
  const alt = Ablage.lies(ORT_CHRONIK);
  if(alt) Ablage.schreibe(ORT_SICHERUNG, alt);     // eine Generation zurück bleibt
  Ablage.schreibe(ORT_CHRONIK, huelle(META));
}

function chronikLaden(){
  let gabEsWas = false;
  for(const ort of [ORT_CHRONIK, ORT_SICHERUNG]){
    const t = Ablage.lies(ort);
    if(!t) continue;
    gabEsWas = true;
    try{
      const {inhalt, heil} = auspacken(t);
      const d = wandle(inhalt, CHRONIK_WANDLER, CHRONIK_FASSUNG);
      if(d && heil){ META = d; return true; }
      if(d && !heil) continue;                     // beschädigt: Sicherung versuchen
    }catch(e){ /* nächster Ort */ }
  }
  // Es lag etwas da, war aber nicht lesbar: nichts überschreiben, bis der
  // Spieler entscheidet. Sonst frisst die leere Chronik beide Generationen.
  if(gabEsWas) CHRONIK_GESPERRT = true;
  return false;
}

/* „Trotzdem neu anfangen" auf dem Titelbildschirm: Der Spieler verwirft die
   unlesbare Chronik ausdrücklich, erst dann darf wieder geschrieben werden. */
function chronikFreigeben(){ CHRONIK_GESPERRT = false; chronikSichern(); }

/* Die Chronik wächst mit jedem Lauf. Alle zählen, aber nur die jüngsten
   werden einzeln behalten — und der beste immer, denn er ist der Vorrat. */
function chronikKuerzen(){
  if(META.chronik.length <= CHRONIK_GRENZE) return;
  const best = META.chronik.reduce((a,b)=> b.punkte > a.punkte ? b : a);
  const jung = META.chronik.slice(-(CHRONIK_GRENZE-1));
  META.chronik = jung.indexOf(best) >= 0 ? jung : [best].concat(jung);
}

/* ══════════════════ AUSSETZ-SPIELSTAND ══════════════════ */

function laufSichern(){
  if(!LAUF || !LAUF.mann || !LAUF.mann.lebt) return;
  LAUF.zuletzt = new Date().toISOString();
  Ablage.schreibe(ORT_LAUF, huelle(LAUF));
}

/* Beim Tod. Sofort und ohne Umweg — danach gibt es nichts mehr zu laden. */
function laufVerwerfen(){ Ablage.loesche(ORT_LAUF); }

function laufVorhanden(){
  const t = Ablage.lies(ORT_LAUF);
  if(!t) return null;
  try{
    const {inhalt, heil} = auspacken(t);
    if(!heil) return null;
    const d = wandle(inhalt, LAUF_WANDLER, LAUF_FASSUNG);
    if(!d || !d.mann || !d.mann.lebt) return null;
    return d;
  }catch(e){ return null; }
}

/* ══════════════════ DATEI ══════════════════ */

/* Das maßgebliche Format: Chronik und, falls einer läuft, der Feldzug.
   Eine Datei, damit niemand zwei verwalten muss. */
function dateiInhalt(){
  return huelle({fassung:CHRONIK_FASSUNG, chronik:META, lauf:LAUF || laufVorhanden() || null});
}

function dateiEinlesen(text){
  const {inhalt, heil} = auspacken(text);
  if(!heil) return {ok:false, grund:'Die Datei ist beschädigt — die Prüfsumme stimmt nicht.'};
  // Fassung 0 war die nackte Chronik ohne Umschlag
  const rohChronik = inhalt && inhalt.chronik !== undefined && inhalt.chronik.vp !== undefined
    ? inhalt.chronik : inhalt;
  const c = wandle(rohChronik, CHRONIK_WANDLER, CHRONIK_FASSUNG);
  if(!c) return {ok:false, grund:'Diese Datei ist kein Spielstand oder stammt aus einer neueren Fassung des Spiels.'};
  /* Zusammenführen statt ersetzen: `vp` ist das Maximum über alle Läufe
     (Invariante 2), also darf das Einlesen einer älteren Datei den Vorrat nicht
     senken. Vorher tat es genau das. `laeufe` zählt Läufe, addiert sich also. */
  c.vp = Math.max(c.vp|0, META.vp|0);
  c.laeufe = Math.max(c.laeufe|0, META.laeufe|0);
  META = c;
  CHRONIK_GESPERRT = false;    // eine gültige Datei hebt den Riegel auf
  chronikSichern();
  const l = inhalt && inhalt.lauf ? wandle(inhalt.lauf, LAUF_WANDLER, LAUF_FASSUNG) : null;
  if(l && l.mann && l.mann.lebt) Ablage.schreibe(ORT_LAUF, huelle(l));
  return {ok:true, lauf:!!l};
}


'use strict';
/* Mechanik: Spielzustand, Proben, Fertigkeitswachstum, Verschleiß, Wunden. */

/* ══════════════════ SPIELZUSTAND ══════════════════ */

let META = neueChronik();

/* Der ganze laufende Feldzug in einem Objekt — nur Daten, keine Verweise auf
   Kapiteldaten, keine Funktionen. Genau deshalb lässt er sich speichern.
   S und K sind bloß Kurznamen darauf und werden von binde() neu gesetzt. */
let LAUF = null;
let S = null;      // = LAUF.mann
let K = null;      // = LAUF.kampf

function binde(){ S = LAUF ? LAUF.mann : null; K = LAUF ? LAUF.kampf : null; }
function setzeKampf(k){ if(LAUF) LAUF.kampf = k; K = k; }

function neuerLauf(mann){
  LAUF = {fassung:LAUF_FASSUNG, mann, node:0, kampf:null, szene:null,
          lager:{id:null, abende:0, log:[]}, winter:{ort:null, wochen:3, log:[]},
          begonnen:new Date().toISOString(), zuletzt:null};
  binde();
}

/* Die Station ist abgeschlossen und ihre Wirkung angewandt: Der Spielstand
   zeigt schon auf die nächste, damit ein Beenden auf dem Ergebnisbildschirm
   die Entscheidung nicht rückgängig macht. */
function stationErledigt(){
  if(!LAUF) return;
  LAUF.node++; LAUF.szene = null;
  /* Zwischen zwei Stationen liegen Tage bis Wochen Marsch, und in denen heilt
     der Körper von allein — langsam: fünf Prozent des Vorrats je Station. Wer
     mit einem Drittel aus einem Gefecht kommt, braucht sechs, sieben Stationen,
     bis er wieder dasteht, und genau in dieser Zeit gilt der Atem-Deckel
     unten. Das Lager („Schlafen und liegen bleiben") bleibt die schnelle
     Genesung; das hier ist nur der Lauf der Zeit.
     Erste Fassung war 8 % — damit fraß die Zeit den Blutzoll des Rückzugs
     wieder auf (gemessen: mutig 1 Toter statt 4 bei 40 Läufen).
     **Wer krank ist, erholt sich gar nicht.** Die erste Fassung zog die
     Zehrung ab und heilte danach trotzdem die 5 % — beides sind Summanden, die
     Reihenfolge ändert nichts, und der Kommentar „zehrt vorher, sonst hebt sich
     beides auf" war schlicht falsch gerechnet. Bei Konstitution 70 mit
     Sumpffieber standen +4 Heilung gegen −3 Zehrung: Ein Kranker **gewann**
     einen Punkt je Station, und das ganze System „Krankheit gefährlicher als
     Kugeln" lief leer.

     Auch die Klemme lag falsch — je Wunde einzeln bei 1 gekappt, verschluckte
     sie bei zwei Krankheiten die Hälfte der Summe. Jetzt: eine Summe, eine
     Klemme, und Genesung erst, wenn das Fieber weg ist. */
  const zehrung = S.wunden.reduce((sum,w)=> sum + (w.zehrt||0), 0);
  if(zehrung) S.leben = Math.max(1, S.leben - zehrung);
  else lebenAuffuellen(0.05);
  /* Die Pension läuft, solange der Mann lebt. Historisch war die Ehrenlegion
     genau das — eine Rente, kein Blech —, und seit es einen Marketender gibt,
     ist Geld auch im Spiel etwas wert. Halbe Francs summieren sich langsam;
     über ein Kapitel sind das rund zwanzig. */
  const rente = ordenPension();
  if(rente) S.geld += rente;
  /* KONZEPT §10: „Briefe von zu Hause senken Belastung." Genau ein Punkt je
     Station — kein System, ein Beiwerk, wie es dort ausdrücklich heißt. */
  if(S.verheiratet) S.belastung = Math.max(0, S.belastung - 1);
  atemKlemmen();
  laufSichern();
}

/* ══════════════════ ORDEN ══════════════════ */

function ordenPension(){
  if(!S || !S.orden) return 0;
  return S.orden.reduce((sum,id)=>{ const o = ordenVon(id); return sum + (o ? o.pension : 0); }, 0);
}

/* Wer welchen Orden verdient hat — **geprüft, nicht gewürfelt.** Ein Orden ist
   die einzige Belohnung im Spiel, bei der man hinterher genau sagen können
   soll, wofür. Zufall würde das kaputtmachen.

   Rückgabe: der neu verdiente Orden oder null. Der Aufrufer zeigt ihn an;
   verliehen wird in `ordenVerleihen()`, damit die Anzeige nicht doppelt zählt. */
function ordenFaellig(){
  if(!S) return null;
  S.orden = S.orden || [];
  const jahr = jahrVonStation();
  if(!hatOrden('ehrenwaffe') && jahr >= 1799 && jahr <= 1803 && S.nennungen >= 3)
    return ordenVon('ehrenwaffe');
  if(!hatOrden('ehrensaebel') && jahr >= 1799 && jahr <= 1803 &&
     (S.sondermissionen|0) >= 1 && S.nennungen >= 5)
    return ordenVon('ehrensaebel');
  if(!hatOrden('legion') && jahr >= 1804 &&
     (hatOrden('ehrenwaffe') || hatOrden('ehrensaebel') || (S.nennungen >= 5 && S.ruf >= 45)))
    return ordenVon('legion');
  return null;
}

function ordenVerleihen(o){
  if(!o || hatOrden(o.id)) return null;
  S.orden.push(o.id);
  S.ruf += o.ruf;
  S.log.push('Ausgezeichnet: ' + o.name);
  return o;
}

/* Die Jahreszahl der aktuellen Station. Dieselbe Quelle, aus der `kaiserreich()`
   den Adler schaltet — ein Datum, zwei Verbraucher. */
function jahrVonStation(){
  const n = KAPITEL[Math.min(LAUF?LAUF.node:0, KAPITEL.length-1)] || {};
  const m = String(n.datum||'').match(/1[78]\d\d/);
  return m ? +m[0] : 1796;
}

function neuerCharakter(name, herkunftId, attrVerteilung, kaeufe, punkte){
  const h = HERKUENFTE.find(x=>x.id===herkunftId);
  const attr = {}; ATTRIBUTE.forEach(([k])=> attr[k] = attrVerteilung[k]);
  const fert = {}; FERTIGKEITEN.forEach(([k])=> fert[k] = 10);
  /* Die Herkunft darf über die 70 der Poolverteilung hinausgehen — sie ist das,
     was man mitbringt, nicht das, was man sich aussucht. Das war früher der
     halbe Exploit (Konstitution 90 = unsterblich); die andere Hälfte lag in der
     Tödlichkeitsformel und ist dort behoben worden: Konstitution gibt jetzt
     Lebenspunkte statt Unverwundbarkeit. */
  for(const k in h.attr) attr[k] = Math.max(0, Math.min(100, attr[k] + h.attr[k]));
  for(const k in h.fert) fert[k] = Math.max(0, Math.min(100, fert[k] + h.fert[k]));
  // Mit Veteranenpunkten vorweggenommene Ausbildung, oben auf Herkunft und Pool
  for(const k in (punkte||{})){
    if(attr[k] !== undefined) attr[k] = Math.min(100, attr[k] + punkte[k]);
    else if(fert[k] !== undefined) fert[k] = Math.min(100, fert[k] + punkte[k]);
  }
  /* **Ausrüstung wird bewusst nach den Kaufgrenzen addiert.** Muskete +8 und
     Bajonett +5 dürfen die 60 der Fertigkeitsgrenze überschreiten — sich mit
     Veteranenpunkten über den Startdeckel zu schieben, ist ein gewollter Weg,
     sie auszugeben (Entscheidung vom 28.07.2026). Geklemmt wird nur die
     absolute 100, weil `nutzen()` darüber aussteigt. */
  const ausr = AUSRUESTUNG_START();
  const hoch = (k,n)=>{ fert[k] = Math.min(100, fert[k] + n); };
  let geld = 4;
  (kaeufe||[]).forEach(id=>{
    if(id==='muskete_gut'){ ausr.muskete={name:'Modell 1777 An IX, eingeschossen',zustand:95,verschleiss:12}; hoch('muskete',8); }
    if(id==='bajonett_gut'){ ausr.seitenwaffe={name:'Geschliffenes Bajonett',zustand:95,verschleiss:8}; hoch('bajonett',5); }
    if(id==='schuhe_gut'){ ausr.schuhe={name:'Doppelt besohlte Schuhe',zustand:100,verschleiss:12}; }
    if(id==='tornister_gut'){ ausr.tornister={name:'Verstärkter Tornister',zustand:100,verschleiss:8}; }
    if(id==='mantel_gut'){ ausr.mantel={name:'Beutemantel, gewachst',zustand:90,verschleiss:8}; }
    if(id==='geld'){ geld += 50; }
  });
  const mann = {
    name, herkunft:h.name, herkunftId, attr, fert, ausr, geld,
    rang:1, zweig:null, ruf:0, leute:leuteStart(), kameradschaft:20, belastung:0,
    atem:100, leben:0,
    wunden:[], nennungen:0, belobigungen:0, bulletins:0, sondermissionen:0, orden:[], kaeufe:kaeufe||[], gekauft:punkte||{},
    kapitel:0, lebt:true, ende:null, log:[]
  };
  mann.leben = lebenMax(mann);
  return mann;
}

/* ══════════════════ DIE KETTE ÜBER DIR ══════════════════ */

/* Gunst ist keine Zahl mehr, sondern eine Beziehung je Person (−5…+5). Wer
   über dir steht, kann dich fördern *oder* blockieren — ein Fourier, den du
   beim Unterschlagen gemeldet hast, sitzt immer noch an den Listen, wenn deine
   Beförderung dort vorbeikommt. */
function person(id){ return (S && S.leute && S.leute[id]) || null; }
function gunst(id){ const p = person(id); return p ? p.gunst : 0; }

function gunstGeben(id, n){
  const p = person(id);
  if(!p || !p.lebt) return;        // einem Toten kann man nicht mehr gefallen
  p.gunst = Math.max(-5, Math.min(5, p.gunst + n));
}

/* Anrede mit Rang: „Sergent Martel", nach seinem Aufstieg „Sergent-major
   Martel". Dieselbe Person, andere Anrede — KONZEPT §3 („Kostet nichts, wirkt
   enorm"), nur in die andere Richtung. */
function personName(id){
  const d = LEUTE.find(l => l.id === id), p = person(id);
  if(!d) return '';
  const kurz = (p && p.kurz) || d.kurz;
  return d.stufen[Math.min((p ? p.stufe : 0), d.stufen.length-1)] + ' ' + kurz;
}
function personKurz(id){ const p = person(id), d = LEUTE.find(l=>l.id===id); return (p && p.kurz) || (d ? d.kurz : ''); }

/* ══════════════════ MECHANIK ══════════════════ */

function wert(k){
  let v = (S.attr[k] !== undefined) ? S.attr[k] : S.fert[k];
  if(k==='kaltbluetigkeit' && S.kaeufe.includes('amulett')) v += 5;
  // Wunden schlagen auf den Körper, nicht auf den Kopf
  const koerperlich = ['konstitution','geschick','muskete','bajonett','reiten'];
  if(koerperlich.includes(k)) S.wunden.forEach(w=>{ v -= w.abzug || 0; });
  else S.wunden.forEach(w=>{ v -= Math.round((w.abzug||0)/3); });
  v -= Math.floor(S.belastung/12);
  if(k==='muskete' && S.ausr.muskete.zustand < 35) v -= 15;
  if(k==='konstitution' && S.ausr.schuhe.zustand < 25) v -= 18;
  return Math.max(1, Math.round(v));
}

/* `ohneUebung` für Würfe, die keine Handlung sind, sondern ein Zustand — die
   Konstitutions-Probe gegen ein Fieber etwa. Ohne den Schalter trainierte
   ausgerechnet der Kranke bei jedem Ruhe-Abend seine Konstitution und damit
   seinen Lebensvorrat, während der Gesunde beim selben Knopf nichts bekam:
   Krankheit wäre auf Dauer ein Vorteil gewesen. */
function probe(k, schwierigkeit, ohneUebung){
  const w = wert(k);
  const ziel = Math.max(5, Math.min(95, w - schwierigkeit + 50));
  const wurf = 1 + Math.floor(Math.random()*100);
  if(!ohneUebung) nutzen(k, 1);
  return {wurf, ziel, wertRoh:w, erfolg: wurf <= ziel};
}

function nutzen(k, intens){
  const ist = (S.attr[k] !== undefined) ? S.attr[k] : S.fert[k];
  if(ist >= 100) return;
  const zuwachs = (1.7 * intens * (100-ist)/100) * (0.5 + Math.random());
  if(Math.random() < 0.75){
    const neu = Math.min(100, ist + Math.max(1, Math.round(zuwachs)));
    if(S.attr[k] !== undefined) S.attr[k] = neu; else S.fert[k] = neu;
  }
}

function anwenden(e){
  if(!e) return;
  if(e.ruf) S.ruf = Math.max(0, S.ruf + e.ruf);
  // Ohne Angabe geht Gunst an Martel — er ist der unmittelbare Vorgesetzte,
  // und alle bestehenden Szenen meinen ihn. Neue Daten setzen `gunstVon`.
  if(e.gunst) gunstGeben(e.gunstVon || 'martel', e.gunst);
  if(e.kameradschaft) S.kameradschaft = Math.max(0, Math.min(100, S.kameradschaft + e.kameradschaft));
  if(e.belastung) S.belastung = Math.max(0, Math.min(100, S.belastung + e.belastung));
  if(e.atem) S.atem = Math.max(0, Math.min(100, S.atem + e.atem));
  if(e.geld) S.geld = Math.max(0, S.geld + e.geld);
  if(e.nennung){ S.nennungen++; }
  if(e.attr) for(const k in e.attr) S.attr[k] = Math.max(0, Math.min(100, S.attr[k] + e.attr[k]));
  if(e.fert) for(const k in e.fert) S.fert[k] = Math.max(0, Math.min(100, S.fert[k] + e.fert[k]));
  if(e.ausr) for(const k in e.ausr) S.ausr[k].zustand = Math.max(0, Math.min(100, S.ausr[k].zustand + e.ausr[k]));
  if(e.leben) S.leben = Math.max(1, Math.min(lebenMax(), S.leben + e.leben));
  /* Eine Wunde aus einer Szene kostet auch Kraft — Ruhr, Hitzschlag und das
     Fieber aus Jaffa sind in Ägypten gefährlicher als Kugeln, und das muss man
     an derselben Zahl sehen. Sie tötet nie unmittelbar: Der Tod gehört ins
     Gefecht, wo er einen Text und einen Ort hat. Sie lässt einen aber so
     geschwächt hineingehen, dass die nächste Kugel reicht. */
  /* `zehrt` macht aus einer Wunde eine Krankheit: Sie kostet nicht einmal,
     sondern an jeder Station weiter, bis sie behandelt ist. Das ist die
     Umsetzung von „Krankheit sollte gefährlicher sein als Kugeln" (KONZEPT.md)
     — Ruhr und das Fieber aus Jaffa liefern einen Mann beim nächsten Gefecht
     mit leerem Vorrat und keiner Luft ab, ohne ihn je selbst zu töten. */
  if(e.wunde){ wundeGeben(e.wunde, 8, e.zehrt); S.leben = Math.max(1, S.leben - 10); }
  /* `heilt` nimmt Wunden weg, statt welche zu geben — die Gegenrichtung, und
     bis Kapitel 3 gab es sie nicht. Das Lazarett von Marseille braucht sie:
     Wer mit der Ruhr aus Ägypten kommt, soll sie *gespielt* loswerden und
     nicht stillschweigend beim Kapitelwechsel. `'krank'` nimmt alles Zehrende,
     eine Zahl nimmt so viele Wunden von vorn. */
  if(e.heilt === 'krank') S.wunden = S.wunden.filter(w=>!w.zehrt);
  else if(typeof e.heilt === 'number') S.wunden.splice(0, e.heilt);
  /* Ein Merkmal, das über die Station hinaus gilt (Ehe, Schulden, gesehene
     Dinge). Bewusst schmal: nur setzen, nie rechnen — wer eine Zahl braucht,
     nimmt eines der bestehenden Felder. */
  if(e.setzt) for(const k in e.setzt) S[k] = e.setzt[k];
  atemKlemmen();
}

/* ── Lebenspunkte ──
   Konstitution bestimmt, wie viel ein Mann aushält, nicht ob ihn eine Kugel
   überhaupt töten kann. Das ist der Unterschied zur alten Formel: Dort senkte
   Konstitution die Todeschance je Treffer, und ab 58 war sie rechnerisch null
   — ein Mann, den keine Kugel tötet. Hier ist die Kurve monoton: Mehr
   Konstitution heißt mehr Treffer, die man wegsteckt, aber genug Treffer
   töten jeden.

   Gerechnet wird vom **rohen** Attribut, nicht von wert(): Sonst schrumpfte
   die Obergrenze mitten im Gefecht, weil Wunden die Konstitution senken. */
const WUNDE_JE_PUNKT = 0.6;    // Abzug 5/8/14 → 3/5/8 Punkte weniger Vorrat
const VORRAT_BODEN     = 0.4;    // so viel bleibt einem Zerschossenen mindestens

function lebenMax(mann){
  const m = mann || S;
  const roh = m.attr && typeof m.attr.konstitution === 'number' ? m.attr.konstitution : 20;
  const grund = 40 + Math.round(roh * 0.6);   // 52 bei 20 · 64 bei 40 · 82 bei 70 · 94 bei 90
  /* Offene Wunden verkleinern den Mann. Das ist der Hebel, der die Lücke
     schließt, durch die ein kundiger Spieler bisher unbeschadet kam: Leben
     heilt schnell nach (Zeit, Lagerabend, Winterwoche), Wunden wird man nur
     langsam los — der Feldscher näht je Gefecht nur die leichteste. Wer mit
     zwei alten Wunden nach Arcole geht, hat 66 statt 82 Punkte, und über den
     Atem-Deckel entsprechend weniger Luft.
     Der Boden bei 40 % verhindert, dass Wunden allein töten: Sie machen einen
     kleiner, nie tot — der Tod gehört ins Gefecht. */
  const offen = (m.wunden||[]).reduce((sum,w)=> sum + (w.abzug||0), 0);
  return Math.max(Math.round(grund*VORRAT_BODEN), grund - Math.round(offen*WUNDE_JE_PUNKT));
}
function lebenAuffuellen(anteil){
  const max = lebenMax();
  // Klemme bei 1: Sterben darf man nur im Gefecht, nie durch Buchhaltung.
  S.leben = Math.max(1, Math.min(max, S.leben + Math.round(max*anteil)));
}

/* Der Atem steigt nie über die Lebenspunkte. Das ist die eine Regel, die einen
   schwer Verwundeten wirklich verwundet spielen lässt: Mit 25 Leben stehen ihm
   höchstens 25 Atem zu — unter der Warnschwelle 35, nahe am Malus bei 30. Er
   kann ins Gefecht, aber er geht als der hinein, der er gerade ist. Erst
   heilen, dann verschnaufen. Aufgerufen nach jeder Änderung an Atem oder
   Leben; wer eine neue Stelle baut, die daran dreht, ruft sie ebenfalls. */
function atemKlemmen(){
  if(!S) return;
  S.leben = Math.max(0, Math.min(S.leben, lebenMax()));
  S.atem  = Math.max(0, Math.min(S.atem, S.leben));
}

function wundeGeben(name, abzug, zehrt){
  const w = {name, abzug};
  if(zehrt) w.zehrt = zehrt;          // Krankheit: zehrt je Station weiter
  S.wunden.push(w);
  S.belastung = Math.min(100, S.belastung + 6);
  atemKlemmen();                       // der Vorrat ist gerade kleiner geworden
}

function verschleiss(faktor){
  for(const k in S.ausr){
    const a = S.ausr[k];
    if(a.verschleiss>0) a.zustand = Math.max(0, a.zustand - Math.round(a.verschleiss*faktor));
  }
}

/* Der Tod nimmt dem Spielstand im selben Augenblick die Gültigkeit. Kein
   Zurück, keine zweite Ausfertigung — Invariante 1. */
function toetlich(grund){
  S.lebt = false; S.ende = 'tot'; S.todesart = grund;
  laufVerwerfen();
}


'use strict';
/* Oberfläche: Titel, Kaufladen, Charaktererschaffung, Ablaufsteuerung, Szenen. */

/* ══════════════════ DARSTELLUNG ══════════════════ */

const app = document.getElementById('app');
const kopf = document.getElementById('kopfrechts');
const fuss = document.getElementById('fusszeile');
const untertitel = document.getElementById('untertitel');

/* Auch `"` und `'` — sonst bricht ein Name mit Anführungszeichen im Namensfeld
   (`value="…"`) aus dem Attribut aus, und „Jean \"le Brave\" Duval" wird beim
   Neuzeichnen still abgeschnitten. Das ist die einzige Stelle im Spiel, an der
   Spielertext in einem Attribut landet; die Funktion muss trotzdem vollständig
   sein, weil überall angenommen wird, dass sie es ist. */
/* ── Kopf eines Vordrucks ──
   Republik bis 1804, Kaiserreich danach. Der Kopf steht auf jedem Papier, das
   die Armee ausstellt — und er wechselt mit dem Kapitel, ohne dass ein Wort
   dazu nötig wäre. */
function kaiserreich(){
  const n = LAUF ? KAPITEL[Math.min(LAUF.node, KAPITEL.length-1)] : null;
  const jahr = n && n.datum ? parseInt((n.datum.match(/1[78]\d\d/)||[0])[0],10) : 1796;
  return jahr >= 1804;
}
function vordruck(n){
  return `<div class="vordruck">
    <div class="rf">${kaiserreich() ? 'Empire Français' : 'République Française'}</div>
    <div class="einheit">32.&thinsp;Demi-brigade de bataille</div>
    <div class="wann">${esc((n && n.datum) || '')}</div>
  </div>`;
}

/* Kokarde (Republik) und Adler (Kaiserreich) als reines SVG — 1796 gab es
   keine Adler, die Halbbrigaden trugen Fahnen. */
function emblem(){
  if(kaiserreich()) return `<svg class="emblem" viewBox="0 0 26 26" role="img" aria-label="Adler">
    <path d="M13 4 L16 8 L22 9 L18 12 L20 19 L13 15 L6 19 L8 12 L4 9 L10 8 Z" fill="#d0a75e" opacity=".85"/>
    <rect x="12" y="14" width="2" height="8" fill="#d0a75e" opacity=".6"/></svg>`;
  return `<svg class="emblem" viewBox="0 0 26 26" role="img" aria-label="Kokarde">
    <circle cx="13" cy="13" r="10.5" fill="#c2483a"/>
    <circle cx="13" cy="13" r="7" fill="#e8e0cd"/>
    <circle cx="13" cy="13" r="3.4" fill="#3d5a80"/></svg>`;
}

/* Welche Kapitel gebaut sind — **aus den Daten, nicht aus einem festen Satz.**

   Diese Zeile stand zweimal wörtlich im Code („Prototyp · Italien 1796/97 ·
   Ägypten 1798/99") und wurde beim Bau von Kapitel 3 nicht mitgezogen: Die
   Startseite bewarb monatelang zwei Kapitel, während drei geladen wurden. Das
   ist genau die Sorte Fehler, die niemand im Test findet, weil kein Test einen
   Werbetext prüft — deshalb steht die Zahl jetzt nirgends mehr geschrieben.

   `kurz` liefert die Fassung für den Untertitel unter dem Haupttitel. */
function gebauteKapitel(kurz){
  const g = KAMPAGNEN.filter(k=>k.gebaut);
  if(!g.length) return 'Prototyp';
  if(kurz){
    if(g.length === 1) return `Erstes Kapitel · ${g[0].name} ${g[0].jahre}`;
    /* Die Jahre der Kampagnen stehen verkürzt da („1796–97"). Für die Spanne
       über alle Kapitel wird das Endjahr wieder ausgeschrieben — „1796–04"
       liest sich wie ein Zahlendreher. */
    const von = g[0].jahre.split('–')[0];
    const letzte = g[g.length-1].jahre.split('–');
    const bis = letzte.pop();
    /* Das Jahrhundert kommt vom **Anfangsjahr des letzten Kapitels**, nicht vom
       des ersten: Garnison ist „1801–04", also 1804. Mit dem Jahrhundert von
       1796 wäre daraus 1704 geworden. */
    const bisVoll = bis.length === 2 ? letzte[0].slice(0,2) + bis : bis;
    return `${g.length} Kapitel · ${von}–${bisVoll}`;
  }
  return 'Prototyp · ' + g.map(k=>`${k.name} ${k.jahre}`).join(' · ');
}

function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function balken(klasse, v, max){ return `<div class="bar ${klasse}"><i style="width:${Math.max(0,Math.min(100,100*v/max))}%"></i></div>`; }

/* Ortswechsel über der Station: woher, wohin, wie weit, wie lange.
   Die Wege sind die halbe Erzählung dieses Feldzugs — 1 200 km in einem Jahr. */
function wegband(n){
  if(!n || !n.marsch) return '';
  const m = n.marsch;
  return `<div class="weg">
    <div class="wegorte">${esc(m.von)}<i>→</i>${esc(m.nach)}</div>
    <div class="wegtext">${esc(m.weg)}</div></div>`;
}

function kopfzeile(){
  fuss.textContent = `Veteranenpunkte: ${META.vp}`;
  if(!S){ kopf.innerHTML = `VETERANENPUNKTE ${META.vp} · LÄUFE ${META.laeufe|0}`;
    untertitel.textContent = gebauteKapitel(true); return; }
  kopf.innerHTML = `<span style="display:inline-flex;align-items:center;gap:9px;justify-content:flex-end">
    ${emblem()}<span>${esc(S.name.toUpperCase())} · ${rangName(S.rang).toUpperCase()} · RUF ${S.ruf}</span></span>`;
  const n = KAPITEL[Math.min(LAUF?LAUF.node:0, KAPITEL.length-1)];
  untertitel.textContent = n && n.datum ? n.datum : 'Italien 1796/97';
}

/* ── Kampagnenverlauf links ──
   Zeigt alle elf Kampagnen, aber innerhalb einer Kampagne nur die Stationen,
   die man mindestens einmal betreten hat. Was danach kommt, weiß man nicht —
   das ist Absicht und dieselbe Haltung wie im Gefecht: Du siehst, wo du bist,
   nicht, was auf dich zukommt. Der Nebel liegt in META.bestKapitel und
   überlebt deshalb den Tod. */

let VERLAUF_OFFEN = {italien:1};

/* Kurze Wörter: Die Spalte ist 246 px breit, „Neuaufstellung" bricht dort um. */
function stationsArt(n){
  return {kampf:'Gefecht', lager:'Lager', winter:'Winter',
          befoerderung:'Musterung', elite:'Auswahl', ende:'Ende'}[n.typ] || '';
}

function verlauf(){
  const jetzt = LAUF ? (KAPITEL[Math.min(LAUF.node,KAPITEL.length-1)]||{}).id : null;
  const bloecke = KAMPAGNEN.map(k=>{
    const auf = !!VERLAUF_OFFEN[k.id];
    const st = STATIONEN[k.id] || [];
    const gesehen = st.filter(n=>n.id && META.bestKapitel[n.id]);
    const hier = st.some(n=>n.id===jetzt);
    let inhalt;
    if(!k.gebaut){
      inhalt = `<div class="kmpleer">Noch nicht gebaut. ${esc(k.kurz)}</div>`;
    } else if(!gesehen.length){
      inhalt = '<div class="kmpleer">Noch keine Station dieses Feldzugs betreten.</div>';
    } else {
      // Eine Zeile je Station: nur Ort und Art. Datum und Besuchszähler standen
      // früher mit darin und machten aus der Liste eine Tabelle. Das Datum steht
      // ohnehin im Kartenkopf, sobald man dort ist, und hängt hier im Titel.
      // Die beiden Stationen in Savona trennt jetzt die Art.
      inhalt = gesehen.map(n=>{
        const ort = (n.datum||'').split(' · ')[1] || n.ort || n.id;
        const art = stationsArt(n);
        return `<div class="kmpst ${n.id===jetzt?'jetzt':''} ${n.typ==='kampf'?'gefecht':''}"
          title="${esc(n.datum||'')}">
          <span class="kmpst-ort">${esc(ort)}</span>
          ${art?`<span class="kmpst-art">${art}</span>`:''}</div>`;
      }).join('');
      if(gesehen.length < st.length)
        inhalt += '<div class="kmpleer">Was danach kommt, weißt du nicht.</div>';
    }
    return `<div class="kmp ${auf?'auf':''} ${k.gebaut?'':'ungebaut'}" id="kmp_${k.id}">
      <button class="kmpkopf" onclick="verlaufUm('${k.id}')">
        <span class="kmppfeil">${auf?'▾':'▸'}</span>
        <span class="kmpnr">${k.nr}</span>
        <span class="kmpname">${esc(k.name)}${hier?' <i>· hier</i>':''}</span>
        <span class="kmpjahr">${esc(k.jahre)}</span>
      </button>
      <div class="kmpliste">${inhalt}</div></div>`;
  }).join('');
  return `<aside class="card verlauf"><div class="ch"><span>Der Weg</span><span>11 Feldzüge</span></div>
    <div class="cb">${bloecke}</div></aside>`;
}

/* Auf- und zuklappen ohne Neuaufbau des Bildschirms — sonst müsste jede
   Ansicht wissen, wie sie sich selbst neu zeichnet. */
function verlaufUm(id){
  const e = document.getElementById('kmp_'+id); if(!e) return;
  const auf = e.classList.toggle('auf');
  if(auf) VERLAUF_OFFEN[id]=1; else delete VERLAUF_OFFEN[id];
  const p = e.querySelector('.kmppfeil'); if(p) p.textContent = auf ? '▾' : '▸';
}

/* Ab 35 wird gewarnt, ab 30 kostet es wirklich (+5 Gefahr je Kampfrunde).
   Die Warnung kommt absichtlich fünf Punkte früher als der Malus — sie soll
   zum Schlafen im Lager bewegen, nicht den Schaden bloß melden. */
const ATEM_WARNUNG = 35;
function ausserAtem(){ return S && S.atem <= ATEM_WARNUNG; }

/* Dieselbe Regel für die Lebenspunkte: gewarnt wird bei einem Drittel, lange
   bevor es rechnerisch eng wird. Wer rot sieht, soll im Lager „Schlafen und
   liegen bleiben" wählen, statt scharf zu schießen. */
function angeschlagen(){ return S && S.leben <= lebenMax()/3; }

/* Der ungeschmälerte Vorrat. Steht blass hinter dem aktuellen, sobald offene
   Wunden ihn drücken — sonst wüsste niemand, warum die Obergrenze wandert.
   Rechnet über `lebenMax()` mit einem wundenlosen Mann, statt die Formel ein
   drittes Mal zu schreiben. */
function lebenGrund(){ return lebenMax({attr:S.attr, wunden:[]}); }

/* Die Kette über dir. Vier Namen statt einer Zahl — und der Rang davor ändert
   sich mit, wenn die Person selbst aufsteigt. Gefallene bleiben stehen, damit
   man sieht, wer einmal für einen gesprochen hätte. */
function ueberDir(){
  if(!S.leute) return '';
  const zeile = l => {
    const p = S.leute[l.id]; if(!p) return '';
    const g = p.gunst, farbe = g<0 ? 'warn' : (g>=3 ? 'ok' : '');
    return `<div class="kv"><span class="hilfe" data-hilfe="${String(l.was).replace(/"/g,'&quot;')}">${
      p.lebt ? esc(personName(l.id)) : '<s>'+esc(personName(l.id))+'</s>'}</span>
      <b class="${farbe}">${p.lebt ? (g>0?'+':'')+g : '†'}</b></div>`;
  };
  return `<p class="mini">Über dir</p>${LEUTE.map(zeile).join('')}`;
}

function seitenleiste(){
  const geladen = K ? (K.geladen?'geladen':'ungeladen') : '—';
  // Krankheiten werden ausgewiesen: Sie zehren an jeder Station weiter, Wunden nicht.
  const w = S.wunden.length
    ? S.wunden.map(x=>esc(x.name) + (x.zehrt?' <i class="zehrt">zehrt</i>':'')).join(', ')
    : 'keine';
  const zust = k => { const a=S.ausr[k]; const c = a.zustand<20?'warn':(a.zustand<40?'':'ok');
    return `<div class="kv"><span>${esc(a.name)}</span><b class="${a.zustand<20?'warn':''}">${a.zustand}</b></div>`; };
  return `<aside class="card">
    <div class="ch"><span>${K?'Dein Zustand':'Livret militaire'}</span><span>32.&thinsp;DB</span></div>
    <div class="cb">
      <p class="who">${esc(S.name)}</p>
      <div class="rangzeile">${rangabzeichen(S)}
        <p class="whorank">${rangName(S.rang)} · 32. Halbbrigade</p></div>
      <div class="stat"><div class="statlab"><span>Leben</span><span class="${angeschlagen()?'warn':''}">${S.leben} / ${lebenMax()}${lebenMax()<lebenGrund()?` <i class="fein">von ${lebenGrund()}</i>`:''}</span></div>
        ${balken(angeschlagen()?'b-red':'b-green',S.leben,lebenMax())}
        ${angeschlagen()?`<p class="warnung">Du hast zu viel Blut verloren.${S.leben<=lebenMax()*0.15?' Der nächste Treffer wird der letzte sein.':' Noch ein oder zwei Treffer, und es ist vorbei.'}</p>`:''}</div>
      <div class="stat"><div class="statlab"><span>Atem</span><span class="${ausserAtem()?'warn':''}">${S.atem}</span></div>
        ${balken(ausserAtem()?'b-red':'b-steel',S.atem,100)}
        ${ausserAtem()?`<p class="warnung">Du bist außer Atem.${S.atem<30?' Unter 30 wird jede Runde im Gefecht gefährlicher — du triffst schlechter und sie treffen dich leichter.':' Unter 30 wird es im Gefecht gefährlich.'}</p>`:''}</div>
      <div class="stat"><div class="statlab"><span>Belastung</span><span>${S.belastung}</span></div>${balken('b-red',S.belastung,100)}</div>
      <div class="stat"><div class="statlab"><span>Ruf</span><span>${S.ruf}</span></div>${balken('b-brass',S.ruf,100)}</div>
      <div class="stat"><div class="statlab"><span>Kameradschaft</span><span>${S.kameradschaft}</span></div>${balken('b-green',S.kameradschaft,100)}</div>
      ${K?`<div class="rule"></div><div class="kv"><span>Muskete</span><b>${geladen}</b></div>
           <div class="kv"><span>Deckung</span><b>${K.deckung?'ja':'nein'}</b></div>`:''}
      <div class="rule"></div>
      <p class="mini">Attribute</p>
      ${ATTRIBUTE.map(([k,n])=>`<div class="kv"><span>${mitHilfe(k,n)}</span><b>${S.attr[k]}</b></div>`).join('')}
      <div class="rule"></div>
      <p class="mini">Fertigkeiten</p>
      ${FERTIGKEITEN.filter(([k])=>S.fert[k]>10).map(([k,n])=>`<div class="kv"><span>${mitHilfe(k,n)}</span><b>${S.fert[k]}</b></div>`).join('') || '<div class="kv"><span>alle bei 10</span><b>—</b></div>'}
      <div class="rule"></div>
      <p class="mini">Ausrüstung · Zustand</p>
      ${Object.keys(S.ausr).filter(k=>S.ausr[k].verschleiss>0).map(zust).join('')}
      <div class="rule"></div>
      <div class="kv"><span>Geld</span><b>${S.geld} F</b></div>
      <div class="kv"><span>Wunden</span><b class="${S.wunden.length?'warn':''}">${w}</b></div>
      <div class="kv"><span>Im Tagesbefehl</span><b>${S.nennungen}×</b></div>
      ${S.bulletins?`<div class="kv"><span>${kaiserreich()?'Im Bulletin':'Dem Oberbefehl gemeldet'}</span><b>${S.bulletins}×</b></div>`:''}
      ${S.belobigungen?`<div class="kv"><span>Vor der Front gelobt</span><b>${S.belobigungen}×</b></div>`:''}
      ${(S.orden||[]).map(id=>{ const o=ordenVon(id); return o?`<div class="kv"><span>${esc(o.name)}</span><b>${ordensbild(id)}</b></div>`:''; }).join('')}
      ${ueberDir()}
    </div>
  </aside>`;
}

/* ── Titelbildschirm ── */
function zeigeTitel(){
  LAUF=null; binde(); kopfzeile();
  const offen = laufVorhanden();
  const best = META.chronik.length ? Math.max(...META.chronik.map(x=>x.punkte)) : 0;
  const chron = META.chronik.length ? META.chronik.map((c,i)=>
    `<tr${c.punkte===best?' class="hi"':''}>
      <td class="d"><button class="namebtn" onclick="zeigeBlatt(${i})">${c.punkte===best?'★ ':''}${esc(c.name)}</button></td>
      <td class="d">${esc(c.rang)}</td><td class="d">${esc(c.ende)}</td><td class="n">${c.punkte}</td></tr>`)
    .reverse().join('')
    : '<tr><td class="d" colspan="4">Noch kein Eintrag. Der erste Mann wartet.</td></tr>';

  app.innerHTML = `
  <div class="card"><div class="ch"><span>${emblem()} Der Marschallstab</span><span>${gebauteKapitel()}</span></div>
   <div class="cb">
    <div class="zit">Du beginnst 1796 als Rekrut mit einer Muskete, die dir nicht gehört.<br>
    Wenn du dieses Kapitel überlebst, bist du vielleicht Caporal.<br>
    Wahrscheinlicher liegst du im April in einem Graben bei Montenotte.</div>
    ${CHRONIK_GESPERRT ? `<div class="ergebnis schlecht" style="margin-bottom:14px">
      <b>Deine Chronik ist nicht lesbar.</b> Es lag ein Spielstand vor, aber er ist beschädigt oder
      stammt aus einer neueren Fassung des Spiels. Solange das so ist, wird <b>nichts überschrieben</b> —
      deine Veteranenpunkte sind noch da, dieses Spiel sieht sie nur nicht.
      <p style="margin:10px 0 0">Lade die Datei über „Spielstand laden", oder verwirf die alte Chronik und fang bei null an.</p>
      <p style="margin:10px 0 0"><button class="plain" onclick="if(confirm('Die alte Chronik wird überschrieben. Sicher?')){chronikFreigeben();zeigeTitel();}">Alte Chronik verwerfen</button></p>
    </div>` : ''}
    ${offen ? `<div class="wirkung" style="margin-bottom:14px"><span>Unterbrochener Feldzug</span>
      ${esc(offen.mann.name)} · ${esc(rangNameVon(offen.mann))} · ${esc((KAPITEL[Math.min(offen.node,KAPITEL.length-1)].datum||'').split(' · ')[0])}</div>` : ''}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px">
      ${offen ? '<button class="plain" onclick="fortsetzen()">Feldzug fortsetzen</button>' : ''}
      <button class="plain" onclick="zeigeErschaffung(true)">Neuen Mann aufstellen</button>
      <button class="plain" onclick="speichern()">Spielstand sichern</button>
      <a class="plain" href="wiki.html" target="_blank" rel="noopener"
         style="text-decoration:none;display:inline-block">Handbuch</a>
      <button class="plain" onclick="document.getElementById('ladefeld').click()">Spielstand laden</button>
      <input type="file" id="ladefeld" accept=".json" class="hidden" onchange="laden(event)">
    </div>
    ${offen ? '' : `<p class="mini" style="margin:14px 0 0;color:var(--faint)">${Ablage.dauerhaft
      ? 'Der Feldzug wird selbsttätig gesichert. Wer stirbt, verliert ihn — wer aufhört, kommt zurück.'
      : 'Dieser Browser erlaubt keine selbsttätige Sicherung. Der Spielstand geht nur über die Datei.'}</p>`}
   </div></div>

  <div class="grid2">
    <div class="card"><div class="ch"><span>Chronik</span><span>${META.laeufe|0} Läufe</span></div>
      <div class="cb"><table><tr><th>Name</th><th>Endrang</th><th>Ende</th><th class="n">VP</th></tr>${chron}</table></div></div>
    ${verlauf()}
  </div>`;
  fuss.textContent = `Veteranenpunkte: ${META.vp}`;
}

/* ── Das Blatt eines Mannes ──
   Was in der Chronik als eine Zeile steht, war ein ganzer Feldzug. Hier steht
   er ausgeschrieben: womit er einrückte, was er unterwegs entschieden hat und
   womit er aufgehört hat. Ältere Einträge kennen diese Felder nicht — dann
   bleibt es bei der Zeile, und das Blatt sagt das auch. */
function zeigeBlatt(i){
  const c = META.chronik[i];
  if(!c){ zeigeTitel(); return; }
  const zeile = (k,v)=>`<div class="kv"><span>${k}</span><b>${v}</b></div>`;

  if(!c.attr){
    app.innerHTML = `<div class="card papier"><div class="ch"><span>${esc(c.name)}</span><span>${esc(c.ende)}</span></div>
      <div class="cb"><div class="note">Von diesem Mann ist nur die Zeile geblieben — er stammt aus einer Fassung,
      die noch kein Blatt geführt hat. ${esc(c.rang)}, ${c.punkte} Punkte.</div>
      <div style="margin-top:16px"><button class="plain" onclick="zeigeTitel()">Zurück zur Chronik</button></div>
      </div></div>`;
    return;
  }

  const taten = c.log.length ? c.log.map(z=>{
    const t = z.split(': '), n = KAPITEL.find(x=>x.id===t[0]);
    const wo = n ? ((n.datum||'').split(' · ')[1] || n.ort || t[0]) : t[0];
    return `<div class="blattzeile"><span class="blattort">${esc(wo)}</span><span>${esc(t.slice(1).join(': '))}</span></div>`;
  }).join('') : '<p class="hinweis">Er hat nichts entschieden, was jemand aufgeschrieben hätte.</p>';

  const fert = FERTIGKEITEN.filter(([k])=>c.fert[k]>10);
  app.innerHTML = `<div class="stage">${verlauf()}
    <div>
      <div class="card papier"><div class="ch"><span>${esc(c.name)}</span><span>${esc(c.ort||'')}</span></div>
        <div class="cb">
          <div class="rangzeile">${rangabzeichen({rang:c.rangN||1, zweig:c.zweig})}
            <p class="whorank">${esc(c.rang)} · ${esc(c.herkunft||'')} · 32. Halbbrigade</p></div>
          <div class="note ${c.gefallen?'red':'green'}">${c.gefallen
            ? esc(c.ende)+'. Von den Stationen dieses Feldzugs hat er '+c.stationen+' erreicht.'
            : esc(c.ende)+'. Er hat den Feldzug überstanden — '+c.stationen+' Stationen.'}</div>
          <div class="lage"><div class="lagekopf">Was er unterwegs entschieden hat</div>${taten}</div>
        </div></div>
      <div class="card papier"><div class="ch"><span>Wertung</span><span>${c.punkte} Veteranenpunkte</span></div>
        <div class="cb">${wertungsTabelleAus(c)}
        <div style="margin-top:16px"><button class="plain" onclick="zeigeTitel()">Zurück zur Chronik</button></div>
        </div></div>
    </div>
    <aside class="card"><div class="ch"><span>Sein Zustand am Ende</span></div><div class="cb">
      <p class="mini">Attribute</p>
      ${ATTRIBUTE.map(([k,n])=>zeile(mitHilfe(k,n), c.attr[k])).join('')}
      <div class="rule"></div>
      <p class="mini">Fertigkeiten</p>
      ${fert.length ? fert.map(([k,n])=>zeile(mitHilfe(k,n), c.fert[k])).join('') : '<div class="kv"><span>alle bei 10</span><b>—</b></div>'}
      <div class="rule"></div>
      <p class="mini">Ausrüstung · Zustand</p>
      ${c.ausr.filter(a=>a.verschleiss>0).map(a=>zeile(esc(a.name), a.zustand)).join('')}
      <div class="rule"></div>
      ${zeile('Ruf', c.ruf)}${zeile('Kameradschaft', c.kameradschaft)}
      ${c.leute ? '<div class="rule"></div><p class="mini">Über ihm</p>' + c.leute.map(l=>
        zeile(l.lebt?esc(l.name):'<s>'+esc(l.name)+'</s>', l.lebt?((l.gunst>0?'+':'')+l.gunst):'†')).join('') : ''}
      ${c.lebenMax ? zeile('Leben', c.leben+' / '+c.lebenMax) : ''}
      ${zeile('Belastung', c.belastung)}${zeile('Atem', c.atem)}${zeile('Geld', c.geld+' F')}
      ${zeile('Im Tagesbefehl', c.nennungen+'×')}
      ${(c.orden||[]).length ? zeile('Ausgezeichnet', (c.orden||[]).map(id=>(ordenVon(id)||{}).name).filter(Boolean).join(', ')) : ''}
      ${zeile('Wunden', c.wunden.length ? c.wunden.map(esc).join(', ') : 'keine')}
    </div></aside>
  </div>`;
  kopfzeile();
}

/* ── Veteranenpunkte ausgeben ──
   Zwei Arten, sie loszuwerden: Ausrüstung als Ganzes, oder Ausbildung in
   einzelnen Punkten. Die Punkte werden mit jedem Zehnerbereich teurer
   (PRO_PUNKT in grundwerte.js) — von 10 auf 20 kostet 10 VP, von 50 auf 60
   schon 40. Damit kauft man sich einen Vorsprung, aber nie eine Laufbahn:
   Rang, Ruf und Gunst bleiben unkäuflich (Invariante 3). */

let AUSWAHL = [], PUNKTE = {};
const PUNKT_SCHRITT = 5;
function istAttribut(k){ return ATTRIBUTE.some(([a])=>a===k); }

/* Der Preis rechnet vom **tatsächlichen** Wert, nicht vom Sockel: Die Erschaffung
   kommt zuerst, also steht schon fest, was Herkunft und Pool ergeben haben. Wer
   als Wilderer mit Muskete 40 anfängt, zahlt für den nächsten Punkt mehr als
   einer, der bei 10 steht — das ist der Sinn von PRO_PUNKT. */
function istWert(k){
  const h = HERKUENFTE.find(x=>x.id===(ERSCH&&ERSCH.herkunft)) || {attr:{},fert:{}};
  return istAttribut(k)
    ? Math.max(0, Math.min(70, (ERSCH?ERSCH.attr[k]:20) + (h.attr[k]||0)))
    : Math.max(0, Math.min(60, 10 + (h.fert[k]||0)));
}
function punktGrenze(k){ return istAttribut(k) ? 70 : 60; }   // darüber nur noch im Feld
function punktKosten(k){ const b = istWert(k); return kostenVon(b, b + (PUNKTE[k]||0)); }
function gesamtKosten(){
  return AUSWAHL.reduce((s,id)=>s+LADEN.find(p=>p.id===id).vp,0)
       + Object.keys(PUNKTE).reduce((s,k)=>s+punktKosten(k),0);
}

function punktZeile(k,n){
  const p = PUNKTE[k]||0, ist = istWert(k);
  return `<div class="punktzeile ${p?'gewaehlt':''}" id="pz_${k}">
    <span>${mitHilfe(k,n)}</span>

/* Zweiter Schritt der Erschaffung: Was der Vorrat aus dem fertigen Mann macht. */
function zeigeLaden(){
  if(!ERSCH || !ERSCH.herkunft){ zeigeErschaffung(); return; }
  AUSWAHL = []; PUNKTE = {};
  const zeilen = LADEN.map(p=>`<tr id="kz_${p.id}"><td class="k">${p.label}</td><td class="d">${p.beschr}</td>
    <td class="n">${p.vp}</td><td class="n"><button class="plain" style="padding:4px 12px;font-size:13px"
    onclick="waehle('${p.id}')" id="kb_${p.id}">wählen</button></td></tr>`).join('');
  const h = HERKUENFTE.find(x=>x.id===ERSCH.herkunft);
  app.innerHTML = `
  <div class="card"><div class="ch"><span>Zweiter Schritt · Veteranenpunkte</span><span id="vpanz">${META.vp} verfügbar</span></div>
   <div class="cb">
    <div class="note"><b>${esc(ERSCH.name)}</b>, ${esc(h.name)}. Die Werte unten sind die, mit denen er einrücken würde.
    Der Vorrat ist die Punktzahl deines besten Laufs; er wird nicht verbraucht, sondern bei jedem Neustart neu verteilt.
    ${META.vp===0?'<br><br><b>Beim ersten Mal hast du nichts.</b> Das gehört dazu — der erste Mann rückt ein, wie er ist.':''}</div>
   </div></div>

  <div class="card"><div class="ch"><span>Attribute ergänzen</span><span>je ${PUNKT_SCHRITT} Punkte · höchstens 70</span></div>
   <div class="cb">
    <p class="hinweis">Gerechnet wird vom jetzigen Wert. Der erste Zehner kostet 1 VP je Punkt, der fünfte schon 4 — wer schon hoch steht, zahlt für jeden weiteren Punkt mehr.</p>
    ${ATTRIBUTE.map(([k,n])=>punktZeile(k,n)).join('')}
   </div></div>

  <div class="card"><div class="ch"><span>Fertigkeiten ergänzen</span><span>je ${PUNKT_SCHRITT} Punkte · höchstens 60</span></div>
   <div class="cb">
    <p class="hinweis">Alle beginnen bei 10, sofern die Herkunft nichts anderes mitgebracht hat. Was darüber hinausgeht, musst du dir im Feld verdienen.</p>
    ${FERTIGKEITEN.map(([k,n])=>punktZeile(k,n)).join('')}
   </div></div>

  <div class="card"><div class="ch"><span>Ausrüstung</span><span>fertige Stücke statt einzelner Punkte</span></div>
   <div class="cb">
    <table><tr><th>Kauf</th><th>Wirkung</th><th class="n">VP</th><th class="n"></th></tr>${zeilen}</table>
    <div style="margin-top:18px;display:flex;gap:10px">
      <button class="plain" onclick="zeigeErschaffung()">Zurück zur Erschaffung</button>
      <button class="plain haupt" id="startbtn" onclick="starte()">Einrücken</button></div>
   </div></div>`;
  aktualisiereLaden();
}
function waehle(id){
  const i = AUSWAHL.indexOf(id);
  if(i>=0) AUSWAHL.splice(i,1);
  else { AUSWAHL.push(id); if(gesamtKosten() > META.vp) AUSWAHL.pop(); }
  aktualisiereLaden();
}
function stellePunkt(k,d){
  const alt = PUNKTE[k]||0, neu = alt + d;
  if(neu < 0 || istWert(k)+neu > punktGrenze(k)) return;
  PUNKTE[k] = neu;
  if(gesamtKosten() > META.vp){ PUNKTE[k] = alt; }     // der Vorrat ist die Grenze
  if(!PUNKTE[k]) delete PUNKTE[k];
  aktualisiereLaden();
}
function aktualisiereLaden(){
  const rest = META.vp - gesamtKosten();
  document.getElementById('vpanz').textContent = `${rest} von ${META.vp} übrig`;
  LADEN.forEach(p=>{
    const b = document.getElementById('kb_'+p.id), z = document.getElementById('kz_'+p.id);
    const drin = AUSWAHL.includes(p.id);
    b.textContent = drin?'gewählt':'wählen';
    b.disabled = !drin && p.vp>rest;
    z.className = drin?'gewaehlt':'';
    b.className = 'plain'+(drin?' gewaehlt':'');
  });
  ATTRIBUTE.concat(FERTIGKEITEN).forEach(([k])=>{
    const p = PUNKTE[k]||0, b = istWert(k);
    const pw = document.getElementById('pw_'+k), pv = document.getElementById('pv_'+k);
    pw.innerHTML = p ? `${b} <i>→</i> <b>${b+p}</b>` : String(b);
    pv.textContent = p?punktKosten(k)+' VP':''; pv.className = 'punktvp'+(p?'':' aus');
    document.getElementById('pz_'+k).className = 'punktzeile'+(p?' gewaehlt':'');
    document.getElementById('pm_'+k).disabled = !p;
    document.getElementById('pa_'+k).disabled =
      b+p+PUNKT_SCHRITT > punktGrenze(k) || kostenVon(b+p, b+p+PUNKT_SCHRITT) > rest;
  });
}

/* ── Charaktererschaffung ──

   **Der Pool ist von 120 auf 60 gesenkt worden (28.07.2026), und das ist die
   größte Einzeländerung am Spielgefühl.** Vorher reichte er für zwei Attribute
   auf 70 *und* Reserve — ein Erstlauf-Mann war damit so gut ausgestattet wie
   ein Veteran, und die Veteranenpunkte waren Zierde: Der Testbot gewann alles,
   ohne je einen zu kaufen.

   Mit 60 Punkten reicht es für ein gutes Attribut und ein halbes. Die Schwelle
   55 der Elitekompanien wird zur Entscheidung statt zur Selbstverständlichkeit,
   und **der Rest des Weges führt über die Veteranenpunkte** — Lauf 2 spielt
   ungefähr auf dem alten Niveau, Lauf 3 und 4 darüber. Damit entsteht die
   Progression, die das Spiel bisher nur behauptet hat: Gegner, gegen die man am
   Anfang chancenlos ist, werden später schlagbar.

   Der Schritt ist 10, also muss POOL durch 10 teilbar sein — sonst lässt sich
   der Vorrat nie ganz verteilen und der „Weiter"-Knopf bleibt gesperrt.
   Invariante 3 bleibt unberührt: Gekauft wird der Ausgangspunkt, nie der
   Aufstieg. */
const POOL = 60, SOCKEL = 20, MAXE = 70;
let ERSCH = null;
function zeigeErschaffung(neu){
  if(neu || !ERSCH){
    ERSCH = {name:'', herkunft:null, attr:{}};
    ATTRIBUTE.forEach(([k])=> ERSCH.attr[k]=SOCKEL);
  }
  const zeilen = ATTRIBUTE.map(([k,n])=>`
    <div class="attrrow">
      <span class="attrname">${mitHilfe(k,n)}${k==='bildung'?' <span style="color:var(--faint);font-size:11px">(fest)</span>':''}</span>
      ${balken('b-brass',ERSCH.attr[k],100).replace('class="bar','id="ab_'+k+'" class="bar')}
      <span class="attrval" id="av_${k}">${ERSCH.attr[k]}</span>
      <span><button class="pmbtn" onclick="stelle('${k}',-10)" id="am_${k}">−</button>
      <button class="pmbtn" onclick="stelle('${k}',10)" id="ap_${k}">+</button></span>
    </div>`).join('');
  app.innerHTML = `
  <div class="stage">${verlauf()}
    <div>
      <div class="card"><div class="ch"><span>Erster Schritt · Wer bist du</span></div><div class="cb">
        <input type="text" id="namefeld" placeholder="Name des Rekruten" value="${esc(ERSCH.name||zufallsName())}" oninput="ERSCH.name=this.value;aktualisiereErschaffung()">
      </div></div>
      <div class="card"><div class="ch"><span>Attribute</span><span id="poolanz">${POOL} Punkte zu verteilen</span></div>
        <div class="cb">${zeilen}
        <p style="color:var(--faint);font-size:12.5px;margin-top:12px">Sockel 20 · höchstens 70 bei der Erschaffung · Bildung ist vom Pool ausgenommen.
        Alle neun Fertigkeiten beginnen bei 10.<br>
        Sechzig Punkte sind wenig, und das ist Absicht: Ein Rekrut ist kein Veteran. Was fehlt, holen die Veteranenpunkte deiner früheren Männer im nächsten Schritt.</p>
        <div style="margin-top:12px"><button class="plain" onclick="wuerfeln()">Auswürfeln</button></div>
      </div></div>
    </div>
    <div class="card"><div class="ch"><span>Herkunft</span><span>je genau 50 Punkte</span></div><div class="cb">
      <div class="herkwahl">${HERKUENFTE.map(h=>`<div class="herk${h.id===ERSCH.herkunft?' on':''}" id="h_${h.id}" onclick="waehleHerkunft('${h.id}')">
        <div class="hn">${h.name}</div><div class="hd">${h.text}</div></div>`).join('')}</div>
      <div style="margin-top:16px"><button class="plain" id="weiterbtn" onclick="zeigeLaden()" disabled>Weiter zu den Veteranenpunkten</button>
      <p class="hinweis" style="margin-top:10px">Danach kannst du auf diese Werte noch Veteranenpunkte legen.</p></div>
    </div></div>
  </div>`;
  ERSCH.name = document.getElementById('namefeld').value;
  aktualisiereErschaffung();
}
function zufallsName(){
  const v=['Étienne','Jean-Baptiste','Pierre','Antoine','Louis','Nicolas','Claude','Michel','François','Gilbert'];
  const n=['Duval','Rey','Vasseur','Marchand','Ferrand','Bonnet','Lemoine','Charpentier','Roussel','Barbier'];
  return v[Math.floor(Math.random()*v.length)]+' '+n[Math.floor(Math.random()*n.length)];
}
function verteilt(){ return ATTRIBUTE.reduce((s,[k])=>s+(ERSCH.attr[k]-SOCKEL),0); }
function stelle(k,d){
  if(k==='bildung') return;
  const neu = ERSCH.attr[k]+d;
  if(neu<SOCKEL || neu>MAXE) return;
  if(d>0 && verteilt()+d>POOL) return;
  ERSCH.attr[k]=neu; aktualisiereErschaffung();
}
function wuerfeln(){
  ATTRIBUTE.forEach(([k])=> ERSCH.attr[k]=SOCKEL);
  const frei = ATTRIBUTE.map(([k])=>k).filter(k=>k!=='bildung');
  let rest = POOL;
  const gew = frei.map(()=>Math.random()+0.35);
  while(rest>0){
    const i = gew.map((g,i)=>[g*Math.random(),i]).sort((a,b)=>b[0]-a[0])[0][1];
    const k = frei[i];
    if(ERSCH.attr[k]+10<=MAXE){ ERSCH.attr[k]+=10; rest-=10; }
    else { gew[i]=0; if(gew.every(g=>g===0)) break; }
  }
  aktualisiereErschaffung();
}
function waehleHerkunft(id){
  ERSCH.herkunft=id;
  HERKUENFTE.forEach(h=> document.getElementById('h_'+h.id).className = 'herk'+(h.id===id?' on':''));
  aktualisiereErschaffung();
}
function aktualisiereErschaffung(){
  const v = verteilt();
  document.getElementById('poolanz').textContent = `${POOL-v} von ${POOL} übrig`;
  ATTRIBUTE.forEach(([k])=>{
    document.getElementById('av_'+k).textContent = ERSCH.attr[k];
    const b = document.getElementById('ab_'+k); if(b) b.querySelector('i').style.width = ERSCH.attr[k]+'%';
    document.getElementById('am_'+k).disabled = (k==='bildung')||ERSCH.attr[k]<=SOCKEL;
    document.getElementById('ap_'+k).disabled = (k==='bildung')||ERSCH.attr[k]>=MAXE||v+10>POOL;
  });
  const b = document.getElementById('weiterbtn');
  if(b) b.disabled = !(ERSCH.herkunft && v===POOL && ERSCH.name.trim().length>0);
}
function starte(){
  laufVerwerfen();       // ein Platz, kein zweiter — der alte Feldzug ist damit vorbei
  neuerLauf(neuerCharakter(ERSCH.name.trim(), ERSCH.herkunft, ERSCH.attr, AUSWAHL, PUNKTE));
  naechster();
}

/* Fortsetzen ist kein Zurückspulen: Der Spielstand zeigt immer auf den letzten
   Schritt, nicht auf den letzten Halt. */
function fortsetzen(){
  const d = laufVorhanden();
  if(!d){ zeigeTitel(); return; }
  LAUF = d; binde(); naechster();
}

/* Welche Wege offenstehen: Ein `ab.min` gegen wert() sperrt den Knopf und
   liefert stattdessen den Satz, der an seine Stelle tritt. */
function marschOffen(e){ return e.optionen.filter(o => !(o.ab && o.probe && wert(o.probe.wert) < o.ab.min)); }
function marschVerwehrt(e){ return e.optionen.filter(o => o.ab && o.probe && wert(o.probe.wert) < o.ab.min); }

/* In welchem Kapitel diese Station liegt. Früher stand hier eine feste Abfrage
   auf Ägypten; mit dem dritten Kapitel wäre das die Stelle gewesen, an der man
   eine zweite Sonderregel danebenschreibt. Stattdessen einmal nachschlagen. */
function kapitelVon(n){
  for(const id in STATIONEN) if((STATIONEN[id]||[]).some(x=>x.id===n.id)) return id;
  return null;
}

function marschWuerfeln(n){
  const gesehen = S.marschGesehen || [];
  const hier = kapitelVon(n);
  const pool = MARSCH_EREIGNISSE.filter(e =>
    !gesehen.includes(e.id) &&
    (!e.kapitel || e.kapitel === hier) &&
    (!e.wenn || e.wenn(n)));
  if(!pool.length || Math.random() > 0.35) return null;
  return pool[Math.floor(Math.random()*pool.length)];
}

function zeigeMarschEreignis(e, n){
  const offen = marschOffen(e);
  const opt = offen.map((o,i)=>`<button class="ord ${o.risk?'risk':''}" onclick="marschWaehlen(${i})">
    ${esc(o.label)}<span class="cost">${esc(o.hint||'')}${o.probe?' · '+NAMEN[o.probe.wert]+' '+wert(o.probe.wert)+' gegen '+o.probe.schw:''}</span></button>`).join('');
  const gesperrt = marschVerwehrt(e).map(o=>`<p>${esc(o.ab.sonst)}</p>`).join('');
  app.innerHTML = `<div class="stage">${verlauf()}
    <div>${wegband(n)}<div class="card"><div class="ch"><span>Auf dem Marsch · ${esc(e.titel)}</span><span>${esc(n.datum||'')}</span></div>
      <div class="cb"><div class="prose">${e.text.map(t=>`<p>${t}</p>`).join('')}${gesperrt}</div></div></div>
      <div class="orders"><div class="ch"><span>Was tust du?</span></div><div class="ordbody">${opt}</div></div>
    </div>${seitenleiste()}</div>`;
  kopfzeile();
}

function marschWaehlen(i){
  // Wächter gegen den zweiten Klick, bevor der Bildschirm ausgetauscht ist
  const e = MARSCH_EREIGNISSE.find(x=>x.id===LAUF.marsch);
  if(!e){ LAUF.marsch = null; naechster(); return; }
  const n = KAPITEL[LAUF.node];
  const o = marschOffen(e)[i];
  if(!o) return;
  let w, klasse='gut', probeText='';
  if(o.probe){
    const p = probe(o.probe.wert, o.probe.schw);
    w = p.erfolg ? o.erfolg : (o.misserfolg||o.erfolg);
    klasse = p.erfolg ? 'gut' : 'schlecht';
    probeText = `<div class="pruefung ${klasse}">${NAMEN[o.probe.wert]} — ${p.erfolg?'gelungen':'misslungen'}</div>`;
  } else w = o.erfolg;
  anwenden(w);
  S.log.push('marsch: '+o.label);
  LAUF.marsch = null;
  laufSichern();
  app.innerHTML = `<div class="stage">${verlauf()}
    <div><div class="card"><div class="ch"><span>Auf dem Marsch · ${esc(e.titel)}</span><span>${esc(n.datum||'')}</span></div>
      <div class="cb"><div class="ergebnis ${klasse}">${w.text}${probeText}</div>${wirkungen(w)}
      </div></div>
      <div class="orders"><div class="ordbody"><button class="ord weiter" onclick="naechster()">Weiter</button></div></div>
    </div>${seitenleiste()}</div>`;
  kopfzeile();
}
