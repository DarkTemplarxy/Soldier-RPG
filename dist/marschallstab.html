<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Der Marschallstab — Italien 1796/97 · Ägypten 1798/99</title>
<style>
:root{
    --bg:#121110; --panel:#1a1816; --panel2:#252119; --line:#3a342c;
    --text:#ded5c4; --dim:#aca192; --faint:#948a79;
    --blood:#c2483a; --brass:#d0a75e; --steel:#8b9aa3; --green:#8b9a68;
    /* Papier: für alles, was im Spiel ein Schriftstück *ist* */
    --papier:#e6dcc2; --papier2:#dbd0b4; --tinte:#2a2420; --tinte2:#584c3c;
    /* Didone — die Schriftform der französischen Zeit um 1800: hohe
       Strichkontraste, senkrechte Achse. Nur Systemschriften, kein Download:
       Das Spiel bleibt eine Datei ohne Abhängigkeiten. Wo keine da ist,
       fällt es auf Georgia zurück, und das ist kein Verlust. */
    --didone:'Didot','Bodoni 72','Bodoni MT','Playfair Display',Georgia,serif;
  }
  /* Kapitälchen statt Versalien: Um 1800 wurden Überschriften gesperrt
     gesetzt, nicht geschrien. `font-variant` erhält die Wortgestalt. */
  h1,.ch,.mini,th{ font-family:var(--didone); }
  h1{ font-variant:small-caps; text-transform:none !important; letter-spacing:.2em; }
  .prose,.ergebnis,.note{ font-variant-numeric:oldstyle-nums; }
  /* Kontrast: --dim und --faint waren #877e71 und #5c554b — auf dem Braun der
     Karten ergab das 2,2:1 bei den Beschriftungen. Jetzt 4,7:1 und 6,6:1.
     Wer hier abdunkelt, macht die Hälfte der Oberfläche wieder unlesbar. */
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);
    font-family:Georgia,'Iowan Old Style',serif;font-size:16px;line-height:1.65;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:1460px;margin:0 auto;padding:24px 20px 70px}

  header.top{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:20px;
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
  h1{font-size:19px;font-weight:normal;letter-spacing:.14em;text-transform:uppercase;margin:0}
  .sub{color:var(--dim);font-size:12.5px;font-style:italic;margin:3px 0 0}
  .hdrright{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
    color:var(--dim);letter-spacing:.1em;text-align:right}

  .card{background:var(--panel);border:1px solid var(--line);margin-bottom:18px}
  .ch{padding:8px 15px;border-bottom:1px solid var(--line);background:var(--panel2);
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#c7bdab;
    display:flex;justify-content:space-between;gap:12px}
  .cb{padding:17px}

  .stage{display:grid;grid-template-columns:246px 1fr 292px;gap:18px;align-items:start}
  @media(max-width:1180px){.stage{grid-template-columns:1fr 292px}
    .stage>.verlauf{grid-column:1/-1;order:2}}
  @media(max-width:900px){.stage{grid-template-columns:1fr}}

  .prose p{margin:0 0 12px}
  .prose p:last-child{margin-bottom:0}
  .prose em{color:#e0d8c8}
  .said{color:var(--dim)}
  .ergebnis{border-left:2px solid var(--brass);background:#1c1915;padding:12px 15px;margin:14px 0 0;font-size:15px}
  .ergebnis.gut{border-left-color:var(--green)}
  .ergebnis.schlecht{border-left-color:var(--blood)}
  .probe{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    color:var(--dim);letter-spacing:.06em;margin-top:8px}

  .who{font-size:17px;margin:0 0 2px}
  .whorank{color:var(--brass);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;margin:0}
  .rangzeile{display:flex;align-items:center;gap:9px;margin:0 0 13px}
  .abzeichen{width:34px;height:23px;flex:0 0 auto;display:block}
  .stat{margin-bottom:9px}
  .statlab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);
    margin-bottom:3px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .bar{height:5px;background:#0c0b0a;border:1px solid #2a2621}
  .bar i{display:block;height:100%;transition:width .3s}
  .b-red i{background:var(--blood)} .b-brass i{background:var(--brass)}
  .b-steel i{background:var(--steel)} .b-green i{background:var(--green)}
  .b-dim i{background:#5c554b}
  .rule{height:1px;background:var(--line);margin:14px 0}
  .kv{display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;gap:10px;
    font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--dim)}
  .kv b{font-weight:normal;color:#f0e7d5}
  .kv .warn{color:var(--blood)} .kv .ok{color:#8b9a68}
  .mini{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:0 0 7px}

  .orders{margin-top:18px;border:1px solid var(--line);background:var(--panel)}
  .ordbody{display:flex;flex-direction:column;gap:8px;padding:14px 15px}
  .ord{background:#100f0d;border:1px solid #443d33;color:var(--text);
    font-family:inherit;font-size:15px;padding:10px 14px;cursor:pointer;text-align:left;
    transition:border-color .15s,color .15s;line-height:1.45}
  .ord:hover:not(:disabled){border-color:var(--brass);color:#efe6d4}
  .ord.risk:hover:not(:disabled){border-color:var(--blood)}
  .ord:disabled{opacity:.32;cursor:not-allowed}
  .ord .cost{display:block;font-size:11.5px;color:var(--faint);letter-spacing:.05em;
    font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:4px}
  .ord.weiter{border-color:var(--brass);color:#efe6d4}

  button.plain{background:#100f0d;border:1px solid #443d33;color:var(--text);
    font-family:inherit;font-size:14px;padding:8px 16px;cursor:pointer}
  button.plain:hover{border-color:var(--brass);color:#efe6d4}
  button.plain:disabled{opacity:.3;cursor:not-allowed}

  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;font-weight:normal;color:var(--dim);font-size:10.5px;
    letter-spacing:.13em;text-transform:uppercase;padding:0 9px 7px 0;
    border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,Consolas,monospace}
  th.n,td.n{text-align:right;white-space:nowrap;font-family:ui-monospace,Menlo,Consolas,monospace}
  td{padding:6px 9px 6px 0;border-bottom:1px solid #232019;vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.k{color:var(--brass);white-space:nowrap}
  td.d{color:#c2b8a6}
  tr.hi td{background:#201d17}
  /* Grün heißt: hier ist etwas dazugekommen */
  tr.gewaehlt td{background:#1a2016}
  tr.gewaehlt td.k{color:#a9bb7d}
  button.plain.gewaehlt{border-color:var(--green);color:#b6c48d}
  button.plain.haupt{border-color:var(--brass);color:#efe6d4}

  .note{border-left:2px solid var(--brass);background:#1c1915;padding:13px 16px;
    color:#c9bfad;font-size:14.5px}
  .note.red{border-left-color:var(--blood)}
  .note.green{border-left-color:var(--green)}
  .note b{color:#e6ddcb;font-weight:normal}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:800px){.grid2{grid-template-columns:1fr}}
  .hidden{display:none !important}
  svg{display:block;width:100%;height:auto}

  /* Charaktererschaffung */
  .attrrow{display:grid;grid-template-columns:118px 1fr 46px 78px;gap:10px;align-items:center;
    margin-bottom:9px}
  .attrname{font-size:14px}
  .attrval{font-family:ui-monospace,monospace;font-size:14px;text-align:right;color:#e6ddcb}
  .pmbtn{background:#100f0d;border:1px solid #443d33;color:var(--text);width:32px;height:26px;
    cursor:pointer;font-family:ui-monospace,monospace;font-size:14px;line-height:1}
  .pmbtn:hover:not(:disabled){border-color:var(--brass)}
  .pmbtn:disabled{opacity:.25;cursor:not-allowed}
  input[type=text]{background:#100f0d;border:1px solid #443d33;color:var(--text);
    font-family:inherit;font-size:15px;padding:8px 11px;width:100%}
  input[type=text]:focus{outline:none;border-color:var(--brass)}
  .herkwahl{display:flex;flex-direction:column;gap:7px}
  .herk{background:#100f0d;border:1px solid #443d33;padding:10px 13px;cursor:pointer;
    font-size:14px;transition:border-color .15s}
  .herk:hover{border-color:#5b4f3a}
  .herk.on{border-color:var(--brass);background:#1c1913}
  .herk .hn{color:var(--brass);font-size:14.5px}
  .herk .hd{color:var(--dim);font-size:13px;margin-top:3px;
    font-family:ui-monospace,monospace;letter-spacing:.02em}

  /* Ausbildung vorwegnehmen — Veteranenpunkte in Werte umsetzen */
  .punktzeile{display:grid;grid-template-columns:1fr 96px 62px 68px;gap:10px;align-items:center;
    padding:5px 6px;border-bottom:1px solid #232019;font-size:14px}
  .punktzeile:last-child{border-bottom:none}
  .punktzeile.gewaehlt{background:#1a2016;box-shadow:inset 2px 0 0 var(--green)}
  .punktwert b{font-weight:normal;color:#a9bb7d}
  .punktzeile.gewaehlt .punktwert i{color:var(--green)}
  .punktwert{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;
    text-align:right;color:#f0e7d5;white-space:nowrap}
  .punktwert i{color:var(--brass);font-style:normal;padding:0 3px}
  .hinweis{color:var(--faint);font-size:13px;margin:0 0 14px}
  .punktvp{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
    text-align:right;color:var(--brass)}
  .punktvp.aus{color:var(--faint)}

  /* Chronikblatt: der Name ist ein Knopf, dahinter steht der ganze Feldzug */
  .namebtn{background:none;border:none;padding:0;cursor:pointer;font-family:inherit;
    font-size:14px;color:#c2b8a6;text-align:left;border-bottom:1px dotted var(--faint)}
  .namebtn:hover{color:var(--brass);border-bottom-color:var(--brass)}
  .blattzeile{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:baseline;
    padding:5px 0;border-bottom:1px solid #232019;font-size:14px;color:#c2b8a6}
  .blattzeile:last-child{border-bottom:none}
  .blattort{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;
    letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
  .tat{display:flex;justify-content:space-between;gap:12px;padding:4px 0;
    border-bottom:1px solid #232019;font-size:14px;color:#c2b8a6}
  .tat:last-child{border-bottom:none}
  .tat b{font-weight:normal;color:#a9bb7d;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}

  /* Kampagnenverlauf links — was man gesehen hat, sieht man; sonst nichts */
  .verlauf .cb{padding:8px 9px}
  .kmp{border-bottom:1px solid #262219}
  .kmp:last-child{border-bottom:none}
  .kmpkopf{display:grid;grid-template-columns:14px 18px 1fr auto;gap:6px;align-items:baseline;
    width:100%;background:none;border:none;padding:8px 6px;cursor:pointer;text-align:left;
    font-family:inherit;color:var(--dim);font-size:14px}
  .kmpkopf:hover{color:#f0e7d5}
  .kmppfeil{color:var(--brass);font-size:10px;line-height:1}
  .kmpnr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:var(--faint)}
  .kmpname{color:inherit}
  .kmpname i{color:var(--brass);font-style:normal;font-size:11.5px;letter-spacing:.06em}
  .kmpjahr{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:var(--faint)}
  .kmp.ungebaut .kmpkopf{color:var(--faint)}
  .kmp.ungebaut .kmppfeil{color:var(--faint)}
  .kmpliste{display:none;padding:0 6px 9px 26px}
  .kmp.auf .kmpliste{display:block}
  .kmpst{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;
    padding:5px 6px 5px 10px;border-left:1px solid #3a342c;font-size:13.5px;color:var(--dim)}
  .kmpst.gefecht{border-left-color:var(--blood)}
  .kmpst.jetzt{border-left-color:var(--brass);background:#221e18}
  .kmpst.jetzt .kmpst-ort{color:#f0e7d5}
  .kmpst-ort{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kmpst-art{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:9.5px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
    border:1px solid #322c25;padding:1px 5px;white-space:nowrap}
  .kmpst.gefecht .kmpst-art{color:#d99184;border-color:#5a2a24}
  .kmpst.jetzt .kmpst-art{color:var(--brass);border-color:#5a4526}
  .kmpleer{padding:5px 0 5px 11px;font-size:12.5px;font-style:italic;color:var(--faint)}

  /* Warnung — nur da, wo es wirklich gleich etwas kostet */
  .warnung{margin:7px 0 0;padding:8px 11px;background:#2a1815;
    border-left:2px solid var(--blood);color:#eab5ab;font-size:13px;line-height:1.5}
  .warnung b{color:#f3d0c8;font-weight:normal;font-family:ui-monospace,Menlo,Consolas,monospace}
  .statlab .warn{color:var(--blood)}

  /* Erklärung beim Überfahren — reines CSS, keine Abhängigkeit */
  .hilfe{position:relative;cursor:help;border-bottom:1px dotted var(--faint)}
  .hilfe:hover{color:#f0e7d5;border-bottom-color:var(--brass)}
  .hilfe:hover::after{content:attr(data-hilfe);position:absolute;z-index:30;
    left:0;top:calc(100% + 7px);width:265px;padding:10px 13px;
    background:#221e18;border:1px solid var(--line);border-left:2px solid var(--brass);
    color:#ded5c4;font-family:Georgia,'Iowan Old Style',serif;font-size:13.5px;
    line-height:1.55;letter-spacing:0;text-transform:none;font-style:normal;
    box-shadow:0 8px 24px rgba(0,0,0,.65)}
  /* In der schmalen Seitenleiste nach links ausklappen, sonst steht es draußen */
  aside .hilfe:hover::after{left:auto;right:0}

  /* Ortswechsel — das Band über der Station */
  .weg{border:1px solid var(--line);border-left:2px solid var(--brass);background:#171512;
    padding:9px 15px;margin-bottom:14px}
  .wegorte{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
    letter-spacing:.13em;text-transform:uppercase;color:#ded5c4}
  .wegorte i{color:var(--brass);font-style:normal;padding:0 9px}
  .wegtext{color:#c2b8a6;font-size:13.5px;font-style:italic;margin-top:3px}

  /* Lagebild vor dem Gefecht */
  .lage{border-top:1px solid var(--line);margin-top:16px;padding-top:13px}
  .lagekopf{font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--brass);margin-bottom:9px}
  .lage table{font-size:13.5px}
  .lage td{padding:4px 12px 4px 0}
  .lage .prose p{margin:0 0 7px;font-size:15px;color:var(--dim)}
  .fein{color:var(--faint);font-size:12.5px;font-family:ui-monospace,Menlo,Consolas,monospace}

  /* Ergebnis einer Probe — nur gelungen oder misslungen, nicht die Rechnung */
  .pruefung{display:block;width:fit-content;margin-top:12px;padding:2px 8px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;
    letter-spacing:.1em;text-transform:uppercase;
    border:1px solid var(--line);background:#100f0d;color:var(--dim)}
  .pruefung.gut{border-color:var(--green);color:#b6c48d}
  .pruefung.schlecht{border-color:var(--blood);color:#e08a7e}

  /* Was sich dadurch geändert hat — die wichtigste Zeile nach jeder Wahl */
  .wirkung{margin-top:13px;padding:9px 14px;background:#221e18;
    border-left:2px solid var(--brass);color:#e2d9c7;font-size:13.5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.02em}
  .wirkung span{display:block;font-size:10.5px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--brass);margin-bottom:3px}

  .log{max-height:200px;overflow-y:auto;font-size:14px;color:var(--dim)}
  .log div{padding:3px 0;border-bottom:1px solid #221f1a}
  .log div:last-child{border-bottom:none}
  .tot{color:var(--blood)}
  .zit{font-style:italic;color:#c2b8a6;border-left:2px solid var(--brass);padding-left:14px;margin:14px 0}
  footer{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);
    color:var(--faint);font-size:12px;font-style:italic;display:flex;
    justify-content:space-between;gap:14px;flex-wrap:wrap}

/* Krankheit: zehrt an jeder Station weiter — rot, weil sie Kosten ist. */
.kv .zehrt{ font-style:normal; font-size:10.5px; color:var(--blood); letter-spacing:.4px; }
.statlab .fein{ font-style:normal; color:var(--faint); font-weight:400; }

/* Das Appell-Bild des Sergenten: zwanzig Silhouetten, die Gefallenen liegend. */
.appell{ display:block; width:100%; max-width:540px; margin:2px 0 8px; }


/* ══════════════════ PAPIER ══════════════════

   Nicht die ganze Oberfläche wird hell — das Dunkel ist die Nacht im
   Feldlager, und die Kontrastregeln oben stehen zu Recht. Aber **alles, was im
   Spiel ein Schriftstück ist**, sieht jetzt aus wie eines: das Chronikblatt,
   die Wertung, der Beförderungsbescheid. Der Wechsel dunkel → hell macht diese
   Augenblicke von allein amtlich, ohne dass ein Wort dazu nötig wäre.

   Kontrast: Tinte #2a2420 auf Papier #e6dcc2 ergibt 11,4 : 1, die blasse Tinte
   #584c3c noch 6,2 : 1 — beides über der 4,5er-Schwelle des Projekts. Wer die
   Papierfarbe abdunkelt, prüft beide nach. */

.papier{ background:var(--papier); color:var(--tinte); border:1px solid #9c8f76;
  box-shadow:0 2px 16px rgba(0,0,0,.55); position:relative;
  background-image:
    linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 38%),
    radial-gradient(circle at 12% 8%, rgba(140,120,86,.16), transparent 42%),
    radial-gradient(circle at 88% 92%, rgba(140,120,86,.13), transparent 46%); }

/* Die Doppellinie am Rand — so wurden militärische Vordrucke gerahmt. */
.papier::before{ content:''; position:absolute; inset:6px; pointer-events:none;
  border:1px solid rgba(90,76,58,.55); box-shadow:inset 0 0 0 3px var(--papier), inset 0 0 0 4px rgba(90,76,58,.3); }
.papier > *{ position:relative }

.papier .ch{ background:transparent; color:#4a3f31; border-bottom:1px solid rgba(90,76,58,.4);
  font-family:var(--didone); letter-spacing:.2em; }
.papier .cb{ color:var(--tinte) }
.papier .prose em, .papier b{ color:#1d1814 }
.papier .said{ color:var(--tinte2) }
.papier table th{ color:#6a5a44; border-bottom-color:rgba(90,76,58,.45) }
.papier table td{ border-bottom-color:rgba(90,76,58,.22) }
.papier td.d{ color:#3a3128 } .papier td.k{ color:#6b4f22 }
.papier tr.hi td{ background:rgba(120,100,70,.13) }
.papier .probe{ color:var(--tinte2) }
.papier .kv{ color:var(--tinte2) } .papier .kv b{ color:var(--tinte) }
.papier .mini{ color:#6b4f22 }
.papier .rule{ background:rgba(90,76,58,.3) }
.papier .note{ background:rgba(120,100,70,.10); border-left-color:#8a6a2c; color:#3a3128 }
.papier .note b{ color:#1d1814 }
.papier .ergebnis{ background:rgba(120,100,70,.10); border-left-color:#8a6a2c; color:#2a2420 }
.papier .wirkung{ background:rgba(120,100,70,.12); border-left-color:#8a6a2c; color:#3a3128 }
.papier .wirkung span{ color:#6b4f22 }
.papier .hinweis, .papier .fein{ color:var(--tinte2) }
.papier button.plain{ background:#dcd0b2; border-color:#9c8f76; color:#2a2420 }
.papier button.plain:hover{ border-color:#6b4f22; color:#120f0c }
.papier .lage{ background:rgba(120,100,70,.10); border-color:rgba(90,76,58,.35) }
.papier .lagekopf{ color:#6b4f22 }
.papier .tat{ border-bottom-color:rgba(90,76,58,.22); color:#3a3128 }
.papier .namebtn{ color:#6b4f22 }
.papier .namebtn:hover{ color:#3d2c12 }
.papier s{ color:#7a6a55 }

/* Der Kopf eines Vordrucks: Republik/Kaiserreich, Einheit, Datum. */
.vordruck{ text-align:center; font-family:var(--didone); color:#4a3f31;
  border-bottom:1px solid rgba(90,76,58,.4); padding-bottom:10px; margin-bottom:14px }
.vordruck .rf{ font-variant:small-caps; letter-spacing:.32em; font-size:12.5px; color:#6b4f22 }
.vordruck .einheit{ font-size:15px; letter-spacing:.08em; margin-top:2px }
.vordruck .wann{ font-size:11.5px; color:var(--tinte2); letter-spacing:.1em; margin-top:2px }

/* ══════════════════ KOKARDE UND ADLER ══════════════════
   1796 ist Republik: Die Trikolore-Kokarde sitzt am Hut, der Adler kommt erst
   1804. Das Emblem im Kopf wechselt deshalb mit dem Kapitel — das UI selbst
   erzählt den Epochenwechsel, ohne ein Wort dazu. */
.emblem{ width:26px; height:26px; flex:0 0 auto; display:block }

/* Knöpfe wie geprägt statt flach — ein Hauch Tiefe, kein Skeuomorphismus. */
.ord, button.plain{ text-shadow:0 1px 0 rgba(0,0,0,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.35) }
.papier button.plain{ text-shadow:0 1px 0 rgba(255,255,255,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6), inset 0 -1px 0 rgba(0,0,0,.12) }

/* Das Appell-Bild des Sergenten: zwanzig Silhouetten, die Gefallenen liegend. */
.appell{ display:block; width:100%; max-width:540px; margin:2px 0 8px }
.papier .appell rect[fill="#4a4136"]{ fill:#4a4136 }

/* Der Handbuch-Link sieht aus wie ein Knopf, ist aber ein Link — er führt aus
   dem Spiel heraus und soll das auch dürfen (target=_blank). */
a.plain{ font-family:inherit; font-size:14px; padding:8px 16px; line-height:1.45;
  color:var(--text); text-decoration:none;
  text-shadow:0 1px 0 rgba(0,0,0,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(0,0,0,.35) }
a.plain:hover{ color:var(--brass) }

/* Die Kokarde im Kartenkopf sitzt **in** der Zeile, nicht darüber. `.emblem`
   steht auf `display:block`, weil es in der Seitenleiste allein in seiner Zelle
   sitzt; im Kartenkopf teilt es sich die Zeile mit dem Titel. */
.ch .emblem{ display:inline-block; vertical-align:-6px; width:20px; height:20px; margin-right:7px }

</style>

const ATTRIBUTE = [

const NAMEN = ATTRIBUTE.concat(FERTIGKEITEN).reduce((o,[k,n])=>(o[k]=n,o),{});
const ERKLAERUNG = ATTRIBUTE.concat(FERTIGKEITEN).reduce((o,[k,,e])=>(o[k]=e||'',o),{});

/* Ein Wort mit Erklärung beim Überfahren. Reines CSS, keine Abhängigkeit. */
function mitHilfe(k, beschriftung){
  const e = ERKLAERUNG[k];
  return e ? `<span class="hilfe" data-hilfe="${String(e).replace(/"/g,'&quot;')}">${beschriftung}</span>` : beschriftung;
}

const RANG = [
  {n:1,name:'Fusilier',wert:0},{n:2,name:'Grenadier',wert:12},{n:3,name:'Caporal',wert:26},
  {n:4,name:'Caporal-fourrier',wert:42},{n:5,name:'Sergent',wert:62}

function rangNameVon(mann){
  if(mann.rang===2) return mann.zweig==='voltigeur' ? 'Voltigeur' : 'Grenadier';
  const r=RANG.find(r=>r.n===mann.rang); return r?r.name:'Fusilier';
}
function rangName(n){ return rangNameVon({rang:n, zweig:S?S.zweig:null}); }
function rangWert(n){ const r=RANG.find(r=>r.n===n); return r?r.wert:0; }

/* Rangabzeichen, so wie man es am Ärmel oder auf der Schulter trägt.
   Der Fusilier trägt nichts — das ist der Witz an ihm. Die Elitekompanien
   erkennt man an der Epaulette (Grenadier rot, Voltigeur grüngelb), die
   Unteroffiziere an den Streifen am Unterarm: Caporal zwei aus Wolle,
   Caporal-fourrier zusätzlich einen quer, Sergent einen aus Tresse. */
function rangabzeichen(mann){
  const r = mann.rang, hoehe = 23;
  const rahmen = i => `<svg class="abzeichen" viewBox="0 0 36 24" role="img" aria-label="Rangabzeichen">
    <rect x="0" y="0" width="36" height="24" rx="2" fill="#26221c" stroke="#3a342c"/>${i}</svg>`;

  if(r===2){                                   // Epaulette auf der Schulter
    const f = mann.zweig==='voltigeur' ? '#9aa85c' : '#c2483a';
    const fransen = [10,14,18,22,26].map(x=>`<rect x="${x}" y="13" width="2" height="7" rx="1"/>`).join('');
    return rahmen(`<rect x="7" y="5" width="22" height="7" rx="3.5" fill="${f}"/>
      <g fill="${f}" opacity=".8">${fransen}</g>`);
  }
  if(r>=3){                                    // Streifen am Unterarm
    const tresse = r>=5;
    const f = tresse ? '#d0a75e' : '#c98a3a';  // Tresse in Metallfarbe, Wolle in Aurore
    const streifen = tresse
      ? `<polygon points="11,19 22,5 29,5 18,19" fill="${f}"/>`
      : `<polygon points="7,19 16,5 21,5 12,19" fill="${f}"/>
         <polygon points="16,19 25,5 30,5 21,19" fill="${f}"/>`;
    const quer = r===4 ? `<rect x="6" y="2.5" width="24" height="2.6" rx="1.3" fill="${f}" opacity=".85"/>` : '';
    return rahmen(streifen + quer);
  }
  return '';                                   // Fusilier: der Ärmel ist leer
}

/* ══════════════════ DIE KETTE ÜBER DIR ══════════════════

   Vier Männer, die ganze Laufbahn lang dieselben. Das ist der Kern: **Wer über
   dir steht, bleibt über dir — weil er selbst aufsteigt.** Martel ist dein
   Sergent, solange du Füsilier bist; wirst du selbst Sergent, ist er längst
   Sergent-major und immer noch dein Vorgesetzter. Man lernt in einer Karriere
   vier Gesichter kennen, nicht vierzehn.

   Ein neues Gesicht gibt es nur, wenn eines fällt — und dann fängt man bei
   Gunst 0 wieder an. Genau deshalb pflegt man zwei Beziehungen und nicht eine
   (KONZEPT §7: „Dein Gönner stirbt bei Eylau, und dein halber aufgebauter

   `stufen` ist die Rangfolge der Person selbst: Index 0, bis sie aufrückt.
   Die Gunst läuft von −5 bis +5 (KONZEPT §8) — negativ heißt, dass jemand
   über dir etwas gegen dich hat, und das blockt. */
const LEUTE = [
  {id:'martel', kurz:'Martel', stufen:['Sergent','Sergent-major'],

   bedingung:'Drei Nennungen im Tagesbefehl'},

     wertvoller als das Gewehr, vergeben für eine einzelne, benannte Tat. Er
     gibt der Sondermissions-Kette, der gefährlichsten Handlung im Spiel,
     endlich einen eigenen Preis: Wer durch die Bresche von Akkon gegangen ist,

   bedingung:'Eine Sondermission voll bestanden und fünf Nennungen'},

   bedingung:'Eine Ehrenwaffe — oder fünf Nennungen und Ruf 45'}
];
function ordenVon(id){ return ORDEN.find(o=>o.id===id) || null; }
function hatOrden(id){ return !!(S && S.orden && S.orden.includes(id)); }

    <rect x="5" y="15" width="5" height="3.4" rx="1.7" fill="#d0a75e"/>
    <path d="M7 14.4 C 10 13, 11 16, 8 17.4" fill="none" stroke="#d0a75e" stroke-width="1.3"/></svg>`;
  if(id==='legion'){
    const arme = [0,90,180,270].map(a=>`<rect x="16.6" y="6" width="2.8" height="12" rx="1.4"
      fill="#e8e2d4" transform="rotate(${a+45} 18 12)"/>`).join('');
    return `<svg class="abzeichen" viewBox="0 0 36 24" role="img" aria-label="Ehrenlegion">
      <rect x="0" y="0" width="36" height="24" rx="2" fill="#26221c" stroke="#3a342c"/>
      <rect x="13" y="2" width="10" height="4" fill="#c2483a"/>
      ${arme}<circle cx="18" cy="12" r="2.6" fill="#d0a75e"/></svg>`;
  }
  return '';
}

     misserfolg:{text:'Der Zahlmeister sagt, die Listen der Armee des Orients seien in Kairo. Kairo, sagst du, ist englisch. Er sagt, das sei nicht sein Problem, und hat damit recht.',belastung:4,geld:4}},
    {label:'Nichts tun und sich umsehen',hint:'Europa',

       belastung:-8,atem:4}}
  ]},

/* 35 */ {typ:'szene',id:'lazarett',datum:'November 1801 · Marseille',ort:'Quarantäne im Lazarett',
  text:[
    'Niemand aus Ägypten kommt ohne Quarantäne ins Land. Sechs Wochen hinter einer Mauer am Hafen, weil man in Marseille die Pest von 1720 nicht vergessen hat und nicht vergessen will.',
    'Es ist das erste Mal seit drei Jahren, dass jemand euch untersucht. Ein Arzt aus der Stadt, kein Feldscher — er hat saubere Hände, Instrumente in einem Kasten und eine Handschrift, die man lesen kann. Er notiert, was er findet, und findet bei jedem etwas.',
    'Die Augenkrankheit, sagt er, geht meistens weg. Die Ruhr auch, wenn man liegt und trinkt und nicht arbeitet. Was nicht weggeht, sagt er nicht, aber man sieht es ihm an, bei wem er es denkt.'
  ],
  optionen:[
    {label:'Sechs Wochen liegen bleiben und tun, was er sagt',hint:'Was aus Ägypten mitkam, bleibt in Marseille',
     erfolg:{text:'Du liegst sechs Wochen auf einer Pritsche und tust nichts, und es ist die vernünftigste Sache, die du in diesem Jahr tust. Was du aus Ägypten mitgebracht hast, geht in Marseille von dir ab — langsam, ohne dass ein Tag der Tag wäre, an dem es aufhört.',
       heilt:'krank',leben:25,belastung:-10}},
    {label:'Dem Arzt zur Hand gehen',hint:'Feldchirurgie · er nimmt jeden, der stillhalten kann',
     probe:{wert:'feldchirurgie',schw:30},
     erfolg:{text:'Er lässt dich halten, waschen und aufschreiben, was er diktiert — die letzten beiden Wochen sogar nähen, an einem Mann, dem es gleich war. Was du bei Guérin und am Sinai gelernt hast, hat zum ersten Mal einen Namen: Er nennt es Erfahrung und sagt es ohne Spott.',
       heilt:'krank',fert:{feldchirurgie:8},attr:{bildung:3},leben:12},
     misserfolg:{text:'Du hältst zweimal nicht still genug, und beim dritten Mal schickt er dich zurück auf die Pritsche. Immerhin liegst du dann. Das ist es, was hilft.',
       heilt:'krank',leben:15}},
    {label:'Über die Mauer und in die Stadt',hint:'Sechs Wochen sind lang',risk:true,
     probe:{wert:'geschick',schw:45},
     erfolg:{text:'Zweimal in sechs Wochen, nachts, über die Mauer am Westende, wo der Wachposten schläft, weil dort seit hundert Jahren nichts passiert. Wein, eine Wirtsstube, Menschen, die nicht deine Uniform tragen. Es ist jedes Mal die Sache wert und heilt nichts.',
       kameradschaft:6,belastung:-8,geld:-6},
     misserfolg:{text:'Beim zweiten Mal steht der Posten doch da. Er meldet es nicht — er nimmt dir das Geld ab und lässt dich zurückklettern. Die sechs Wochen werden dadurch nicht kürzer, und die Ruhr geht davon auch nicht weg.',
       geld:-12,belastung:6}}

/* 36 */ {typ:'szene',id:'einzug',datum:'Dezember 1801 · Nîmes',ort:'Einzug in die Garnison',
  marsch:{von:'Marseille',nach:'Nîmes',weg:'120 km westwärts durch die Rhône-Ebene · fünf Tage, zum ersten Mal auf einer gepflasterten Straße'},
  text:[
    'Nîmes ist eine Stadt aus gelbem Stein mit einem römischen Amphitheater mitten drin, in dem Leute wohnen. Die Halbbrigade bekommt eine Kaserne am nördlichen Tor, zwei Stockwerke, echte Betten, ein Hof zum Exerzieren.',
    'Es ist Textilland hier: Seide, Wolle, Färbereien am Fluss, und ein Bürgertum, das Soldaten für eine Naturgewalt hält — nicht böse, aber besser abgedeckt.',
    'Der Capitaine verliest, was jetzt gilt. Wachdienst, Exerzieren, Kirchgang freiwillig. Und ein Satz, den keiner erwartet hat: Es ist kein Feldzug in Aussicht. Für die nächsten Jahre nicht.',
    'Draußen auf dem Hof braucht einer eine Weile, bis er begreift, was das heißt, und sagt dann laut, was alle denken: Und was machen wir jetzt?'
  ],
  optionen:[
    {label:'Dich beim Waffenmeister melden',hint:'Wer nichts zu tun hat, sucht sich etwas',
     erfolg:{text:'Der Waffenmeister ist ein Piemonteser mit einer Narbe vom Ohr zum Kinn und behauptet, er habe unter dem König gedient. Er fragt nicht, welchem. Er fragt, ob du das Bajonett schon einmal gegen einen benutzt hast, der auch eins hatte, und nickt zu deiner Antwort.',
       fert:{bajonett:5},kameradschaft:4}},
    {label:'Dich in der Stadt umsehen',hint:'Vier Jahre werden hier stattfinden',
     probe:{wert:'menschenkenntnis',schw:30},
     erfolg:{text:'Du gehst zwei Tage lang durch Nîmes und lernst, wo die Wirtsstuben billig sind, welche Färberei Tagelöhner nimmt, und dass die Leute hier über die Armee reden, als wäre sie das Wetter. Wer eine Stadt kennt, hat vier Jahre lang einen Vorteil.',
       fert:{fouragieren:5},attr:{menschenkenntnis:3},geld:5},
     misserfolg:{text:'Du läufst zwei Tage durch enge Gassen, die alle gleich aussehen, und kommst zweimal wieder beim Amphitheater heraus. In einer Wirtsstube zahlst du das Doppelte, weil man dir ansieht, dass du neu bist.',
       geld:-5}},
    {label:'Nach der Schule des Regiments fragen',hint:'Es gibt eine · Bildung',
     erfolg:{text:'Es gibt eine, sagt der Fourier und sieht dabei nicht auf. Ein invalider Sergent unterrichtet im Stall hinter dem Magazin, dienstags und freitags, für den, der will. Es wollen selten mehr als zwölf. Du merkst dir den Weg.',
       attr:{bildung:2},gunst:1,gunstVon:'collot'}},
    {label:'Schlafen',hint:'Zum ersten Mal seit 1798 in einem Bett',
     erfolg:{text:'Ein Strohsack in einem Raum mit einem Dach, das dicht ist, und einem Ofen, den jemand anders heizt. Du schläfst vierzehn Stunden und wachst auf, weil es still ist.',
       belastung:-12,atem:10,leben:15}}
  ]},

/* 37 */ {typ:'winter',id:'saison_nimes1',datum:'Januar–März 1802 · Nîmes',ort:'Erste Garnisonssaison',
  wochen:4,
  frage:'Womit verbringst du diese Monate?',
  weiter:'Das Frühjahr kommt',
  atemText:'Ein Winter in der Kaserne, mit Sold, Ofen und zweimal Essen am Tag.',
  tun:['schule','fechtboden','verdienst','wirtshaus','marketender','ausr','ruhe'],
  rangTun:{4:['magazin'],5:['ausbilden','schreiber','strafdienst']},
  text:[
    'Der erste Winter in Nîmes ist der längste deines Lebens, und das liegt daran, dass nichts passiert. Um sechs Uhr Wecken, Exerzieren bis zehn, Wachdienst nach Liste, um acht Zapfenstreich. Dazwischen liegt der Tag wie ein Feld ohne Weg.',
    'Vier Jahre klingen nach viel. Sie sind es auch — aber sie gehen weg, ohne dass man ihnen dabei zusieht, und am Ende steht die Frage, was in dieser Zeit aus dir geworden ist. Der Krieg wird das prüfen, und er wird nicht ankündigen, wann.',
    'Was du jetzt lernst, kannst du. Was du jetzt nicht lernst, wirst du in fünf Jahren brauchen und nicht haben.'
  ]},

/* 38 */ {typ:'szene',id:'amiens',zwischenfall:true,datum:'April 1802 · Nîmes',ort:'Der Friede von Amiens',
  text:[
    'Am 25. März wird in Amiens Friede mit England geschlossen. Zehn Tage später steht es in der Zeitung, die im Wachlokal herumgeht, und wer lesen kann, liest sie den anderen vor.',
    'Frieden mit allen. Zum ersten Mal seit zehn Jahren. In der Stadt läuten sie die Glocken, und abends brennen auf dem Platz vor dem Amphitheater Fässer mit Pech.',
    'Am nächsten Morgen wird ein zweiter Befehl verlesen: Die Armee wird verkleinert. Wer über vierzig ist, wer nicht mehr voll dienstfähig ist, wer es beantragt, geht nach Hause. Halbsold, ein Abschiedspapier, und ein Platz auf einem Karren nach Norden.',
    'Vier aus deiner Kompanie stehen auf der Liste. Einer davon ist Bertrand, der bei Embabeh im Karree neben dir stand und seitdem nicht mehr richtig hört.'
  ],
  optionen:[
    {label:'Bertrand zum Tor bringen',hint:'Es sieht ihm sonst keiner nach',
     erfolg:{text:'Du trägst seinen Sack bis zum Nordtor, wo die Karren stehen. Er redet die ganze Zeit zu laut, weil er sich selbst nicht hört, und erzählt, was er zu Hause machen wird — sein Bruder hat eine Werkstatt, es gibt Arbeit, es wird schon. Am Tor gibt er dir die Hand und sagt: Pass auf dich auf, wenn es wieder losgeht. Wenn, sagst du. Er hört das Wort nicht.',
       kameradschaft:10,belastung:6}},
    {label:'Fragen, ob du selbst gehen kannst',hint:'Der Frieden könnte halten',risk:true,
     probe:{wert:'menschenkenntnis',schw:50},
     erfolg:{text:'Du fragst den Fourier, halb im Scherz, was ein Antrag kosten würde. Er sieht dich an, ohne zu lachen, und sagt: Was willst du draußen? Du kannst nichts, was man draußen bezahlt. Bleib, lern etwas, und wenn du in fünf Jahren immer noch gehen willst, gehst du als jemand. Es ist der beste Rat, den dir hier jemand gibt, und er kostet dich nichts als den Stolz.',
       gunst:2,gunstVon:'collot',attr:{menschenkenntnis:3}},
     misserfolg:{text:'Du fragst zur falschen Stunde und beim falschen Mann. Der Sergent-major hört es, und ab dann bist du der, der bei der ersten Gelegenheit gehen wollte. Es wird nicht gemeldet. Es wird nur nicht vergessen.',
       ruf:-4,gunst:-1}},
    {label:'Auf dem Platz mitfeiern',hint:'Zehn Jahre Krieg sind vorbei',
     erfolg:{text:'Die halbe Stadt ist auf dem Platz, es gibt Wein aus Fässern, und irgendwann tanzt jemand mit jemandem. Es ist der Abend, an dem du zum ersten Mal seit Toulon nicht daran denkst, was morgen ist. Am nächsten Tag hast du Kopfweh und vier Francs weniger.',
       belastung:-10,kameradschaft:6,geld:-4}},
    {label:'In den Stall zur Schule gehen',hint:'Es sind heute noch weniger da als sonst',
     erfolg:{text:'Der Stall ist fast leer, weil alle auf dem Platz sind. Der invalide Sergent ist trotzdem da und sagt, das treffe sich gut, dann komme man mal weiter. Zwei Stunden für dich allein. Am Ende schreibst du deinen Namen dreimal hintereinander gleich.',
       attr:{bildung:5},gunst:1,gunstVon:'collot'}}
  ]},

/* 39 */ {typ:'szene',id:'begegnung',zwischenfall:true,datum:'Juni 1802 · Nîmes',ort:'Die Färberei am Fluss',
  text:[
    'Sie heißt Marguerite Aubanel, ist die Tochter eines Färbers am Vistre und zählt Ballen, während du im Hof stehst und auf den Feldwebel wartest, der Tuch für die Kompanie holen soll.',
    'Sie sieht auf, sieht die Uniform, sieht wieder weg, zählt weiter. Beim dritten Mal, dass du dort stehst, fragt sie, ob es in Ägypten wirklich keinen Regen gibt. Beim fünften Mal fragt sie nach deinem Namen.',
    'Es ist nichts dabei. Es ist eine Stadt, in der man vier Jahre bleibt, und in solchen Städten passiert so etwas ständig. Man kann es lassen. Die meisten lassen es.'
  ],
  optionen:[
    {label:'Wiederkommen',hint:'Es kostet Abende und ist nicht umsonst',
     erfolg:{text:'Du findest Gründe, in die Färberei zu gehen, und die Gründe werden mit der Zeit dünner. Ihr Vater sieht es und sagt nichts, was in dieser Stadt heißt: noch nicht nein. Im Herbst gehst du an einem Sonntag mit ihr am Fluss entlang, vor Zeugen, und danach weiß es die halbe Straße.',
       setzt:{umworben:true},belastung:-8,geld:-10}},
    {label:'Höflich sein und es dabei belassen',hint:'Ein Soldat zieht weiter',
     erfolg:{text:'Du grüßt, wenn du sie siehst, und sie grüßt zurück, und mehr wird es nicht. Es ist die vernünftige Entscheidung. In zwei Jahren, im Lager von Boulogne, wirst du an einem Abend daran denken und nicht mehr genau wissen, warum du sie getroffen hast.',
       belastung:2}},
    {label:'Sie fragen, ob sie dir schreiben beibringt',hint:'Bildung · sie führt die Bücher ihres Vaters',
     probe:{wert:'menschenkenntnis',schw:35},
     erfolg:{text:'Sie lacht, sagt zuerst nein und fängt dann doch an — sonntags, in der Kontorstube, mit den Rechnungsbüchern ihres Vaters als Vorlage. Sie ist ungeduldiger als der Sergent im Stall und erklärt besser. Nach drei Monaten liest du eine Rechnung, ohne mit dem Finger mitzugehen.',
       setzt:{umworben:true},attr:{bildung:8},fert:{verwaltung:5}},
     misserfolg:{text:'Sie sagt, sie habe die Bücher ihres Vaters zu führen und keine Zeit, einem Soldaten Buchstaben beizubringen. Es ist freundlich gesagt und trotzdem ein Nein. Immerhin weiß sie jetzt, dass du es willst.',
       attr:{bildung:2}}}
  ]},

/* 40 */ {typ:'winter',id:'saison_nimes2',datum:'Juli 1802 – Februar 1803 · Nîmes',ort:'Zweite Garnisonssaison',
  wochen:4,
  frage:'Womit verbringst du diese Monate?',
  weiter:'Der Winter geht',
  atemText:'Ein zweites Jahr in Stein und Ordnung.',
  tun:['schule','fechtboden','verdienst','wirtshaus','marketender','drill','ruhe'],
  rangTun:{4:['magazin'],5:['ausbilden','schreiber','strafdienst']},
  text:[
    'Der Sommer 1802 ist heiß und ereignislos. Im August lässt sich der Erste Konsul auf Lebenszeit wählen, im Mai hat er einen Orden gestiftet, den es noch nicht gibt und über den in der Kaserne schon gestritten wird: ein Orden für Verdienst, nicht für Geburt, und angeblich mit Geld dabei.',
    'Im September wird verlesen, dass aus den Halbbrigaden wieder Regimenter werden sollen — dieselben Männer, dieselben Fahnen, ein anderes Wort. Ein alter Sergent sagt, so habe es vor der Revolution auch geheißen, und wird dafür schief angesehen.',
    'Es ist das zweite Jahr. Wer im ersten nichts angefangen hat, hat jetzt noch zwei.'
  ]},

/* 41 */ {typ:'szene',id:'desertion',zwischenfall:true,datum:'März 1803 · Nîmes',ort:'Der Fall Rouvier',
  text:[
    'Rouvier ist neunzehn, aus einem Dorf bei Alès, seit vierzehn Monaten dabei und seit vier Tagen weg. Er hat keine Waffe mitgenommen, was ihm später hilft, und keinen Urlaubsschein, was ihm nicht hilft.',
    'Die Gendarmerie bringt ihn am Freitag zurück. Sie haben ihn nicht in Alès gefunden, sondern zwölf Meilen weiter, wo eine Erntearbeit war, und er hat nicht einmal versucht wegzulaufen, als sie kamen.',
    'Das Kriegsgericht tagt im Amphitheater, weil es der einzige Raum ist, in den das Bataillon passt. Er bekommt zwei Jahre Kette. Für Desertion in Friedenszeiten ohne Waffe ist das milde, und alle wissen es.',
    'Verlesen wird das Urteil vor der aufmarschierten Truppe, und die Truppe steht dabei still. Du auch.'
  ],
  optionen:[
    {label:'Ihm vorher etwas zu essen bringen',hint:'Er sitzt seit Freitag im Loch',risk:true,
     probe:{wert:'menschenkenntnis',schw:40},
     erfolg:{text:'Der Posten vor dem Arrestlokal ist einer aus deiner Kompanie, und er sieht weg, so lange es dauert. Rouvier isst nichts, redet aber. Er sagt, er habe nur nachsehen wollen, ob sein Vater noch lebt, und sei dann eingeschlafen und habe verschlafen, und dann sei es zu spät gewesen. Du glaubst ihm. Das ändert am Urteil nichts.',
       kameradschaft:10,belastung:6},
     misserfolg:{text:'Der Posten ist keiner aus deiner Kompanie. Er meldet es nicht, aber er lässt dich auch nicht durch, und er sieht dich dabei an wie einen, der etwas vorhat. Du gehst mit dem Brot zurück.',
       belastung:4}},
    {label:'Im Spalier stehen und das Urteil hören',hint:'Es steht so im Reglement',
     erfolg:{text:'Zwölfhundert Mann in drei Gliedern in einem römischen Theater, und in der Mitte ein Neunzehnjähriger, dem der Auditeur zwei Jahre Kette vorliest. Es dauert vier Minuten. Danach ist Ausbildungsdienst wie immer.',
       belastung:4}},
    {label:'Beim Lieutenant ein Wort für ihn einlegen',hint:'Kaltblütigkeit · es wird nichts nützen',risk:true,
     probe:{wert:'kaltbluetigkeit',schw:45},
     erfolg:{text:'Du gehst zu Berthaud, ehe das Gericht tagt, und sagst deinen Satz — kurz, ohne zu betteln, ohne das Urteil in Frage zu stellen: dass der Junge in Ägypten nicht dabei war und nicht weiß, was hier eine Fahnenflucht wiegt. Berthaud hört zu, sagt: Zur Kenntnis genommen, und schickt dich weg. Am Urteil ändert sich nichts. An dem, was er von dir hält, schon.',
       gunst:2,gunstVon:'berthaud',ruf:2},
     misserfolg:{text:'Du kommst zur Unzeit und sagst drei Sätze zu viel. Berthaud lässt dich ausreden und erklärt dir dann, ruhig und der Reihe nach, warum ein Unteroffizier, der so redet, seinen Leuten schadet. Du hast auf jeden Satz eine Antwort und sagst keine davon.',
       gunst:-1,gunstVon:'berthaud',belastung:6}}
  ]},

/* 42 */ {typ:'befoerderung',id:'nimes_musterung',datum:'April 1803 · Nîmes',ort:'Musterung im Kasernenhof',
  text:[
    'Einmal im Jahr wird durchgezählt, und im Frieden zählt man gründlicher, weil man Zeit hat. Der Capitaine sitzt an einem Tisch im Hof, neben ihm der Fourier mit den Büchern, und es geht Mann für Mann.',
    'Es gibt keine Lücken zu füllen, wie es sie in Verona und in Kairo gab. Hier wird niemandes Stelle frei, weil niemand gefallen ist. Was hier zählt, ist, was in den Büchern steht: wer lesen kann, wer rechnen kann, wer im Magazin nichts hat verschwinden lassen.',
    'Es ist die Sorte Beförderung, die man sich in einer Stube verdient und nicht auf einem Damm.'
  ]},

/* 43 */ {typ:'szene',id:'streit',zwischenfall:true,datum:'Juli 1803 · Nîmes',ort:'Das 79. rückt ein',
  text:[
    'Im Sommer legt man ein zweites Regiment nach Nîmes, das 79., frisch aus der Vendée und stolz darauf, nie in Ägypten gewesen zu sein. Zwei Regimenter, eine Stadt, vier Wirtsstuben — das geht selten lange gut.',

    'Die halbe Stube hört es. Deine Leute sehen dich an, weil du der bist, den sie ansehen.'

  optionen:[
    {label:'Es stehen lassen',hint:'Es ist nur ein Sergent aus der Vendée',
     erfolg:{text:'Du trinkst aus, zahlst und gehst. Es ist die Sorte Entscheidung, die niemand lobt und die sich am nächsten Morgen richtig anfühlt. In der Stube redet man noch eine Woche darüber, und dann über etwas anderes.',
       ruf:-3,belastung:4,kameradschaft:-4}},
    {label:'Ihn vor Zeugen berichtigen',hint:'Kaltblütigkeit · ohne die Hand zu heben',
     probe:{wert:'kaltbluetigkeit',schw:40},
     erfolg:{text:'Du stehst auf, gehst zu seinem Tisch und sagst — leise genug, dass er sich vorbeugen muss, laut genug für die zwei Tische daneben —, dass von den achthundert, die in Toulon eingeschifft wurden, dreihundert zurückgekommen sind, und dass er die Namen der anderen fünfhundert gern haben könne, du kennest einige. Dann gehst du zurück und setzt dich. Er sagt in dieser Woche nichts mehr.',
       ruf:4,kameradschaft:8,setzt:{chabert:true}},
     misserfolg:{text:'Du stehst auf und sagst deinen Satz, und er ist einen Satz zu lang. Chabert lacht, und die Stube lacht mit, weil eine Stube immer mit dem lacht, der zuletzt gelacht hat. Du sitzt wieder, und die Sache ist nicht erledigt.',
       ruf:-2,belastung:6,setzt:{chabert:true}}}

/* 44 */ {typ:'szene',id:'marschbefehl',datum:'August 1803 · Nîmes',ort:'Nach Norden',
  text:[
    'Der Friede hat vierzehn Monate gehalten. Im Mai erklärt England wieder den Krieg, und diesmal soll es nicht auf dem Festland ausgetragen werden, sondern drüben: An der Kanalküste wird ein Lager gebaut, hunderttausend Mann stark, für eine Landung in England.',
    'Der Marschbefehl kommt im August. Achthundert Kilometer nach Norden, quer durch Frankreich, sechs Wochen.',

       setzt:{verheiratet:true},geld:35,belastung:-10,gunst:1,gunstVon:'vernet'},

       belastung:8}},
    {label:'Die Nacht in der Stadt verbringen',hint:'Es ist die letzte',
     erfolg:{text:'Du gehst durch Straßen, die du zwanzig Monate lang gegangen bist, und siehst sie zum ersten Mal an. Am Amphitheater sitzen Leute auf den Stufen, wie sie dort seit siebzehnhundert Jahren sitzen. Um vier Uhr früh ist Antreten.',

       ausr:{schuhe:35,muskete:25,tornister:20}},
